          Hub.add(box, Hub.field('Why is it lost?', textArea('lost_reason', 'e.g. No budget this year; try again in September')));
        }
        if (st.to === 'nurture') {
          const jan = nextJanuary(today);
          Hub.add(box, 
            Hub.field(
              'Look again on',
              Hub.dateChips({
                value: st.input.nurture_until,
                chips: [
                  { label: '+30 d', date: Rules.addDays(today, 30) },
                  { label: '+90 d', date: Rules.addDays(today, 90) },
                  { label: 'January', date: jan },
                ],
                onPick: function (d) {
                  st.input.nurture_until = d;
                  st.touched.nurture_until = true;
                  api.refresh();
                },
              })
            )
          );
        }
        if (Rules.TERMS_STAGES.indexOf(st.to) !== -1) {
          Hub.add(box, 
            Hub.field(
              Rules.VALUE_STAGES.indexOf(st.to) !== -1 ? 'What they agreed to' : 'What we are asking for',
              textArea('ask_summary', 'e.g. $1,000 cash; logo on website and Instagram; 2 judge seats')
            )
          );
        }
        if (Rules.VALUE_STAGES.indexOf(st.to) !== -1) {
          Hub.add(box, 
            Hub.field(
              'Value in dollars (0 for goods or in-kind)',
              textInput('potential_value_cad', { type: 'number', min: 0, inputmode: 'decimal' })
            )
          );
          const events = Hub.eventsFor(s.id);
          Hub.add(box, 
            h(
              'div',
              { class: 'field' },
              h('span', { class: 'label' }, 'Events'),
              events.length
                ? h('div', { class: 'hstack wrap' }, events.map(function (e) { return h('span', { class: 'chip event' }, e.name); }))
                : h('p', { class: 'muted small' }, st.to === 'closed_won' ? 'Attach an event first.' : 'No event yet.'),
              h(
                'button',
                {
                  type: 'button',
                  class: 'btn btn-secondary btn-sm',
                  style: 'margin-top:6px',
                  onClick: function () {
                    openAttach({ sponsorId: s.id, onDone: function () { api.refresh(); } });
                  },
                },
                Hub.icon('link'),
                'Attach an event'
              )
            ),
            h(
              'div',
              { class: 'banner warn', style: 'margin-bottom:12px' },
              h(
                'div',
                { class: 'grow' },
                h('p', null, 'A VP confirms amounts, logo placement and perks before they go in writing.'),
                h(
                  'label',
                  { class: 'hstack', style: 'min-height:40px' },
                  h('input', {
                    type: 'checkbox',
                    checked: st.terms,
                    onChange: function (e) {
                      st.terms = e.target.checked;
                      api.refresh();
                    },
                  }),
                  'A VP has confirmed these terms'
                ),
                st.terms && vps.length > 1
                  ? h(
                      'select',
                      {
                        class: 'select',
                        'aria-label': 'Which VP',
                        onChange: function (e) {
                          st.termsBy = e.target.value;
                        },
                      },
                      vps.map(function (m) {
                        const opt = h('option', { value: m.id }, m.full_name);
                        if (m.id === st.termsBy) opt.selected = true;
                        return opt;
                      })
                    )
                  : null,
                st.terms ? null : h('p', { class: 'small', style: 'margin:4px 0 0' }, 'If not, the lead VP gets a task to confirm them.')
              )
            )
          );
        }
        if (['committed', 'closed_won', 'lost', 'nurture'].indexOf(st.to) !== -1) {
          Hub.add(box, Hub.field('One line for next year’s VP (optional)', textArea('summary', 'What happened, in a sentence')));
        }
      }

      function textInput(key, attrs) {
        return h(
          'input',
          Object.assign(
            {
              class: 'input',
              'data-key': 'stage-' + key,
              value: st.input[key] === undefined || st.input[key] === null ? '' : st.input[key],
              onInput: function (e) {
                st.input[key] = e.target.value;
                st.touched[key] = true;
                updateFoot();
              },
            },
            attrs || {}
          )
        );
      }

      function textArea(key, placeholder) {
        return h('textarea', {
          class: 'textarea one-line',
          'data-key': 'stage-' + key,
          rows: 2,
          placeholder: placeholder,
          value: st.input[key] || '',
          onInput: function (e) {
            st.input[key] = e.target.value;
            st.touched[key] = true;
            updateFoot();
          },
        });
      }

      let saveBtn = null;
      let reason = null;
      function foot(f) {
        reason = h('div', { class: 'problem', style: 'margin:0' });
        saveBtn = h('button', { type: 'button', class: 'btn btn-primary-wide', onClick: save }, 'Save');
        Hub.add(f, h('div', { class: 'grow', style: 'display:flex;flex-direction:column;gap:6px' }, saveBtn, reason));
        updateFoot();
      }

      function updateFoot() {
        if (!saveBtn) return;
        const p = problemText();
        saveBtn.disabled = !!p;
        saveBtn.textContent = st.to ? 'Move to ' + Rules.STAGE_LABEL[st.to] : 'Save';
        reason.textContent = st.to ? p : '';
      }

      function save() {
        if (problemText()) return;
        const handle = changeStage(id, st.to, input(), seen);
        if (handle) api.close('saved');
      }

      if (st.to) prefill();
      api.refresh();
      if (st.to) {
        const fields = api.body.querySelector('[data-stage-fields]');
        if (fields) fields.scrollIntoView({ block: 'start' });
      }
      return api;
    }

    /** @param {string} today @returns {string} the first Monday of the coming January */
    function nextJanuary(today) {
      const year = Number(today.slice(0, 4)) + (today.slice(5, 7) === '01' ? 0 : 1);
      let d = year + '-01-04';
      if (d <= today) d = year + 1 + '-01-04';
      return d;
    }

    // ---- Owner ----------------------------------------------------------------------------

    /**
     * Who owns a sponsor (PLAN §10.6): members with how many sponsors they already carry, plus
     * Unassign and "Park until January".
     * @param {string} id
     */
    function openOwner(id) {
      const s = Hub.byId('Sponsors', id);
      if (!s || !Hub.canEdit()) return;
      const loads = {};
      Hub.rows('Sponsors').forEach(function (x) {
        if (x.owner_id && x.archived !== true && Rules.phaseOf(x.stage) !== 'Parked') loads[x.owner_id] = (loads[x.owner_id] || 0) + 1;
      });
      const people = Hub.activeMembers().filter(function (m) {
        return Rules.roleAtLeast(m.role, 'coordinator');
      });
      const items = people.map(function (m) {
        return {
          label: m.id === Hub.state.me.id ? m.full_name + ' (me)' : m.full_name,
          meta: Hub.plural(loads[m.id] || 0, 'sponsor'),
          icon: 'user',
          checked: s.owner_id === m.id,
          onSelect: function () {
            if (s.owner_id !== m.id) updateSponsor(id, { owner_id: m.id });
          },
        };
      });
      if (s.owner_id) {
        items.push({
          label: 'Unassign',
          icon: 'close',
          onSelect: function () {
            updateSponsor(id, { owner_id: '' });
          },
        });
      }
      if (Rules.phaseOf(s.stage) !== 'Won' && s.stage !== 'nurture') {
        items.push({
          label: 'Park until January',
          meta: Rules.dayLabel(nextJanuary(Hub.today())),
          icon: 'later',
          onSelect: function () {
            changeStage(id, 'nurture', { nurture_until: nextJanuary(Hub.today()) });
          },
        });
      }
      Hub.openMenu({ title: 'Owner of ' + s.name, items: items });
    }

    /** "Take it": the signed-in coordinator claims an unowned sponsor. */
    function takeSponsor(id) {
      return updateSponsor(id, { owner_id: Hub.state.me.id });
    }

    // ---- Next action -------------------------------------------------------------------------

    /** Reschedules a sponsor's next action (PLAN §10.9 "Later"; the server leaves a note). */
    function laterSponsor(id) {
      const s = Hub.byId('Sponsors', id);
      if (!s) return;
      Hub.openLater('When instead?', s.next_action_due, function (date) {
        updateSponsor(id, { next_action_due: date });
        Hub.toast({ text: s.name + ': next action moved to ' + Rules.dayLabel(date), ms: 3000 });
      });
    }

    /** Edits a sponsor's next action and due date in a small sheet. */
    function editNext(id) {
      const s = Hub.byId('Sponsors', id);
      if (!s) return;
      const st = { text: s.next_action || '', due: Rules.isIsoDate(s.next_action_due) ? s.next_action_due : Rules.addDays(Hub.today(), 3) };
      const api = Hub.openSheet({
        title: 'Next action',
        size: 'small',
        isDirty: function () {
          return st.text !== (s.next_action || '');
        },
        render: function (body) {
          Hub.add(body, 
            Hub.field('What happens next', h('input', {
              class: 'input',
              'data-key': 'next-text',
              'data-autofocus': 'true',
              value: st.text,
              maxlength: 300,
              onInput: function (e) {
                st.text = e.target.value;
              },
            })),
            Hub.field('By when', Hub.dateChips({
              value: st.due,
              onPick: function (d) {
                st.due = d;
                api.refresh();
              },
            }))
          );
        },
        foot: function (f) {
          Hub.add(f, 
            h('button', {
              type: 'button',
              class: 'btn btn-primary-wide',
              onClick: function () {
                if (!st.text.trim()) {
                  Hub.toast({ error: true, text: 'Say what happens next.' });
                  return;
                }
                const patch = {};
                if (st.text.trim() !== s.next_action) patch.next_action = st.text.trim();
                if (st.due !== s.next_action_due) patch.next_action_due = st.due;
                api.close('saved');
                if (Object.keys(patch).length) updateSponsor(id, patch, { seen: s.updated_at || '', reapply: function () { editNext(id); } });
              },
            }, 'Save')
          );
        },
      });
    }

    // ---- Tasks ---------------------------------------------------------------------------------

    /**
     * Marks a task done (or open again), with Undo.
     * @param {string} id
     * @param {boolean} [done]
     */
    function completeTask(id, done) {
      const t = Hub.byId('Tasks', id);
      if (!t) return;
      const status = done === false ? 'open' : 'done';
      const seen = Hub.versionOf('Tasks', id);
      const handle = Hub.save({
        what: t.title,
        changes: [{ tab: 'Tasks', id: id, patch: { status: status, done_at: status === 'done' ? Hub.nowIso() : '' } }],
        hold: status === 'done' ? 4000 : 0,
        send: function () {
          return Hub.call('updateTask', id, { status: status }, Hub.sendVersion('Tasks', id, seen));
        },
      });
      if (status === 'done') {
        Hub.toast({
          text: 'Done: ' + t.title,
          action: {
            label: 'Undo',
            fn: function () {
              if (!handle.cancel()) completeTask(id, false);
            },
          },
          ms: 6000,
        });
      }
    }

    /** Reschedules a task. */
    function laterTask(id) {
      const t = Hub.byId('Tasks', id);
      if (!t) return;
      const seen = Hub.versionOf('Tasks', id);
      Hub.openLater('When instead?', t.due_on, function (date) {
        Hub.save({
          what: t.title,
          changes: [{ tab: 'Tasks', id: id, patch: { due_on: date } }],
          send: function () {
            return Hub.call('updateTask', id, { due_on: date }, Hub.sendVersion('Tasks', id, seen));
          },
        });
        Hub.toast({ text: 'Moved to ' + Rules.dayLabel(date), ms: 2500 });
      });
    }

    /**
     * Adds a task for the signed-in person.
     * @param {{title: string, due_on?: string, sponsor_id?: string, event_id?: string}} task
     */
    function addTask(task) {
      const id = Hub.uuid();
      const row = Object.assign(
        {
          id: id,
          owner_id: Hub.state.me.id,
          source: 'manual',
          status: 'open',
          due_on: '',
          sponsor_id: '',
          event_id: '',
          done_at: '',
          meeting_id: '',
          created_at: Hub.nowIso(),
          updated_at: '',
        },
        task
      );
      return Hub.save({
        what: task.title,
        inserts: [{ tab: 'Tasks', row: row }],
        send: function () {
          return Hub.call('addTask', Object.assign({ id: id }, task));
        },
      });
    }

    // ---- Events ---------------------------------------------------------------------------------

    /**
     * Attach a sponsor to an event and need, in two short lists, never a combobox (PLAN §10.7).
     * @param {{sponsorId?: string, eventId?: string, needId?: string, onDone?: Function}} opts
     */
    function openAttach(opts) {
      const st = { sponsorId: opts.sponsorId || '', eventId: opts.eventId || '', query: '' };
      const today = Hub.today();
      const api = Hub.openSheet({
        manual: true,
        title: 'Attach to an event',
        size: 'tall',
        render: function (body) {
          if (!st.eventId) return pickEvent(body);
          if (!st.sponsorId) return pickSponsor(body);
          return pickNeed(body);
        },
      });
      api.refresh();

      function pickEvent(body) {
        api.setTitle('Which event?');
        const events = Hub.rows('Events')
          .filter(function (e) {
            return e.status !== 'done' && e.status !== 'cancelled';
          })
          .sort(function (a, b) {
            return String(a.starts_on) < String(b.starts_on) ? -1 : 1;
          });
        Hub.add(body, 
          h(
            'ul',
            { class: 'result-list' },
            events.map(function (e) {
              return h(
                'li',
                null,
                h(
                  'button',
                  {
                    type: 'button',
                    onClick: function () {
                      st.eventId = e.id;
                      api.refresh();
                    },
                  },
                  Hub.icon('events'),
                  h('span', { class: 'grow' }, h('span', { class: 'row-title', style: 'display:block' }, e.name), h('span', { class: 'row-sub', style: 'display:block' }, Rules.dayLabel(e.starts_on) + (e.date_confirmed === true ? '' : ' (date TBC)')))
                )
              );
            })
          )
        );
      }

      function pickSponsor(body) {
        const e = Hub.byId('Events', st.eventId);
        api.setTitle('Which sponsor?');
        const askTypes = {};
        Hub.needsFor(st.eventId).forEach(function (n) {
          askTypes[n.ask_type] = true;
        });
        const results = h('div');
        const input = h('input', {
          class: 'input',
          type: 'search',
          'data-key': 'attach-search',
          placeholder: 'Search sponsors',
          value: st.query,
          onInput: function (ev) {
            st.query = ev.target.value;
            fill();
          },
        });
        Hub.add(body, h('p', { class: 'muted small' }, 'For ' + (e ? e.name : 'the event')), h('div', { class: 'search' }, Hub.icon('search'), input), results);
        function fill() {
          const attached = {};
          Hub.linksForEvent(st.eventId).forEach(function (l) {
            attached[l.sponsor_id] = true;
          });
          let list = st.query.trim()
            ? Rules.searchSponsors(st.query, Hub.rows('Sponsors'), 20)
            : Hub.rows('Sponsors')
                .filter(function (s) {
                  return s.archived !== true && Rules.phaseOf(s.stage) !== 'Parked';
                })
                .sort(function (a, b) {
                  const ma = askTypes[a.ask_type] ? 0 : 1;
                  const mb = askTypes[b.ask_type] ? 0 : 1;
                  return ma - mb || (a.name < b.name ? -1 : 1);
                })
                .slice(0, 30);
          list = list.filter(function (s) {
            return !attached[s.id];
          });
          Hub.fill(results, 
            h(
              'ul',
              { class: 'result-list' },
              list.map(function (s) {
                return h(
                  'li',
                  null,
                  h(
                    'button',
                    {
                      type: 'button',
                      onClick: function () {
                        st.sponsorId = s.id;
                        api.refresh();
                      },
                    },
                    Hub.avatar(s.owner_id),
                    h('span', { class: 'grow' }, h('span', { class: 'row-title', style: 'display:block' }, s.name), h('span', { class: 'row-sub', style: 'display:block' }, (s.ask_type ? s.ask_type + ' · ' : '') + Hub.labelOf(Rules.STAGE_LABEL, s.stage))),
                    askTypes[s.ask_type] ? h('span', { class: 'chip warm' }, 'fits') : null
                  )
                );
              })
            )
          );
        }
        fill();
      }

      function pickNeed(body) {
        const e = Hub.byId('Events', st.eventId);
        const s = Hub.byId('Sponsors', st.sponsorId);
        api.setTitle('Which need?');
        const needs = Hub.needsFor(st.eventId).filter(function (n) {
          return n.status !== 'dropped';
        });
        const coverage = Rules.needCoverage(needs, Hub.linksForEvent(st.eventId), Hub.rows('Sponsors'));
        Hub.add(body, 
          h('p', null, h('strong', null, s ? s.name : ''), ' → ', e ? e.name : ''),
          h('p', { class: 'muted small' }, 'A sponsor counts toward a need once it is in Conversation.'),
          h(
            'ul',
            { class: 'result-list' },
            coverage.map(function (c) {
              return h(
                'li',
                null,
                h(
                  'button',
                  {
                    type: 'button',
                    onClick: function () {
                      attach(c.need.id);
                    },
                  },
                  h('span', { class: 'chip ' + (c.covered ? 'phase-won' : 'outline') }, c.need.ask_type + ' ' + c.count + '/' + c.target),
                  h('span', { class: 'grow truncate' }, c.need.description || '')
                )
              );
            }),
            h(
              'li',
              null,
              h(
                'button',
                {
                  type: 'button',
                  onClick: function () {
                    attach('');
                  },
                },
                h('span', { class: 'chip outline' }, 'No specific need'),
                h('span', { class: 'grow' }, '')
              )
            )
          )
        );
        if (!needs.length) Hub.add(body, h('p', { class: 'muted small' }, 'This event has no needs logged yet.'));
      }

      function attach(needId) {
        const s = Hub.byId('Sponsors', st.sponsorId);
        const e = Hub.byId('Events', st.eventId);
        const id = Hub.uuid();
        const need = needId ? Hub.byId('EventNeeds', needId) : null;
        const fill = {};
        if (need && s && !s.ask_type) fill.ask_type = need.ask_type;
        if (need && s && !s.ask_summary && need.description) fill.ask_summary = need.description;
        const already = Hub.linksFor(st.sponsorId).some(function (l) {
          return l.event_id === st.eventId && (l.event_need_id || '') === (needId || '');
        });
        if (already) {
          api.close('saved');
          Hub.toast({ text: (s ? s.name : 'It') + ' is already attached there.', ms: 3000 });
          if (opts.onDone) opts.onDone();
          return;
        }
        Hub.save({
          what: s ? s.name : 'the sponsor',
          inserts: [{ tab: 'SponsorEvents', row: { id: id, sponsor_id: st.sponsorId, event_id: st.eventId, event_need_id: needId || '', created_at: Hub.nowIso(), updated_at: '' } }],
          changes: Object.keys(fill).length ? [{ tab: 'Sponsors', id: st.sponsorId, patch: fill }] : [],
          send: function () {
            return Hub.call('attachSponsorEvent', { id: id, sponsor_id: st.sponsorId, event_id: st.eventId, event_need_id: needId || '' });
          },
          done: function (res) {
            // The server kept a link it already had: drop this one's placeholder.
            const saved = res && res.rows && res.rows.SponsorEvents && res.rows.SponsorEvents[0];
            if (saved && saved.id !== id && Hub.state.data.SponsorEvents) {
              delete Hub.state.data.SponsorEvents[id];
              Hub.bump();
            }
          },
        });
        api.close('saved');
        Hub.toast({ text: (s ? s.name : 'Sponsor') + ' attached to ' + (e ? e.name : 'the event'), ms: 3000 });
        if (opts.onDone) opts.onDone();
      }

      return api;
    }

    /** Detaches a sponsor from an event (the link row is cleared on the server). */
    function detach(linkId) {
      const link = Hub.byId('SponsorEvents', linkId);
      if (!link) return;
      const s = Hub.byId('Sponsors', link.sponsor_id);
      const e = Hub.byId('Events', link.event_id);
      Hub.save({
        what: s ? s.name : 'the link',
        removes: [{ tab: 'SponsorEvents', id: linkId }],
        send: function () {
          return Hub.call('detachSponsorEvent', linkId);
        },
      });
      Hub.toast({ text: (s ? s.name : 'Sponsor') + ' detached from ' + (e ? e.name : 'the event'), ms: 3000 });
    }

    /** A vp records that the terms are confirmed. */
    function confirmTerms(id) {
      const s = Hub.byId('Sponsors', id);
      if (!s) return;
      const note = {
        id: Hub.uuid(),
        sponsor_id: id,
        member_id: Hub.state.me.id,
        happened_on: Hub.today(),
        kind: 'note',
        summary: Rules.termsConfirmedSummary(s, Hub.state.me.full_name),
        created_at: Hub.nowIso(),
        updated_at: '',
      };
      // The VP confirms the terms they are looking at: a change since then is a conflict.
      const seen = Hub.versionOf('Sponsors', id);
      Hub.save({
        what: s.name,
        inserts: [{ tab: 'Activity', row: note }],
        conflictTab: 'Sponsors',
        send: function () {
          return Hub.call('confirmTerms', id, Hub.sendVersion('Sponsors', id, seen));
        },
        failed: function () {
          if (Hub.state.data.Activity) delete Hub.state.data.Activity[note.id];
        },
        done: function () {
          // the server wrote its own row; drop the placeholder
          if (Hub.state.data.Activity) delete Hub.state.data.Activity[note.id];
          Hub.bump();
        },
      });
      Hub.toast({ text: 'Terms confirmed for ' + s.name, ms: 3000 });
    }

    /** Opens a sponsor: full screen on phones, the side panel beside the Pipeline on desktop. */
    function openSponsor(id) {
      Hub.rememberSponsor(id);
      Hub.go('sponsor', id, { keepScroll: Hub.isDesktop() });
    }

    Object.assign(Hub, {
      updateSponsor: updateSponsor,
      changeStage: changeStage,
      openStage: openStage,
      openOwner: openOwner,
      takeSponsor: takeSponsor,
      laterSponsor: laterSponsor,
      editNext: editNext,
      completeTask: completeTask,
      laterTask: laterTask,
      addTask: addTask,
      openAttach: openAttach,
      detach: detach,
      confirmTerms: confirmTerms,
      openSponsor: openSponsor,
      nextJanuary: nextJanuary,
    });
  })();
</script>

    <script>
  /*
   * Pipeline (docs/PLAN.md §10.6): one list with five phase-count chips that filter it, owner and
   * other filters remembered per browser, a search box, a dense table on desktop and two-line rows
   * on phones. Stage, owner, next action and due are edited in place through the shared dialogs.
   * On wide screens a sponsor opens in a panel beside the list.
   */
  (function () {
    'use strict';
    const Hub = window.Hub;
    const h = Hub.h;
    const PREF = 'pipeline.v1';
    const SORTABLE = { name: 'Sponsor', priority: 'Pri', due: 'Due', last: 'Last contact' };

    function defaults() {
      return {
        owner: Hub.state.me && Hub.state.me.role === 'coordinator' ? 'me' : 'all',
        phase: '',
        priority: '',
        category: '',
        event: '',
        past: false,
        warm: false,
        nocontact: false,
        due: '',
        sort: 'due',
        dir: 1,
      };
    }

    /** The filters, validated against what exists now (a stale member or event id is dropped). */
    function filters() {
      if (!Hub.state.ui.pipeline) {
        const saved = Hub.pref(PREF, null);
        const f = Object.assign(defaults(), saved && typeof saved === 'object' ? saved : {});
        if (f.owner !== 'me' && f.owner !== 'all' && f.owner !== 'none' && !Hub.byId('Members', f.owner)) f.owner = defaults().owner;
        if (f.phase && Rules.PHASES.indexOf(f.phase) === -1) f.phase = '';
        if (f.priority && Rules.ENUMS.priority.indexOf(f.priority) === -1) f.priority = '';
        if (f.category && Rules.ENUMS.category.indexOf(f.category) === -1) f.category = '';
        if (f.event && !Hub.byId('Events', f.event)) f.event = '';
        if (['', 'overdue', 'week'].indexOf(f.due) === -1) f.due = '';
        if (!SORTABLE[f.sort]) f.sort = 'due';
        Hub.state.ui.pipeline = f;
      }
      return Hub.state.ui.pipeline;
    }

    function setFilters(patch) {
      const f = Object.assign(filters(), patch);
      Hub.state.ui.pipeline = f;
      const keep = Object.assign({}, f);
      Hub.setPref(PREF, keep);
    }

    /** Opens the Pipeline with some filters set (from Home's tiles and My work's counts). */
    function setPipelineFilter(patch) {
      setFilters(Object.assign(defaults(), { owner: 'all' }, patch));
      Hub.state.ui.pipelineQuery = '';
      Hub.go('pipeline');
    }

    function activeFilterCount(f) {
      const d = defaults();
      return ['owner', 'phase', 'priority', 'category', 'event', 'past', 'warm', 'nocontact', 'due'].filter(function (k) {
        return f[k] !== d[k];
      }).length;
    }

    /** Applies every filter but the phase (the phase chips show counts across phases). */
    function matches(s, f, today) {
      const me = Hub.state.me;
      if (s.archived === true && f.phase !== 'Parked') return false;
      if (f.owner === 'me' && s.owner_id !== me.id) return false;
      if (f.owner === 'none' && s.owner_id) return false;
      if (f.owner !== 'me' && f.owner !== 'all' && f.owner !== 'none' && s.owner_id !== f.owner) return false;
      if (f.priority && s.priority !== f.priority) return false;
      if (f.category && s.category !== f.category) return false;
      if (f.event && !Hub.linksFor(s.id).some(function (l) { return l.event_id === f.event; })) return false;
      if (f.past && s.is_past_sponsor !== true) return false;
      if (f.warm && !Rules.isWarm(s)) return false;
      if (f.nocontact && Rules.hasContact(s)) return false;
      if (f.due) {
        if (!Rules.requiresNextAction(s.stage)) return false;
        if (f.due === 'overdue' && !(Rules.lacksNextAction(s) || s.next_action_due < today)) return false;
        if (f.due === 'week' && !(Rules.isIsoDate(s.next_action_due) && s.next_action_due <= Rules.weekRange(today).end && s.next_action_due >= today)) return false;
      }
      return true;
    }

    function sortKey(s, key) {
      if (key === 'name') return String(s.name).toLowerCase();
      if (key === 'priority') return (s.priority || 'Z') + String(s.name).toLowerCase();
      if (key === 'last') return s.last_contact_at || '0000';
      // due: broken first, then oldest; no-action stages last
      if (Rules.lacksNextAction(s)) return '0000';
      if (!Rules.requiresNextAction(s.stage)) return '9999';
      return s.next_action_due || '9999';
    }

    /** @returns {{all: Object[], shown: Object[], counts: Object}} */
    function compute(f, query) {
      const today = Hub.today();
      const q = (query || '').trim();
      let base = Hub.rows('Sponsors').filter(function (s) {
        return matches(s, f, today);
      });
      if (q) {
        const found = Rules.searchSponsors(q, base, 500);
        const ids = {};
        found.forEach(function (s) {
          ids[s.id] = true;
        });
        base = base.filter(function (s) {
          return ids[s.id];
        });
      }
      const counts = {};
      Rules.PHASES.forEach(function (p) {
        counts[p] = 0;
      });
      base.forEach(function (s) {
        const p = Rules.phaseOf(s.stage);
        if (p) counts[p]++;
      });
      const shown = base
        .filter(function (s) {
          return !f.phase || Rules.phaseOf(s.stage) === f.phase;
        })
        .sort(function (a, b) {
          const ka = sortKey(a, f.sort);
          const kb = sortKey(b, f.sort);
          const dir = f.sort === 'last' ? -f.dir : f.dir;
          return ka < kb ? -dir : ka > kb ? dir : String(a.name) < String(b.name) ? -1 : 1;
        });
      return { shown: shown, counts: counts };
    }

    function render(route) {
      const f = filters();
      const wide = window.innerWidth >= 1100;
      const panelId = route.v === 'sponsor' && wide ? route.id : '';
      const listBox = h('div', { id: 'pipeline-list' });
      const query = Hub.state.ui.pipelineQuery || '';
      const search = h('input', {
        class: 'input',
        type: 'search',
        'data-key': 'pipeline-search',
        placeholder: 'Search sponsors or contacts',
        'aria-label': 'Search sponsors',
        autocomplete: 'off',
        value: query,
        onInput: function (e) {
          Hub.state.ui.pipelineQuery = e.target.value;
          fill();
        },
      });
      function fill() {
        listBox.replaceChildren(listContent(f, Hub.state.ui.pipelineQuery || '', panelId));
      }
      fill();
      const dupes = Rules.duplicateGroups(Hub.rows('Sponsors'));
      const main = h(
        'div',
        null,
        h(
          'div',
          { class: 'page-head' },
          h('h1', null, 'Pipeline'),
          Hub.canEdit() ? h('button', { type: 'button', class: 'btn btn-sm', onClick: function () { Hub.openAddSponsor(); } }, Hub.icon('plus'), 'Add sponsor') : null
        ),
        h('div', { class: 'search', style: 'margin-bottom:10px' }, Hub.icon('search'), search),
        phaseChips(f),
        filterChips(f),
        dupes.length && !Hub.sessionFlag('dupes-dismissed')
          ? h(
              'div',
              { class: 'banner warn', style: 'margin:10px 0' },
              h(
                'div',
                { class: 'grow' },
                h('p', null, 'Possible duplicates: ', dupes.map(function (g) { return g[0].name + ' (' + g.length + ')'; }).join(', ') + '. Open each and archive one, or rename it.'),
                h('div', { class: 'hstack wrap' }, dupes.slice(0, 4).map(function (g) {
                  return g.map(function (s, i) {
                    return h('button', { type: 'button', class: 'btn btn-secondary btn-xs', onClick: function () { Hub.openSponsor(s.id); } }, s.name + ' #' + (i + 1));
                  });
                }))
              ),
              h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Dismiss', onClick: function () { Hub.setSessionFlag('dupes-dismissed'); Hub.render(); } }, Hub.icon('close'))
            )
          : null,
        listBox
      );
      if (Hub.state.ui.focusSearch) {
        Hub.state.ui.focusSearch = false;
        setTimeout(function () {
          search.focus();
        }, 30);
      }
      if (!panelId) return h('div', { class: 'page' }, main);
      return h(
        'div',
        { class: 'page', style: 'max-width:1500px' },
        h('div', { class: 'detail-layout with-panel' }, main, h('aside', { class: 'detail-panel', 'aria-label': 'Sponsor' }, Hub.sponsorDetail(panelId, { panel: true })))
      );
    }

    function phaseChips(f) {
      const res = compute(Object.assign({}, f, { phase: '' }), Hub.state.ui.pipelineQuery || '');
      return h(
        'div',
        { class: 'chips-row', role: 'group', 'aria-label': 'Phase', style: 'margin-bottom:8px' },
        h(
          'button',
          {
            type: 'button',
            class: 'fchip',
            'aria-pressed': !f.phase ? 'true' : 'false',
            onClick: function () {
              setFilters({ phase: '' });
              Hub.render();
            },
          },
          'All',
          h('span', { class: 'n' }, String(Object.values(res.counts).reduce(function (a, b) { return a + b; }, 0)))
        ),
        Rules.PHASES.map(function (p) {
          return h(
            'button',
            {
              type: 'button',
              class: 'fchip',
              'aria-pressed': f.phase === p ? 'true' : 'false',
              onClick: function () {
                setFilters({ phase: f.phase === p ? '' : p });
                Hub.render();
              },
            },
            p,
            h('span', { class: 'n' }, String(res.counts[p]))
          );
        })
      );
    }

    function filterChips(f) {
      const me = Hub.state.me;
      const ownerLabel = f.owner === 'me' ? 'Mine' : f.owner === 'all' ? 'Everyone' : f.owner === 'none' ? 'Unassigned' : Rules.firstName(Hub.memberName(f.owner));
      const chips = [];
      chips.push(
        menuChip('Owner: ' + ownerLabel, f.owner !== defaults().owner, 'Owner', [
          { label: 'Mine', value: 'me' },
          { label: 'Everyone', value: 'all' },
          { label: 'Unassigned', value: 'none' },
        ].concat(
          Hub.activeMembers()
            .filter(function (m) {
              return Rules.roleAtLeast(m.role, 'coordinator') && m.id !== me.id;
            })
            .map(function (m) {
              return { label: m.full_name, value: m.id };
            })
        ), f.owner, function (v) {
          setFilters({ owner: v });
        })
      );
      chips.push(toggleChip('Overdue', f.due === 'overdue', function () { setFilters({ due: f.due === 'overdue' ? '' : 'overdue' }); }));
      chips.push(toggleChip('Due this week', f.due === 'week', function () { setFilters({ due: f.due === 'week' ? '' : 'week' }); }));
      chips.push(toggleChip('Warm', f.warm, function () { setFilters({ warm: !f.warm }); }));
      chips.push(toggleChip('Past sponsors', f.past, function () { setFilters({ past: !f.past }); }));
      chips.push(toggleChip('No contact', f.nocontact, function () { setFilters({ nocontact: !f.nocontact }); }));
      chips.push(
        menuChip(f.priority ? 'Priority ' + f.priority : 'Priority', !!f.priority, 'Priority', [{ label: 'Any', value: '' }].concat(Rules.ENUMS.priority.map(function (p) { return { label: p, value: p }; })), f.priority, function (v) {
          setFilters({ priority: v });
        })
      );
      chips.push(
        menuChip(f.category ? Rules.CATEGORY_LABEL[f.category] : 'Category', !!f.category, 'Category', [{ label: 'Any', value: '' }].concat(Rules.ENUMS.category.map(function (c) { return { label: Rules.CATEGORY_LABEL[c], value: c }; })), f.category, function (v) {
          setFilters({ category: v });
        })
      );
      const events = Hub.rows('Events').filter(function (e) {
        return e.status !== 'done' && e.status !== 'cancelled';
      });
      chips.push(
        menuChip(f.event ? Hub.shortEventName((Hub.byId('Events', f.event) || {}).name) : 'Event', !!f.event, 'Event', [{ label: 'Any', value: '' }].concat(events.map(function (e) { return { label: e.name, value: e.id }; })), f.event, function (v) {
          setFilters({ event: v });
        })
      );
      if (activeFilterCount(f)) {
        chips.push(
          h(
            'button',
            {
              type: 'button',
              class: 'fchip',
              style: 'border-style:dashed',
              onClick: function () {
                setFilters(defaults());
                Hub.state.ui.pipelineQuery = '';
                Hub.render();
              },
            },
            'Clear'
          )
        );
      }
      return h('div', { class: 'chips-row', role: 'group', 'aria-label': 'Filters' }, chips);
    }

    function toggleChip(label, on, fn) {
      return h(
        'button',
        {
          type: 'button',
          class: 'fchip',
          'aria-pressed': on ? 'true' : 'false',
          onClick: function () {
            fn();
            Hub.render();
          },
        },
        label
      );
    }

    function menuChip(label, on, title, options, value, onPick) {
      return h(
        'button',
        {
          type: 'button',
          class: 'fchip',
          'aria-pressed': on ? 'true' : 'false',
          'aria-haspopup': 'dialog',
          onClick: function () {
            Hub.openMenu({
              title: title,
              items: options.map(function (o) {
                return {
                  label: o.label,
                  checked: o.value === value,
                  onSelect: function () {
                    onPick(o.value);
                    Hub.render();
                  },
                };
              }),
            });
          },
        },
        label,
        ' ▾'
      );
    }

    function listContent(f, query, panelId) {
      const res = compute(f, query);
      const wrap = h('div', { style: 'margin-top:10px' });
      if (!res.shown.length) {
        Hub.add(wrap, 
          h(
            'div',
            { class: 'card' },
            Hub.rows('Sponsors').length
              ? Hub.emptyState('No sponsors match. Clear the filters or add a sponsor.', 'Clear filters', function () {
                  setFilters(defaults());
                  Hub.state.ui.pipelineQuery = '';
                  Hub.render();
                })
              : Hub.emptyState('No sponsors yet. Add the first one, or paste last year’s list into the Sponsors tab.', Hub.canEdit() ? 'Add sponsor' : null, function () {
                  Hub.openAddSponsor();
                })
          )
        );
        return wrap;
      }
      Hub.add(wrap, h('p', { class: 'muted small', style: 'margin:0 0 6px' }, Hub.plural(res.shown.length, 'sponsor') + (f.owner === 'me' ? ' you own' : '')));
      if (Hub.isDesktop()) Hub.add(wrap, table(res.shown, f, panelId));
      else Hub.add(wrap, h('ul', { class: 'list' }, res.shown.map(phoneRow)));
      return wrap;
    }

    function phoneRow(s) {
      const takeable = !s.owner_id && Hub.canEdit();
      const sub = s.next_action || (Rules.requiresNextAction(s.stage) ? 'No next action' : s.stage === 'nurture' ? 'Parked until ' + Rules.dayLabel(s.nurture_until) : '');
      return h(
        'li',
        { class: 'row clickable', onClick: function () { Hub.openSponsor(s.id); } },
        h(
          'div',
          { class: 'row-main' },
          h('div', { class: 'hstack' }, h('span', { class: 'row-title' }, s.name), Hub.priBadge(s.priority), Rules.isWarm(s) ? h('span', { class: 'chip warm' }, 'warm') : null, Rules.hasContact(s) ? null : h('span', { class: 'chip outline' }, 'no contact')),
          h('div', { class: 'row-meta' }, Hub.stageChip(s.stage, Hub.canEdit() ? function () { Hub.openStage(s.id); } : null), h('span', { class: 'row-sub' }, sub))
        ),
        h(
          'div',
          { class: 'hstack', style: 'flex:none;flex-direction:column;align-items:flex-end;gap:4px' },
          Rules.requiresNextAction(s.stage) ? Hub.dueText(s.next_action_due) : null,
          takeable
            ? h('button', { type: 'button', class: 'btn btn-secondary btn-xs', onClick: function (e) { e.stopPropagation(); Hub.takeSponsor(s.id); } }, 'Take it')
            : Hub.avatar(s.owner_id, Hub.canEdit() ? { onClick: function () { Hub.openOwner(s.id); } } : null)
        )
      );
    }

    function table(list, f, panelId) {
      const canEdit = Hub.canEdit();
      const compact = !!panelId;
      function th(key, label, width, cls) {
        const sortable = SORTABLE[key];
        const on = f.sort === key;
        return h(
          'th',
          { style: width ? 'width:' + width : null, class: cls || null, 'aria-sort': on ? (f.dir > 0 ? 'ascending' : 'descending') : null },
          sortable
            ? h(
                'button',
                {
                  type: 'button',
                  onClick: function () {
                    setFilters({ sort: key, dir: on ? -f.dir : 1 });
                    Hub.render();
                  },
                },
                label + (on ? (f.dir > 0 ? ' ↑' : ' ↓') : '')
              )
            : label
        );
      }
      const head = h(
        'tr',
        null,
        th('name', 'Sponsor', compact ? null : '22%'),
        th('priority', 'Pri', '44px'),
        th('stage', 'Stage', '124px'),
        th('owner', 'Owner', '64px'),
        compact ? null : th('next', 'Next action', null),
        th('due', 'Due', compact ? '96px' : '116px'),
        compact ? null : th('last', 'Last contact', '96px', 'col-wide'),
        compact ? null : th('events', 'Events', '150px', 'col-xwide'),
        compact ? null : th('value', 'Value', '76px', 'col-xwide num')
      );
      const body = list.map(function (s) {
        const selected = s.id === panelId;
        return h(
          'tr',
          {
            class: 'clickable' + (selected ? ' selected' : ''),
            onClick: function () {
              Hub.openSponsor(s.id);
            },
          },
          h(
            'td',
            { title: s.name },
            h('span', { style: 'font-weight:600' }, s.name),
            !compact && Rules.isWarm(s) ? h('span', { class: 'chip warm', style: 'margin-left:6px' }, 'warm') : null,
            !compact && !Rules.hasContact(s) ? h('span', { class: 'chip outline', style: 'margin-left:6px' }, 'no contact') : null
          ),
          h('td', null, Hub.priBadge(s.priority)),
          h('td', null, Hub.stageChip(s.stage, canEdit ? function () { Hub.openStage(s.id); } : null)),
          h(
            'td',
            null,
            !s.owner_id && canEdit
              ? h('button', { type: 'button', class: 'btn btn-secondary btn-xs', onClick: function (e) { e.stopPropagation(); Hub.takeSponsor(s.id); }, title: 'Take this sponsor' }, 'Take')
              : Hub.avatar(s.owner_id, canEdit ? { onClick: function () { Hub.openOwner(s.id); } } : null)
          ),
          compact
            ? null
            : h(
            'td',
            { title: s.next_action || '' },
            canEdit && Rules.requiresNextAction(s.stage)
              ? h('button', { type: 'button', class: 'cell-btn', style: 'width:100%', onClick: function (e) { e.stopPropagation(); Hub.editNext(s.id); } }, h('span', { class: 'truncate' }, s.next_action || 'Set a next action'))
              : h('span', { class: 'muted' }, s.next_action || (s.stage === 'nurture' ? 'Parked until ' + Rules.shortDate(s.nurture_until) : '—'))
          ),
          h(
            'td',
            null,
            Rules.requiresNextAction(s.stage)
              ? canEdit
                ? h('button', { type: 'button', class: 'cell-btn', onClick: function (e) { e.stopPropagation(); Hub.laterSponsor(s.id); } }, Hub.dueText(s.next_action_due, { long: !compact }))
                : Hub.dueText(s.next_action_due, { long: !compact })
              : ''
          ),
          compact ? null : h('td', { class: 'muted col-wide' }, s.last_contact_at ? Rules.shortDate(s.last_contact_at) : '—'),
          compact ? null : h('td', { class: 'col-xwide' }, Hub.eventChips(s)),
          compact ? null : h('td', { class: 'col-xwide num' }, s.potential_value_cad !== '' && s.potential_value_cad !== null && s.potential_value_cad !== undefined ? Hub.money(s.potential_value_cad) : '')
        );
      });
      return h('div', { class: 'table-wrap' }, h('table', { class: 'table' }, h('thead', null, head), h('tbody', null, body)));
    }

    Hub.views.pipeline = { title: 'Pipeline', render: render };
    Hub.setPipelineFilter = setPipelineFilter;
    Hub.pipelineFilters = filters;
  })();
</script>

    <script>
  /*
   * Sponsor detail (docs/PLAN.md §10.7). Act first, read the story second, reference last: header,
   * next action card, Log / Copy email, the contact row (tap to call, mail, map), the last touches,
   * then the field groups, each edited in a small form. Full screen on phones, a panel beside the
   * Pipeline on wide screens.
   */
  (function () {
    'use strict';
    const Hub = window.Hub;
    const h = Hub.h;

    const DELIVERABLES = [
      ['logo_received', 'Logo and one-line description received'],
      ['goods_or_payment_received', 'Goods or payment received'],
      ['social_post_done', 'Social post done'],
      ['thank_you_sent', 'Thank-you sent'],
      ['recap_sent', 'Recap and photos sent'],
    ];

    /** @param {string} phone as typed @returns {string} a tel: link with digits only */
    function telHref(phone) {
      const digits = String(phone || '').replace(/[^\d+]/g, '');
      if (!digits) return '';
      return 'tel:' + (digits.length === 10 && digits[0] !== '+' ? '+1' + digits : digits);
    }

    /** @param {string} url @returns {string} an https link, or '' for anything else */
    function safeUrl(url) {
      const u = String(url || '').trim();
      if (!u) return '';
      if (/^https?:\/\//i.test(u)) return u;
      if (/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(u)) return 'https://' + u;
      return '';
    }

    /** @param {string} id @param {{panel?: boolean}} [opts] @returns {HTMLElement} */
    function sponsorDetail(id, opts) {
      const o = opts || {};
      const s = Hub.byId('Sponsors', id);
      if (!s) {
        return h(
          'div',
          null,
          Hub.emptyState('This sponsor is not in the Hub (it may have been removed in the Sheet).', 'Back to the pipeline', function () {
            Hub.go('pipeline');
          })
        );
      }
      const canEdit = Hub.canEdit();
      const today = Hub.today();
      const acts = Hub.activitiesFor(id);
      const phase = Rules.phaseOf(s.stage);
      const wrap = h('div', { class: 'detail' });

      // Header
      Hub.add(wrap, 
        h(
          'div',
          { class: 'detail-head' },
          h(
            'div',
            { class: 'hstack', style: 'margin-bottom:6px' },
            o.panel
              ? h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Close', onClick: function () { Hub.go('pipeline', '', { keepScroll: true }); } }, Hub.icon('close'))
              : h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Back', onClick: function () { Hub.goBack(); } }, Hub.icon('back')),
            h('span', { class: 'grow' }),
            h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'More actions', onClick: function () { moreMenu(s); } }, Hub.icon('kebab'))
          ),
          h('h1', null, s.name),
          h(
            'div',
            { class: 'hstack wrap' },
            canEdit
              ? h('button', { type: 'button', class: 'chip outline', 'aria-label': 'Priority ' + (s.priority || 'not set') + '. Change priority', onClick: function () { priorityMenu(s); } }, Hub.priBadge(s.priority), 'Priority')
              : Hub.priBadge(s.priority),
            Hub.stageChip(s.stage, canEdit ? function () { Hub.openStage(id); } : null),
            canEdit
              ? h(
                  'button',
                  { type: 'button', class: 'chip outline', onClick: function () { Hub.openOwner(id); }, 'aria-label': 'Change owner' },
                  Hub.avatar(s.owner_id),
                  s.owner_id ? Hub.memberName(s.owner_id) : 'Unassigned'
                )
              : h('span', { class: 'chip outline' }, s.owner_id ? Hub.memberName(s.owner_id) : 'Unassigned'),
            Rules.isWarm(s) ? h('span', { class: 'chip warm' }, 'warm') : null,
            s.archived === true ? h('span', { class: 'chip outline' }, 'archived') : null
          ),
          phase === 'Conversation' ? h('p', { class: 'muted small', style: 'margin-top:8px' }, 'Loop in a VP before discussing amounts or perks.') : null
        )
      );

      // Next action card
      if (Rules.requiresNextAction(s.stage)) {
        const overdue = Rules.lacksNextAction(s) || s.next_action_due < today;
        Hub.add(wrap, 
          h(
            'div',
            { class: 'next-card' + (overdue ? ' overdue' : ''), style: 'margin-top:14px' },
            h('p', { class: 'eyebrow' }, 'Next action'),
            h('p', { style: 'font-size:16px;font-weight:600;margin:2px 0 4px' }, s.next_action || 'No next action yet'),
            Hub.dueText(s.next_action_due, { long: true, empty: 'No date' }),
            canEdit
              ? h(
                  'div',
                  { class: 'hstack', style: 'margin-top:10px' },
                  h('button', { type: 'button', class: 'btn btn-sm', onClick: function () { Hub.openLog({ sponsorId: id, kind: Rules.guessKind(s.next_action), fromDone: true }); } }, Hub.icon('check'), 'Done'),
                  h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onClick: function () { Hub.laterSponsor(id); } }, 'Later'),
                  h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onClick: function () { Hub.editNext(id); } }, 'Edit')
                )
              : null
          )
        );
      } else if (s.stage === 'nurture') {
        Hub.add(wrap, h('div', { class: 'next-card', style: 'margin-top:14px;border-left-color:var(--muted)' }, h('p', { class: 'eyebrow' }, 'Parked'), h('p', { style: 'margin:2px 0 0' }, 'Look again on ' + Rules.dayLabel(s.nurture_until))));
      } else if (s.stage === 'lost') {
        Hub.add(wrap, h('div', { class: 'next-card', style: 'margin-top:14px;border-left-color:var(--muted)' }, h('p', { class: 'eyebrow' }, 'Lost'), h('p', { style: 'margin:2px 0 0' }, s.lost_reason || '')));
      }

      // Nurture nudge (PLAN §10.3)
      if (canEdit && Rules.needsNurtureNudge(s, acts) && !Hub.sessionFlag('prompt:' + id + ':nurture')) {
        Hub.add(wrap, 
          h(
            'div',
            { class: 'note-inline', style: 'margin-top:10px' },
            h('span', { class: 'grow' }, 'No reply after 3 touches. Move to Nurture?'),
            h('button', { type: 'button', class: 'btn btn-secondary btn-xs', onClick: function () { Hub.changeStage(id, 'nurture', { nurture_until: Rules.addDays(today, 90) }); } }, 'Move to Nurture'),
            h('button', { type: 'button', class: 'btn btn-ghost btn-xs', onClick: function () { Hub.setSessionFlag('prompt:' + id + ':nurture'); Hub.render(); } }, 'Keep trying')
          )
        );
      }

      // Main actions
      if (canEdit) {
        Hub.add(wrap, 
          h(
            'div',
            { class: 'hstack', style: 'margin-top:14px' },
            h('button', { type: 'button', class: 'btn grow', onClick: function () { Hub.openLog({ sponsorId: id }); } }, Hub.icon('plus'), 'Log a touch'),
            h('button', { type: 'button', class: 'btn btn-secondary grow', onClick: function () { Hub.openCopyEmail(id); } }, Hub.icon('email'), 'Copy email')
          )
        );
      }

      // Contact row
      const links = [];
      if (s.contact_phone && telHref(s.contact_phone)) links.push(h('a', { class: 'btn btn-secondary btn-sm', href: telHref(s.contact_phone), target: '_blank', rel: 'noopener' }, Hub.icon('call'), s.contact_phone));
      if (s.contact_email) links.push(h('a', { class: 'btn btn-secondary btn-sm', href: 'mailto:' + encodeURIComponent(s.contact_email).replace(/%40/g, '@'), target: '_blank', rel: 'noopener' }, Hub.icon('email'), 'Email'));
      if (s.address) links.push(h('a', { class: 'btn btn-secondary btn-sm', href: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.address + (s.neighbourhood ? ', ' + s.neighbourhood : '') + ', Vancouver, BC'), target: '_blank', rel: 'noopener' }, Hub.icon('pin'), 'Map'));
      if (safeUrl(s.website)) links.push(h('a', { class: 'btn btn-secondary btn-sm', href: safeUrl(s.website), target: '_blank', rel: 'noopener' }, Hub.icon('globe'), 'Website'));
      Hub.add(wrap, 
        h(
          'section',
          { class: 'section' },
          h('p', { class: 'eyebrow', style: 'margin-bottom:6px' }, 'Contact'),
          s.contact_name || s.contact_title ? h('p', { style: 'margin-bottom:8px' }, h('strong', null, s.contact_name || ''), s.contact_title ? ' · ' + s.contact_title : '') : null,
          links.length ? h('div', { class: 'contact-row' }, links) : null,
          !Rules.hasContact(s)
            ? h('div', { class: 'note-inline' }, h('span', { class: 'grow' }, 'No contact yet.'), canEdit ? h('button', { type: 'button', class: 'btn btn-secondary btn-xs', onClick: function () { editGroup(s, 'contact'); } }, 'Add contact') : null)
            : null
        )
      );

      // Timeline
      Hub.add(wrap, timeline(s, acts, canEdit));

      // Groups
      const open = Hub.isDesktop();
      Hub.add(wrap, 
        group('Contact details', open, contactBlock(s), canEdit ? function () { editGroup(s, 'contact'); } : null),
        group('Ask and events', open, askBlock(s, canEdit), canEdit ? function () { editGroup(s, 'ask'); } : null),
        Rules.TERMS_STAGES.indexOf(s.stage) !== -1 ? group('Terms', true, termsBlock(s, acts), null) : null,
        phase === 'Won' ? group('Deliverables', true, deliverables(s, canEdit), null) : null,
        group('Fit and priority', open, fitBlock(s), canEdit ? function () { editGroup(s, 'fit'); } : null),
        group('Summary for next year', !!s.summary && open, h('p', { class: s.summary ? '' : 'muted' }, s.summary || 'Nothing yet. A VP writes a line here about how this sponsor went.'), Hub.isVp() ? function () { editGroup(s, 'summary'); } : null),
        group('Past sponsor', s.is_past_sponsor === true && open, h('div', null, h('p', null, s.is_past_sponsor === true ? 'Yes, a past sponsor.' : 'Not a past sponsor.'), s.past_notes ? h('p', null, s.past_notes) : null), canEdit ? function () { editGroup(s, 'past'); } : null)
      );

      // Footer
      Hub.add(wrap, 
        h(
          'p',
          { class: 'muted small', style: 'margin-top:18px' },
          'Added ' + (s.created_at ? Rules.shortDate(Rules.vancouverDate(Date.parse(s.created_at))) : '') + (s.updated_at ? ' · updated ' + Rules.shortDate(Rules.vancouverDate(Date.parse(s.updated_at))) + ' by ' + whoUpdated(s.updated_by) : '')
        )
      );
      return wrap;
    }

    /** @param {string} by updated_by @returns {string} */
    function whoUpdated(by) {
      if (by === 'sheet') return 'someone in the Sheet';
      if (by === 'system') return 'the Hub';
      return Rules.firstName(Hub.memberName(by)) || 'someone';
    }

    function group(title, open, content, onEdit) {
      return h(
        'details',
        { class: 'group', open: open ? true : null },
        h('summary', null, h('span', { class: 'grow' }, title), onEdit ? h('button', { type: 'button', class: 'btn btn-ghost btn-xs', onClick: function (e) { e.preventDefault(); onEdit(); } }, 'Edit') : null),
        h('div', { style: 'padding-bottom:12px' }, content)
      );
    }

    function kv(pairs) {
      const dl = h('dl', { class: 'kv' });
      pairs.forEach(function (p) {
        if (p[1] === null || p[1] === undefined || p[1] === '') return;
        Hub.add(dl, h('dt', null, p[0]), h('dd', null, p[1]));
      });
      return dl.childNodes.length ? dl : h('p', { class: 'muted' }, 'Nothing yet.');
    }

    function contactBlock(s) {
      return kv([
        ['Contact', s.contact_name],
        ['Title', s.contact_title],
        ['Email', s.contact_email],
        ['Phone', s.contact_phone],
        ['Website', s.website],
        ['Address', s.address],
        ['Neighbourhood', s.neighbourhood],
        ['How we know them', s.warm_intro],
        ['Category', Rules.CATEGORY_LABEL[s.category] || s.category],
      ]);
    }

    function askBlock(s, canEdit) {
      const links = Hub.linksFor(s.id);
      return h(
        'div',
        null,
        kv([
          ['Ask type', s.ask_type],
          ['Asking for', s.ask_summary],
          ['Value', s.potential_value_cad !== '' && s.potential_value_cad !== null && s.potential_value_cad !== undefined ? Hub.money(s.potential_value_cad) : ''],
        ]),
        links.length
          ? h(
              'ul',
              { class: 'list' },
              links.map(function (l) {
                const e = Hub.byId('Events', l.event_id);
                const need = l.event_need_id ? Hub.byId('EventNeeds', l.event_need_id) : null;
                return h(
                  'li',
                  { class: 'row', style: '--row-h:48px' },
                  Hub.icon('events', 18),
                  h('div', { class: 'row-main' }, h('div', { class: 'row-title' }, e ? e.name : 'Event'), h('div', { class: 'row-sub' }, need ? 'For ' + need.ask_type + ': ' + (need.description || '') : 'No specific need')),
                  canEdit && l.id && (Hub.isVp() || !s.owner_id || s.owner_id === Hub.state.me.id)
                    ? h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Detach from ' + (e ? e.name : 'event'), onClick: function () { Hub.detach(l.id); } }, Hub.icon('unlink'))
                    : null
                );
              })
            )
          : h('p', { class: 'muted' }, 'Not attached to an event.'),
        canEdit ? h('button', { type: 'button', class: 'btn btn-secondary btn-sm', style: 'margin-top:8px', onClick: function () { Hub.openAttach({ sponsorId: s.id }); } }, Hub.icon('link'), 'Attach to an event') : null
      );
    }

    function termsBlock(s, acts) {
      const note = Rules.termsConfirmedNote(acts, s.id);
      return h(
        'div',
        null,
        kv([
          ['Terms', s.ask_summary || 'Not written down yet'],
          ['Value', s.potential_value_cad !== '' && s.potential_value_cad !== null ? Hub.money(s.potential_value_cad) : 'Not set'],
          ['Confirmed', note ? note.summary.replace(/^Terms confirmed with /, '') + ' (' + Rules.shortDate(note.happened_on) + ')' : 'Not confirmed by a VP'],
        ]),
        !note && Hub.isVp() && s.ask_summary ? h('button', { type: 'button', class: 'btn btn-sm', onClick: function () { Hub.confirmTerms(s.id); } }, 'Confirm terms') : null,
        !note && !Hub.isVp() ? h('p', { class: 'muted small' }, 'A VP confirms amounts and perks before they go in writing.') : null
      );
    }

    function deliverables(s, canEdit) {
      let state = {};
      try {
        state = s.deliverables_json ? JSON.parse(s.deliverables_json) : {};
      } catch (err) {
        state = {};
      }
      const done = DELIVERABLES.filter(function (d) {
        return state[d[0]] === true;
      }).length;
      return h(
        'div',
        { class: 'checklist' },
        h('p', { class: 'muted small' }, done + ' of ' + DELIVERABLES.length + ' done'),
        DELIVERABLES.map(function (d) {
          return h(
            'label',
            null,
            h('input', {
              type: 'checkbox',
              checked: state[d[0]] === true,
              disabled: canEdit ? null : true,
              onChange: function (e) {
                const next = Object.assign({}, state);
                next[d[0]] = e.target.checked;
                Hub.updateSponsor(s.id, { deliverables_json: JSON.stringify(next) });
              },
            }),
            d[1]
          );
        })
      );
    }

    function fitBlock(s) {
      const sug = Rules.suggestPriority(s);
      return h(
        'div',
        null,
        kv(
          Rules.FIT_FIELDS.map(function (k) {
            return [Hub.FIT_LABEL[k], s[k] === '' || s[k] === null || s[k] === undefined ? '' : s[k] + ' / 5'];
          }).concat([['Supports the DTES', s.supports_dtes === true ? 'Yes' : '']])
        ),
        h('p', { class: 'small' }, 'Fit ' + sug.score + '/30 · suggested priority ', h('strong', null, sug.priority), s.priority && s.priority !== sug.priority ? ' (set: ' + s.priority + ')' : '')
      );
    }

    function timeline(s, acts, canEdit) {
      const showAll = Hub.state.ui['tl:' + s.id];
      const list = showAll ? acts : acts.slice(0, 3);
      // The typed note lives in Hub.state.ui, so a redraw (a poll, or the tap on Add) keeps it.
      const draftKey = 'note:' + s.id;
      function send() {
        const text = String(Hub.state.ui[draftKey] || '').trim();
        if (!text) return;
        delete Hub.state.ui[draftKey];
        note.value = '';
        addNote(s, text);
      }
      const note = h('input', {
        class: 'input',
        'data-key': 'note-' + s.id,
        placeholder: 'Add a note for the team…',
        'aria-label': 'Add a note',
        value: Hub.state.ui[draftKey] || '',
        onInput: function (e) {
          Hub.state.ui[draftKey] = e.target.value;
        },
        onKeydown: function (e) {
          if (e.key === 'Enter') send();
        },
      });
      return h(
        'section',
        { class: 'section' },
        Hub.sectionHead(showAll ? 'Timeline' : 'Last touches', acts.length || null),
        canEdit ? h('div', { class: 'hstack', style: 'margin-bottom:8px' }, note, h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onClick: send }, 'Add')) : null,
        acts.length
          ? h(
              'ul',
              { class: 'timeline' },
              list.map(function (a) {
                if (a.kind === 'stage_change') {
                  return h('li', { class: 'tl-divider' }, a.summary + ' · ' + Rules.shortDate(a.happened_on) + ' · ' + Hub.initials(Hub.memberName(a.member_id)));
                }
                const quiet = a.kind === 'note' && /^(Next action moved|Owner changed)/.test(a.summary || '');
                const by = a.member_id !== a.updated_by && a.updated_by && a.updated_by !== 'sheet' && a.updated_by !== 'system' ? ' · logged by ' + Hub.initials(Hub.memberName(a.updated_by)) : '';
                return h(
                  'li',
                  { class: 'tl-item' + (quiet ? ' quiet' : '') },
                  h('span', { class: 'tl-icon', title: Rules.KIND_LABEL[a.kind] || a.kind || '' }, Hub.icon(a.kind)),
                  h(
                    'div',
                    { class: 'grow' },
                    h('div', null, a.summary),
                    h('div', { class: 'tl-meta' }, (Rules.KIND_LABEL[a.kind] || a.kind || 'Note') + ' · ' + Rules.dayLabel(a.happened_on) + ' · ' + (Hub.memberName(a.member_id) || 'someone') + by + (a._local ? ' · saving…' : ''))
                  )
                );
              })
            )
          : h('p', { class: 'muted' }, 'No touches logged yet.'),
        acts.length > 3
          ? h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onClick: function () { Hub.state.ui['tl:' + s.id] = !showAll; Hub.render(); } }, showAll ? 'Show less' : 'Show all ' + acts.length)
          : null
      );
    }

    function addNote(s, text) {
      const id = Hub.uuid();
      const input = { id: id, sponsor_id: s.id, kind: 'note', summary: text, happened_on: Hub.today() };
      Hub.save({
        what: s.name,
        inserts: [{ tab: 'Activity', row: Object.assign({ member_id: Hub.state.me.id, from_stage: '', to_stage: '', created_at: Hub.nowIso(), updated_at: '' }, input) }],
        persist: { fn: 'logTouch', args: [input] },
        send: function () {
          return Hub.call('logTouch', input);
        },
      });
    }

    function moreMenu(s) {
      const items = [{ label: 'Copy brief as text', icon: 'copy', onSelect: function () { copyBrief(s); } }];
      if (Hub.canEdit()) {
        items.push(
          { label: 'Attach to an event', icon: 'link', onSelect: function () { Hub.openAttach({ sponsorId: s.id }); } },
          { label: 'Change stage', icon: 'stage_change', onSelect: function () { Hub.openStage(s.id); } },
          { label: 'Change priority', icon: 'flag', onSelect: function () { priorityMenu(s); } }
        );
      }
      if (Hub.state.appUrl) items.push({ label: 'Copy link', icon: 'link', onSelect: function () { Hub.copyDeepLink('sponsor', s.id); } });
      if (Hub.isVp()) {
        items.push({
          label: s.archived === true ? 'Unarchive' : 'Archive (hide everywhere)',
          icon: 'close',
          danger: s.archived !== true,
          onSelect: function () {
            Hub.updateSponsor(s.id, { archived: s.archived !== true });
          },
        });
      }
      Hub.openMenu({ title: s.name, items: items });
    }

    function priorityMenu(s) {
      const sug = Rules.suggestPriority(s);
      Hub.openMenu({
        title: 'Priority',
        items: Rules.ENUMS.priority.map(function (p) {
          return {
            label: p + (p === sug.priority ? ' (suggested by fit)' : ''),
            checked: s.priority === p,
            onSelect: function () {
              Hub.updateSponsor(s.id, { priority: p });
            },
          };
        }),
      });
    }

    function copyBrief(s) {
      const membersById = {};
      Hub.rows('Members').forEach(function (m) {
        membersById[m.id] = m;
      });
      const events = Hub.linksFor(s.id).map(function (l) {
        const e = Hub.byId('Events', l.event_id) || {};
        return Object.assign({}, e, { need: l.event_need_id ? Hub.byId('EventNeeds', l.event_need_id) : null });
      });
      Hub.copyAndTell(
        Rules.briefText({
          sponsor: s,
          owner: Hub.byId('Members', s.owner_id),
          events: events,
          activities: Hub.activitiesFor(s.id),
          settings: Hub.settings(),
          membersById: membersById,
        }),
        'Brief'
      );
    }

    /** The small forms for each group of fields. Only changed fields are sent. */
    function editGroup(s, which) {
      const FIELDS = {
        contact: [
          ['contact_name', 'Contact name'],
          ['contact_title', 'Title'],
          ['contact_email', 'Email', 'email'],
          ['contact_phone', 'Phone', 'tel'],
          ['website', 'Website', 'url'],
          ['address', 'Address'],
          ['neighbourhood', 'Neighbourhood'],
          ['warm_intro', 'How we know them'],
          ['name', 'Sponsor name'],
          ['category', 'Category', 'category'],
        ],
        ask: [
          ['ask_type', 'Ask type', 'ask'],
          ['ask_summary', 'What we are asking for', 'area'],
          ['potential_value_cad', 'Value in dollars', 'number'],
        ],
        fit: Rules.FIT_FIELDS.map(function (k) {
          return [k, Hub.FIT_LABEL[k], 'fit'];
        }).concat([['supports_dtes', 'Already supports the DTES or food security', 'bool']]),
        summary: [['summary', 'One paragraph on this sponsor, for whoever picks it up next', 'area']],
        past: [
          ['is_past_sponsor', 'Past sponsor', 'bool'],
          ['past_notes', 'Past notes', 'area'],
        ],
      }[which];
      const titles = { contact: 'Contact details', ask: 'Ask', fit: 'Fit', summary: 'Summary', past: 'Past sponsor' };
      const values = {};
      FIELDS.forEach(function (f) {
        const v = s[f[0]];
        values[f[0]] = v === null || v === undefined ? '' : v;
      });
      const api = Hub.openSheet({
        title: titles[which] + ' · ' + s.name,
        size: 'tall',
        isDirty: function () {
          return changed().length > 0;
        },
        render: function (body) {
          FIELDS.forEach(function (f) {
            Hub.add(body, control(f));
          });
        },
        foot: function (f) {
          Hub.add(f, h('button', { type: 'button', class: 'btn btn-primary-wide', onClick: save }, 'Save'));
        },
      });
      function changed() {
        return FIELDS.map(function (f) {
          return f[0];
        }).filter(function (k) {
          return String(values[k]) !== String(s[k] === null || s[k] === undefined ? '' : s[k]);
        });
      }
      function control(f) {
        const key = f[0];
        const type = f[2];
        if (type === 'bool') {
          return h('label', { class: 'hstack', style: 'min-height:44px' }, h('input', { type: 'checkbox', checked: values[key] === true, onChange: function (e) { values[key] = e.target.checked; } }), f[1]);
        }
        if (type === 'fit') {
          return h(
            'div',
            { class: 'hstack', style: 'justify-content:space-between;margin-bottom:8px' },
            h('span', { class: 'small' }, f[1]),
            h(
              'div',
              { class: 'stepper' },
              [0, 1, 2, 3, 4, 5].map(function (n) {
                return h('button', { type: 'button', 'aria-pressed': String(values[key]) === String(n) ? 'true' : 'false', onClick: function () { values[key] = String(values[key]) === String(n) ? '' : n; api.refresh(); } }, String(n));
              })
            )
          );
        }
        if (type === 'category' || type === 'ask') {
          const list = type === 'category' ? Rules.ENUMS.category : Rules.ENUMS.ask_type;
          return Hub.field(
            f[1],
            h(
              'select',
              { class: 'select', onChange: function (e) { values[key] = e.target.value; } },
              type === 'ask' ? h('option', { value: '' }, 'Not decided') : null,
              list.map(function (v) {
                const opt = h('option', { value: v }, type === 'category' ? Rules.CATEGORY_LABEL[v] : v);
                if (v === values[key]) opt.selected = true;
                return opt;
              })
            )
          );
        }
        if (type === 'area') {
          return Hub.field(f[1], h('textarea', { class: 'textarea', 'data-key': 'edit-' + key, value: values[key], onInput: function (e) { values[key] = e.target.value; } }));
        }
        return Hub.field(
          f[1],
          h('input', {
            class: 'input',
            'data-key': 'edit-' + key,
            type: type === 'number' ? 'number' : type || 'text',
            min: type === 'number' ? 0 : null,
            value: values[key],
            onInput: function (e) {
              values[key] = e.target.value;
            },
          })
        );
      }
      function save() {
        const keys = changed();
        if (!keys.length) {
          api.close();
          return;
        }
        const patch = {};
        keys.forEach(function (k) {
          let v = values[k];
          if (k === 'potential_value_cad') v = v === '' ? '' : Number(v);
          if (typeof v === 'string') v = v.trim();
          patch[k] = v;
        });
        if (patch.name !== undefined) {
          const sim = Rules.findSimilarSponsors(patch.name, Hub.rows('Sponsors').filter(function (x) { return x.id !== s.id; }));
          if (sim.exact) {
            Hub.toast({ error: true, text: 'Already here: ' + sim.exact.name + '.' });
            return;
          }
        }
        api.close('saved');
        // s is the sponsor as the editor opened: a colleague's save since then is a conflict.
        Hub.updateSponsor(s.id, patch, { seen: s.updated_at || '', reapply: function () { editGroup(Hub.byId('Sponsors', s.id) || s, which); } });
      }
    }

    Hub.views.sponsor = {
      title: function () {
        const s = Hub.state.route && Hub.byId('Sponsors', Hub.state.route.id);
        return s ? s.name : 'Sponsor';
      },
      render: function (route) {
        Hub.rememberSponsor(route.id);
        if (window.innerWidth >= 1100) return Hub.views.pipeline.render(route);
        return h('div', { class: 'page' }, sponsorDetail(route.id));
      },
    };
    Hub.sponsorDetail = sponsorDetail;
    Hub.safeUrl = safeUrl;
  })();
</script>

    <script>
  /*
   * My work (docs/PLAN.md §10.9): the coordinator's landing view. The week in one line and two
   * neutral bars (never red, never compared), one Today list overdue-first with Done and Later on
   * every row, "Add a task", and the night-before check that makes Monday's scoreboard honest.
   */
  (function () {
    'use strict';
    const Hub = window.Hub;
    const h = Hub.h;
    const COUNTS_LINE = 'Remote = email, call and follow-up ("I sent it" counts). Walk-ins = walk-in. Replies, meetings and commitments are shown separately.';

    /** @param {Object} e @returns {string} when the asks are due, or '' when no date is set */
    function asksText(e) {
      const since = Rules.daysBetween(e.asks_due_on, Hub.today());
      if (since === null) return '';
      if (since > 0) return 'asks were due ' + Rules.shortDate(e.asks_due_on);
      if (since === 0) return 'asks are due today';
      return 'asks out by ' + Rules.shortDate(e.asks_due_on);
    }

    function render() {
      const me = Hub.state.me;
      const today = Hub.today();
      const set = Hub.settings();
      const sponsors = Hub.rows('Sponsors');
      const queue = Rules.myQueue(me.id, { sponsors: sponsors, tasks: Hub.rows('Tasks'), events: Hub.rows('Events') }, today);
      const inWindow = Rules.isBeforeMeetingWindow(Hub.now(), set.meeting);
      // In the window before a Monday meeting, the count is still last week's (the one to finish).
      const week = Rules.weekRange(inWindow ? Rules.reportWeekDate(today, set.meeting) : today);
      const counts = Rules.weekCounts(Hub.rows('Activity'), me.id, week.start, week.end, Hub.warmIds());
      const quota = Rules.quotaFor(me, set.quotas);
      const overdue = queue.filter(function (i) {
        return i.group === 'overdue';
      });
      const status = Rules.weekStatusLine(counts, quota, overdue.length, inWindow, set.meeting);
      const active = Rules.activeSponsorCount(sponsors, me.id);

      const page = h('div', { class: 'page' });
      Hub.add(page, 
        h(
          'div',
          { class: 'page-head' },
          h('div', { class: 'grow' }, h('p', { class: 'eyebrow' }, Rules.dayLabel(today)), h('h1', null, 'My work')),
          h('button', { type: 'button', class: 'btn btn-sm desktop-only', onClick: function () { Hub.openLog({}); } }, Hub.icon('plus'), 'Log a touch')
        )
      );

      // The week
      const weekCard = h(
        'section',
        { class: 'card card-pad' + (inWindow ? ' before-meeting' : '') },
        h('p', { style: 'font-weight:700;margin-bottom:10px' }, status),
        h(
          'div',
          { class: 'stack' },
          quotaBar('Remote touches', counts.remote, quota ? quota.remote : null, counts.remoteWarm ? counts.remoteWarm + ' to warm sponsors' : ''),
          quotaBar('Walk-ins', counts.walkins, quota ? quota.walkins : null)
        ),
        h('p', { class: 'muted small', style: 'margin:10px 0 0' }, 'Replies ' + counts.replies + ' · meetings ' + counts.meetings + ' · commitments ' + counts.commitments + ' count too.'),
        inWindow
          ? h(
              'div',
              { style: 'margin-top:12px' },
              overdue.length
                ? h('p', { class: 'small' }, 'Clear the ' + Hub.plural(overdue.length, 'overdue item') + ' below and log anything you did this week. ' + Rules.meetingName(set.meeting).replace(/^./, function (c) { return c.toUpperCase(); }) + ' shows exactly these numbers.')
                : h('p', { class: 'small', style: 'color:var(--ok);font-weight:600' }, 'Ready for ' + Rules.meetingName(set.meeting) + '.'),
              h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onClick: function () { Hub.openLog({ backdate: true }); } }, Hub.icon('plus'), 'Log something you did this week')
            )
          : null,
        h('p', { class: 'muted small', style: 'margin:8px 0 0' }, COUNTS_LINE),
        quota && active < 10 && sponsors.length
          ? h(
              'div',
              { class: 'note-inline', style: 'margin-top:10px' },
              h('span', { class: 'grow' }, 'You own ' + Hub.plural(active, 'active sponsor') + '; ' + quota.remote + ' touches a week needs about 10.'),
              h('button', { type: 'button', class: 'btn btn-secondary btn-xs', onClick: function () { Hub.setPipelineFilter({ owner: 'none' }); } }, 'Take some'),
              h('button', { type: 'button', class: 'btn btn-ghost btn-xs', onClick: function () { Hub.openAddSponsor(); } }, 'Add targets')
            )
          : null
      );
      Hub.add(page, weekCard);

      // Today list
      Hub.add(page, todayList(queue));

      // Events that need sponsors soon, one line each
      Hub.add(page, eventAlerts(today));

      // Add a task
      Hub.add(page, addTaskBox());

      // My sponsors by phase
      const mine = sponsors.filter(function (s) {
        return s.owner_id === me.id && s.archived !== true;
      });
      Hub.add(page, 
        h(
          'section',
          { class: 'section' },
          Hub.sectionHead('My sponsors', mine.length),
          mine.length
            ? h(
                'div',
                { class: 'chips-row' },
                Rules.PHASES.map(function (p) {
                  const n = mine.filter(function (s) {
                    return Rules.phaseOf(s.stage) === p;
                  }).length;
                  return h('button', { type: 'button', class: 'fchip', onClick: function () { Hub.setPipelineFilter({ owner: 'me', phase: p }); } }, p, h('span', { class: 'n' }, String(n)));
                })
              )
            : h('div', { class: 'card' }, Hub.emptyState('No sponsors yet. Joseph assigns them at the meeting, or take one that nobody owns.', 'See unassigned sponsors', function () { Hub.setPipelineFilter({ owner: 'none' }); }))
        )
      );

      // Logged this week
      const logged = Hub.rows('Activity')
        .filter(function (a) {
          return a.member_id === me.id && a.kind !== 'stage_change' && Rules.isInRange(a.happened_on, week.start, week.end);
        })
        .sort(function (a, b) {
          return (b.happened_on || '') < (a.happened_on || '') ? -1 : 1;
        });
      Hub.add(page, 
        h(
          'details',
          { class: 'section card card-pad' },
          h('summary', { style: 'cursor:pointer;font-weight:600' }, 'Logged this week: ' + logged.length),
          logged.length
            ? h(
                'ul',
                { class: 'timeline', style: 'margin-top:8px' },
                logged.map(function (a) {
                  const s = Hub.byId('Sponsors', a.sponsor_id);
                  return h(
                    'li',
                    { class: 'tl-item' },
                    h('span', { class: 'tl-icon' }, Hub.icon(a.kind)),
