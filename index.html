<!DOCTYPE html>
<html lang="en">
  <head>
    
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Sponsorship Hub · Project Hastings</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23cd1e2f%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27Arial%27 font-size=%2716%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3EPH%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <style>
  /* Design system (docs/PLAN.md §9). Accent is Project Hastings red (#CD1E2F). Status colours
     (overdue, soon, ok) mean due state and event health only, always with a dot, stripe or word.
     Two breakpoints: phone below 768px, desktop from 768px. */
  :root {
    --accent: #cd1e2f;
    --accent-strong: #a8141f;
    --accent-soft: #fbe9ea;
    --on-accent: #ffffff;
    --bg: #faf6f5;
    --surface: #ffffff;
    --surface-2: #f4eeed;
    --text: #231f20;
    --muted: #6b6162;
    --line: #e8dedc;
    --line-strong: #d6c9c6;
    --overdue: #b3261e;
    --overdue-soft: #fdecea;
    --soon: #8a5300;
    --soon-soft: #fdf2df;
    --ok: #1d7342;
    --ok-soft: #e4f3ea;
    --phase-prospect-bg: #efe9e7;
    --phase-prospect-fg: #4a4243;
    --phase-outreach-bg: #fbe2e4;
    --phase-outreach-fg: #9c1220;
    --phase-conversation-bg: #cd1e2f;
    --phase-conversation-fg: #ffffff;
    --phase-won-bg: #e4f3ea;
    --phase-won-fg: #1d6a3e;
    --phase-parked-bg: #f1edec;
    --phase-parked-fg: #6b6162;
    --shadow: 0 10px 30px rgba(35, 31, 32, 0.18), 0 2px 6px rgba(35, 31, 32, 0.08);
    --radius: 12px;
    --radius-sm: 8px;
    --gutter: 16px;
    --tap: 44px;
    --row-h: 56px;
    --tabbar-h: 60px;
    --sidebar-w: 224px;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --accent: #f0606c;
      --accent-strong: #ff8a94;
      --accent-soft: #3a2124;
      --on-accent: #1a1617;
      --bg: #161314;
      --surface: #211d1e;
      --surface-2: #2a2526;
      --text: #f3eeee;
      --muted: #b8adae;
      --line: #3a3335;
      --line-strong: #4a4244;
      --overdue: #ff8a80;
      --overdue-soft: #3b1f1d;
      --soon: #ffb74d;
      --soon-soft: #3a2c17;
      --ok: #6fcf97;
      --ok-soft: #1c3326;
      --phase-prospect-bg: #2e2829;
      --phase-prospect-fg: #e4dbdc;
      --phase-outreach-bg: #46242a;
      --phase-outreach-fg: #ffb3ba;
      --phase-conversation-bg: #f0606c;
      --phase-conversation-fg: #1a1617;
      --phase-won-bg: #1c3a29;
      --phase-won-fg: #8fe0b0;
      --phase-parked-bg: #2a2526;
      --phase-parked-fg: #b8adae;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.4);
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --accent: #f0606c;
    --accent-strong: #ff8a94;
    --accent-soft: #3a2124;
    --on-accent: #1a1617;
    --bg: #161314;
    --surface: #211d1e;
    --surface-2: #2a2526;
    --text: #f3eeee;
    --muted: #b8adae;
    --line: #3a3335;
    --line-strong: #4a4244;
    --overdue: #ff8a80;
    --overdue-soft: #3b1f1d;
    --soon: #ffb74d;
    --soon-soft: #3a2c17;
    --ok: #6fcf97;
    --ok-soft: #1c3326;
    --phase-prospect-bg: #2e2829;
    --phase-prospect-fg: #e4dbdc;
    --phase-outreach-bg: #46242a;
    --phase-outreach-fg: #ffb3ba;
    --phase-conversation-bg: #f0606c;
    --phase-conversation-fg: #1a1617;
    --phase-won-bg: #1c3a29;
    --phase-won-fg: #8fe0b0;
    --phase-parked-bg: #2a2526;
    --phase-parked-fg: #b8adae;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }
  html {
    -webkit-text-size-adjust: 100%;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 var(--font);
    font-variant-numeric: tabular-nums;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body.has-layer {
    overflow: hidden;
  }
  h1,
  h2,
  h3 {
    margin: 0;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }
  h1 {
    font-size: 24px;
  }
  h2 {
    font-size: 17px;
  }
  h3 {
    font-size: 15px;
  }
  p {
    margin: 0 0 8px;
  }
  a {
    color: var(--accent);
  }
  button,
  input,
  select,
  textarea {
    font: inherit;
    color: inherit;
  }
  button {
    cursor: pointer;
  }
  :focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  .muted {
    color: var(--muted);
  }
  .small {
    font-size: 13px;
  }
  .nowrap {
    white-space: nowrap;
  }
  .grow {
    flex: 1;
    min-width: 0;
  }
  .truncate {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .eyebrow {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .hstack {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .wrap {
    flex-wrap: wrap;
  }
  .stack > * + * {
    margin-top: 12px;
  }
  .spacer {
    flex: 1;
  }

  /* ---- Shell -------------------------------------------------------------------------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 52px;
    padding: 6px var(--gutter);
    padding-top: calc(6px + env(safe-area-inset-top));
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .topbar-title {
    font-weight: 700;
    font-size: 17px;
    min-width: 0;
  }
  .topbar-title small {
    display: block;
    font-weight: 500;
    font-size: 12px;
    color: var(--muted);
  }
  .brand-mark {
    display: inline-grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 800;
    font-size: 14px;
    flex: none;
  }
  .sync-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 32px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .sync-pill .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ok);
  }
  .sync-pill.is-saving .dot {
    background: var(--soon);
  }
  .sync-pill.is-error {
    color: var(--overdue);
    border-color: var(--overdue);
  }
  .sync-pill.is-error .dot {
    background: var(--overdue);
  }
  #view {
    min-height: 60vh;
  }
  .page {
    max-width: 1120px;
    margin: 0 auto;
    padding: 16px var(--gutter) calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom));
  }
  .page-head {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .page-head h1 {
    flex: 1;
    min-width: 0;
  }

  .tabbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 30;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    align-items: end;
    height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  .tabbar.four {
    grid-template-columns: repeat(4, 1fr);
  }
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    height: var(--tabbar-h);
    border: 0;
    background: none;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
  }
  .tab[aria-current='page'] {
    color: var(--accent);
  }
  .tab svg {
    width: 22px;
    height: 22px;
  }
  .tab-log {
    position: relative;
  }
  .tab-log .log-circle {
    display: grid;
    place-items: center;
    width: 56px;
    height: 56px;
    margin-top: -22px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--on-accent);
    box-shadow: 0 6px 16px rgba(205, 30, 47, 0.35);
  }
  .tab-log .log-circle svg {
    width: 26px;
    height: 26px;
  }
  .tab-log span.label {
    color: var(--accent);
  }

  .sidebar {
    display: none;
  }
  @media (min-width: 768px) {
    .tabbar {
      display: none;
    }
    .sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 25;
      display: flex;
      flex-direction: column;
      width: var(--sidebar-w);
      padding: 14px 12px;
      background: var(--surface);
      border-right: 1px solid var(--line);
    }
    .shell-main {
      margin-left: var(--sidebar-w);
    }
    .page {
      padding: 20px 28px 48px;
    }
    .topbar .brand-mark,
    .topbar .phone-only {
      display: none;
    }
    h1 {
      font-size: 26px;
    }
  }
  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 6px 14px;
    font-weight: 700;
    line-height: 1.2;
  }
  .sidebar-brand small {
    display: block;
    font-weight: 500;
    font-size: 12px;
    color: var(--muted);
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 40px;
    padding: 0 10px;
    border: 0;
    border-radius: var(--radius-sm);
    background: none;
    color: var(--text);
    font-weight: 500;
    text-align: left;
  }
  .nav-item svg {
    width: 18px;
    height: 18px;
    color: var(--muted);
  }
  .nav-item:hover {
    background: var(--surface-2);
  }
  .nav-item[aria-current='page'] {
    background: var(--accent-soft);
    color: var(--accent-strong);
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .nav-item[aria-current='page'] svg {
    color: var(--accent);
  }
  .nav-item .count {
    margin-left: auto;
    font-size: 12px;
    color: var(--overdue);
    font-weight: 700;
  }
  .sidebar-foot {
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  @media (max-width: 767px) {
    .desktop-only {
      display: none !important;
    }
  }
  @media (min-width: 768px) {
    .phone-only {
      display: none !important;
    }
  }

  /* ---- Buttons and inputs -------------------------------------------------------------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: var(--tap);
    padding: 0 16px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover {
    background: var(--accent-strong);
  }
  .btn:disabled,
  .btn[aria-disabled='true'] {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .btn svg {
    width: 18px;
    height: 18px;
  }
  .btn-secondary {
    background: var(--surface);
    color: var(--text);
    border-color: var(--line-strong);
  }
  .btn-secondary:hover {
    background: var(--surface-2);
  }
  .btn-ghost {
    background: none;
    color: var(--text);
  }
  .btn-ghost:hover {
    background: var(--surface-2);
  }
  .btn-soft {
    background: var(--accent-soft);
    color: var(--accent-strong);
  }
  .btn-soft:hover {
    background: var(--accent-soft);
    filter: brightness(0.97);
  }
  .btn-sm {
    min-height: 36px;
    padding: 0 12px;
    font-size: 14px;
    border-radius: 8px;
  }
  .btn-xs {
    min-height: 30px;
    padding: 0 10px;
    font-size: 13px;
    border-radius: 8px;
  }
  .btn-block {
    width: 100%;
  }
  .btn-link {
    text-decoration: none;
  }
  .icon-btn {
    display: inline-grid;
    place-items: center;
    width: var(--tap);
    height: var(--tap);
    border: 0;
    border-radius: 10px;
    background: none;
    color: var(--muted);
  }
  .icon-btn:hover {
    background: var(--surface-2);
    color: var(--text);
  }
  .icon-btn svg {
    width: 20px;
    height: 20px;
  }
  .field {
    display: block;
    margin-bottom: 14px;
  }
  .field > .label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }
  .input,
  .select,
  .textarea {
    width: 100%;
    min-height: var(--tap);
    padding: 10px 12px;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: var(--surface);
    font-size: 16px;
  }
  .textarea {
    min-height: 88px;
    resize: vertical;
    line-height: 1.45;
  }
  .textarea.one-line {
    min-height: 48px;
  }
  .input:focus,
  .select:focus,
  .textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  @media (min-width: 768px) {
    .input,
    .select,
    .textarea {
      font-size: 15px;
    }
  }
  .problem {
    margin-top: 6px;
    color: var(--overdue);
    font-size: 13px;
    font-weight: 500;
  }
  .hint {
    margin-top: 6px;
    color: var(--muted);
    font-size: 13px;
  }
  .seg {
    display: inline-flex;
    padding: 3px;
    border-radius: 10px;
    background: var(--surface-2);
    gap: 2px;
  }
  .seg button {
    min-height: 34px;
    padding: 0 12px;
    border: 0;
    border-radius: 8px;
    background: none;
    color: var(--muted);
    font-weight: 600;
    font-size: 14px;
  }
  .seg button[aria-pressed='true'] {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
  }

  /* Chips: stage chips are tinted by phase only (five tints, never sixteen colours). */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-height: 24px;
    padding: 0 8px;
    border: 0;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  button.chip {
    min-height: 28px;
  }
  .chip.phase-prospect {
    background: var(--phase-prospect-bg);
    color: var(--phase-prospect-fg);
  }
  .chip.phase-outreach {
    background: var(--phase-outreach-bg);
    color: var(--phase-outreach-fg);
  }
  .chip.phase-conversation {
    background: var(--phase-conversation-bg);
    color: var(--phase-conversation-fg);
  }
  .chip.phase-won {
    background: var(--phase-won-bg);
    color: var(--phase-won-fg);
  }
  .chip.phase-parked {
    background: var(--phase-parked-bg);
    color: var(--phase-parked-fg);
  }
  .chip.warm {
    background: var(--soon-soft);
    color: var(--soon);
  }
  .chip.outline {
    background: none;
    box-shadow: inset 0 0 0 1px var(--line-strong);
    color: var(--muted);
  }
  .chip.event {
    background: var(--surface-2);
    color: var(--text);
    font-weight: 500;
  }
  .badge {
    display: inline-grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 12px;
    font-weight: 800;
    flex: none;
  }
  .badge.pri-A {
    background: var(--text);
    color: var(--surface);
  }
  .avatar {
    display: inline-grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-size: 11px;
    font-weight: 700;
    flex: none;
  }
  .avatar.lg {
    width: 34px;
    height: 34px;
    font-size: 13px;
  }
  .avatar.none {
    background: none;
    color: var(--muted);
    box-shadow: inset 0 0 0 1.5px var(--line-strong);
    border: 0;
  }
  button.avatar {
    border: 0;
  }
  .due {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    color: var(--muted);
  }
  .due::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0;
  }
  .due.overdue {
    color: var(--overdue);
  }
  .due.overdue::before {
    opacity: 1;
  }
  .due.soon {
    color: var(--soon);
  }
  .due.today {
    color: var(--soon);
  }
  .due.today::before {
    opacity: 1;
  }

  /* ---- Cards, lists, rows -------------------------------------------------------------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .card-pad {
    padding: 16px;
  }
  .section {
    margin-top: 22px;
  }
  .section-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .section-head h2 {
    flex: 1;
    min-width: 0;
  }
  .section-head .count {
    color: var(--muted);
    font-weight: 600;
    font-size: 14px;
  }
  .list {
    margin: 0;
    padding: 0;
    list-style: none;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .list > li + li {
    border-top: 1px solid var(--line);
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: var(--row-h);
    padding: 8px 12px;
  }
  .row.clickable {
    cursor: pointer;
  }
  .row.clickable:hover {
    background: var(--surface-2);
  }
  .row-main {
    flex: 1;
    min-width: 0;
  }
  .row-title {
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row-sub {
    color: var(--muted);
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
    min-width: 0;
  }
  .row-actions {
    display: flex;
    gap: 6px;
    flex: none;
  }
  .row.done .row-title {
    text-decoration: line-through;
    color: var(--muted);
  }
  .group-label {
    padding: 8px 12px 4px;
    background: var(--surface-2);
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .group-label.overdue {
    color: var(--overdue);
  }
  .empty {
    padding: 22px 16px;
    text-align: center;
    color: var(--muted);
  }
  .empty .btn {
    margin-top: 10px;
  }
  .tiles {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  @media (min-width: 768px) {
    .tiles {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
  }
  .tile {
    display: block;
    min-height: 76px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    text-align: left;
  }
  .tile:hover {
    border-color: var(--line-strong);
  }
  .tile .num {
    display: block;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.1;
  }
  .tile .num.alert {
    color: var(--overdue);
  }
  .tile .what {
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
  }
  .bar {
    position: relative;
    height: 6px;
    border-radius: 3px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .bar > span {
    position: absolute;
    inset: 0 auto 0 0;
    border-radius: 3px;
    background: var(--text);
    opacity: 0.75;
  }
  .bar.met > span {
    background: var(--ok);
    opacity: 1;
  }
  .banner {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--surface);
    font-size: 14px;
  }
  .banner.warn {
    border-color: var(--soon);
    background: var(--soon-soft);
  }
  .banner.error {
    border-color: var(--overdue);
    background: var(--overdue-soft);
  }
  .banner.info {
    background: var(--surface-2);
  }
  .banner .grow p:last-child {
    margin: 0;
  }
  .health-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--muted);
    flex: none;
  }
  .health-dot.red {
    background: var(--overdue);
  }
  .health-dot.amber {
    background: var(--soon);
  }
  .health-dot.green {
    background: var(--ok);
  }
  @media (max-width: 767px) {
    .note-inline > .grow {
      flex-basis: 100%;
    }
  }
  .note-inline {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    background: var(--soon-soft);
    font-size: 13px;
  }

  /* ---- Filters and the pipeline -------------------------------------------------------- */
  .chips-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .chips-row::-webkit-scrollbar {
    display: none;
  }
  @media (min-width: 768px) {
    .chips-row {
      flex-wrap: wrap;
      overflow: visible;
    }
  }
  .fchip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 34px;
    padding: 0 12px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    flex: none;
  }
  .fchip[aria-pressed='true'] {
    background: var(--text);
    color: var(--surface);
    border-color: var(--text);
  }
  .fchip .n {
    color: var(--muted);
    font-weight: 600;
  }
  .fchip[aria-pressed='true'] .n {
    color: inherit;
    opacity: 0.75;
  }
  .search {
    position: relative;
  }
  .search svg {
    position: absolute;
    left: 12px;
    top: 50%;
    width: 18px;
    height: 18px;
    margin-top: -9px;
    color: var(--muted);
    pointer-events: none;
  }
  .search .input {
    padding-left: 38px;
  }
  .table-wrap {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    overflow: clip;
  }
  table.table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 13px;
  }
  .table th {
    position: sticky;
    top: 53px;
    z-index: 2;
    height: 34px;
    padding: 0 8px;
    background: var(--surface-2);
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-align: left;
    white-space: nowrap;
  }
  .table th button {
    border: 0;
    background: none;
    padding: 0;
    color: inherit;
    font-weight: inherit;
  }
  .table td {
    height: 40px;
    padding: 2px 8px;
    border-top: 1px solid var(--line);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: middle;
  }
  .table tr.clickable:hover td {
    background: var(--surface-2);
    cursor: pointer;
  }
  .table tr.selected td {
    background: var(--accent-soft);
  }
  .table .num {
    text-align: right;
  }
  .table .cell-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    max-width: 100%;
    min-height: 30px;
    padding: 0 6px;
    margin-left: -6px;
    border: 0;
    border-radius: 6px;
    background: none;
    text-align: left;
  }
  .table .cell-btn:hover {
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--line-strong);
  }
  .col-wide,
  .col-xwide {
    display: none;
  }
  @media (min-width: 1024px) {
    .col-wide {
      display: table-cell;
    }
  }
  @media (min-width: 1280px) {
    .col-xwide {
      display: table-cell;
    }
  }

  /* ---- Overlays: bottom sheets on phones, dialogs on desktop --------------------------- */
  .layer {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .layer-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(20, 16, 17, 0.42);
    animation: fade 0.15s ease-out;
  }
  .sheet {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-height: 92vh;
    max-height: 92dvh;
    border-radius: 16px 16px 0 0;
    background: var(--surface);
    box-shadow: var(--shadow);
    animation: rise 0.18s ease-out;
  }
  .sheet.full {
    height: 100vh;
    height: 100dvh;
    max-height: none;
    border-radius: 0;
  }
  @media (max-width: 479px) {
    .sheet.tall {
      height: 100vh;
      height: 100dvh;
      max-height: none;
      border-radius: 0;
    }
  }
  @media (min-width: 768px) {
    .layer {
      align-items: center;
      padding: 24px;
    }
    .sheet,
    .sheet.tall {
      width: 560px;
      max-width: 100%;
      height: auto;
      max-height: 86vh;
      border-radius: 16px;
    }
    .sheet.wide {
      width: 760px;
    }
    .sheet.small {
      width: 420px;
    }
  }
  .sheet-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 8px 8px 18px;
    padding-top: calc(10px + env(safe-area-inset-top) * 0);
    border-bottom: 1px solid var(--line);
  }
  .sheet-head h2 {
    flex: 1;
    min-width: 0;
    font-size: 17px;
  }
  .sheet-handle {
    position: absolute;
    top: 6px;
    left: 50%;
    width: 36px;
    height: 4px;
    margin-left: -18px;
    border-radius: 2px;
    background: var(--line-strong);
  }
  @media (min-width: 768px) {
    .sheet-handle {
      display: none;
    }
  }
  .sheet-body {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 14px 18px 18px;
  }
  .sheet-foot {
    display: flex;
    gap: 8px;
    padding: 10px 18px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  .sheet-foot .btn {
    min-height: 48px;
  }
  .sheet-foot .btn-primary-wide {
    flex: 1;
  }
  .menu {
    list-style: none;
    margin: 0;
    padding: 4px 0;
  }
  .menu button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 46px;
    padding: 0 14px;
    border: 0;
    background: none;
    text-align: left;
    font-weight: 500;
  }
  .menu button:hover,
  .menu button[aria-checked='true'] {
    background: var(--surface-2);
  }
  .menu .menu-meta {
    margin-left: auto;
    color: var(--muted);
    font-size: 13px;
  }
  .menu svg {
    width: 18px;
    height: 18px;
    color: var(--muted);
  }
  .toast-slot {
    position: fixed;
    left: 50%;
    bottom: calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom));
    z-index: 70;
    width: min(520px, calc(100vw - 24px));
    transform: translateX(-50%);
    pointer-events: none;
  }
  @media (min-width: 768px) {
    .toast-slot {
      bottom: 24px;
      left: calc(50% + var(--sidebar-w) / 2);
    }
  }
  .toast {
    padding: 12px 14px;
    border-radius: 14px;
    background: var(--text);
    color: var(--surface);
    box-shadow: var(--shadow);
    pointer-events: auto;
    animation: rise 0.18s ease-out;
  }
  .toast .hstack {
    gap: 10px;
  }
  .toast button {
    border: 0;
    border-radius: 8px;
    min-height: 34px;
    padding: 0 12px;
    background: rgba(255, 255, 255, 0.16);
    color: inherit;
    font-weight: 700;
    font-size: 14px;
  }
  :root[data-theme='dark'] .toast button {
    background: rgba(0, 0, 0, 0.12);
  }
  .toast .toast-prompt {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.18);
  }
  .toast .toast-prompt strong {
    display: block;
  }
  .toast .toast-prompt .detail {
    opacity: 0.8;
    font-size: 13px;
  }
  .toast .toast-prompt .hstack {
    margin-top: 8px;
  }
  .toast .yes {
    background: var(--accent);
    color: #fff;
  }
  .toast.error {
    background: var(--overdue);
    color: #fff;
  }
  @keyframes rise {
    from {
      transform: translateY(14px);
      opacity: 0;
    }
  }
  @keyframes fade {
    from {
      opacity: 0;
    }
  }

  /* ---- Log a touch ---------------------------------------------------------------------- */
  .kind-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .kind-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 64px;
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    background: var(--surface);
    font-weight: 600;
    font-size: 14px;
  }
  .kind-btn svg {
    width: 22px;
    height: 22px;
    color: var(--muted);
  }
  .kind-btn[aria-pressed='true'] {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent-strong);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .kind-btn[aria-pressed='true'] svg {
    color: var(--accent);
  }
  .date-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .date-chip {
    min-height: 36px;
    padding: 0 12px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--surface);
    font-size: 13px;
    font-weight: 600;
  }
  .date-chip[aria-pressed='true'] {
    background: var(--text);
    border-color: var(--text);
    color: var(--surface);
  }
  .date-chip .sub {
    font-weight: 500;
    opacity: 0.7;
  }
  .picked {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface-2);
  }
  .result-list {
    list-style: none;
    margin: 8px 0 0;
    padding: 0;
  }
  .result-list button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 48px;
    padding: 6px 10px;
    border: 0;
    border-radius: 10px;
    background: none;
    text-align: left;
  }
  .result-list button:hover,
  .result-list button:focus-visible {
    background: var(--surface-2);
  }
  .suggest-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .suggest-chips button {
    max-width: 100%;
    min-height: 34px;
    padding: 0 12px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--surface);
    font-size: 13px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .next-line {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--surface-2);
    font-size: 14px;
  }
  .block-label {
    margin: 16px 0 8px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .block-label:first-child {
    margin-top: 0;
  }
  .stage-group h3 {
    margin: 14px 0 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .stage-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .stage-opt {
    min-height: 42px;
    padding: 0 12px;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: var(--surface);
    text-align: left;
    font-weight: 500;
    font-size: 14px;
  }
  .stage-opt[aria-pressed='true'] {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-weight: 700;
  }
  .stage-opt.current::after {
    content: ' · now';
    color: var(--muted);
    font-weight: 500;
  }

  /* ---- Sponsor detail ------------------------------------------------------------------- */
  .detail-layout {
    display: block;
  }
  @media (min-width: 1100px) {
    .detail-layout.with-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 460px;
      gap: 18px;
      align-items: start;
    }
    .detail-panel {
      position: sticky;
      top: 64px;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 16px;
    }
  }
  .detail-head h1 {
    font-size: 22px;
    margin-bottom: 8px;
  }
  .next-card {
    padding: 12px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    background: var(--surface);
  }
  .next-card.overdue {
    border-left-color: var(--overdue);
    background: var(--overdue-soft);
  }
  .contact-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .contact-row a {
    flex: 1 1 140px;
  }
  .timeline {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .tl-item {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  .tl-item:first-child {
    border-top: 0;
  }
  .tl-icon {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--muted);
    flex: none;
  }
  .tl-icon svg {
    width: 16px;
    height: 16px;
  }
  .tl-meta {
    color: var(--muted);
    font-size: 12px;
  }
  .tl-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
  }
  .tl-divider::before,
  .tl-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .tl-item.quiet .grow {
    color: var(--muted);
    font-size: 13px;
  }
  details.group {
    border-top: 1px solid var(--line);
  }
  details.group > summary {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 48px;
    list-style: none;
    cursor: pointer;
    font-weight: 600;
  }
  details.group > summary::-webkit-details-marker {
    display: none;
  }
  details.group > summary::after {
    content: '';
    width: 8px;
    height: 8px;
    margin-left: auto;
    margin-right: 4px;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: rotate(45deg);
    transition: transform 0.15s;
  }
  details.group[open] > summary::after {
    transform: rotate(-135deg);
  }
  .kv {
    display: grid;
    grid-template-columns: 130px minmax(0, 1fr);
    gap: 6px 12px;
    margin: 0 0 12px;
    font-size: 14px;
  }
  .kv dt {
    color: var(--muted);
  }
  .kv dd {
    margin: 0;
    overflow-wrap: anywhere;
  }
  .stepper {
    display: flex;
    gap: 4px;
  }
  .stepper button {
    width: 38px;
    min-height: 36px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--surface);
    font-weight: 700;
  }
  .stepper button[aria-pressed='true'] {
    background: var(--text);
    border-color: var(--text);
    color: var(--surface);
  }
  .checklist label {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
  }
  .checklist input {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
  }

  /* ---- Events ----------------------------------------------------------------------------- */
  .event-row {
    position: relative;
    display: block;
    padding: 12px 14px 12px 18px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .event-row + .event-row {
    margin-top: 10px;
  }
  .event-row::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 5px;
    border-radius: var(--radius) 0 0 var(--radius);
    background: var(--line-strong);
  }
  .event-row.h-red::before {
    background: var(--overdue);
  }
  .event-row.h-amber::before {
    background: var(--soon);
  }
  .event-row.h-green::before {
    background: var(--ok);
  }
  .event-row.h-open::before {
    background: var(--muted);
  }
  .event-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    border: 0;
    background: none;
    width: 100%;
    padding: 0;
    text-align: left;
  }
  .health {
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    color: var(--muted);
  }
  .health.red {
    color: var(--overdue);
  }
  .health.amber {
    color: var(--soon);
  }
  .health.green {
    color: var(--ok);
  }
  .status-text {
    margin: 10px 0;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--surface-2);
    font-size: 13px;
    white-space: pre-wrap;
  }
  .need-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 4px 10px;
    padding: 10px 0;
    border-top: 1px solid var(--line);
    font-size: 14px;
  }
  .cov {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 13px;
  }
  .cov .bar {
    width: 64px;
  }
  .cov.covered {
    color: var(--ok);
  }

  /* ---- Meeting mode: the same components, larger --------------------------------------- */
  .meeting {
    --row-h: 52px;
    font-size: 16px;
  }
  .meeting h2 {
    font-size: 20px;
  }
  .meeting-bar {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px var(--gutter);
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .clock {
    font-size: 18px;
    font-weight: 700;
  }
  .clock.over {
    color: var(--overdue);
  }
  .agenda-section {
    margin-top: 26px;
    scroll-margin-top: 70px;
  }
  .agenda-section .budget {
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }
  .action-table {
    width: 100%;
    border-collapse: collapse;
  }
  .action-table td {
    padding: 4px;

    <script id="boot" type="application/json"></script>
    <noscript><p class="page">The Sponsorship Hub needs JavaScript turned on.</p></noscript>
    <script>/**
 * Business rules for the Sponsorship Hub: the single source of truth.
 *
 * `npm run build` copies this file to src/Rules.js (server) and src/rules.html (client),
 * so the browser and the server run identical logic. Keep it a plain script:
 * no import/export, no Apps Script or DOM APIs, pure functions only.
 */
const Rules = (function () {
  'use strict';

  /**
   * @param {*} value
   * @returns {*} the same value, recursively frozen
   */
  function deepFreeze(value) {
    if (value && typeof value === 'object' && !Object.isFrozen(value)) {
      Object.freeze(value);
      Object.keys(value).forEach(function (key) {
        deepFreeze(value[key]);
      });
    }
    return value;
  }

  /** @typedef {'coordinator'|'vp'|'president'|'exec'} Role */
  /** @typedef {'Prospect'|'Outreach'|'Conversation'|'Won'|'Parked'} Phase */

  /**
   * Allowed values for every enum column, keyed by enum name (spec §5).
   * Used for the Sheet dropdowns, server-side validation and client forms.
   * @type {Readonly<Record<string, readonly string[]>>}
   */
  const ENUMS = deepFreeze({
    role: ['coordinator', 'vp', 'president', 'exec'],
    event_type: ['distribution', 'fundraiser', 'social', 'impact-sprint', 'other'],
    owning_portfolio: ['internal', 'fundraising', 'events', 'marketing', 'academics', 'other'],
    event_status: ['planned', 'confirmed', 'done', 'cancelled'],
    ask_type: ['cash', 'food', 'product', 'venue', 'prizes', 'promotion', 'judges', 'other'],
    need_status: ['open', 'covered', 'dropped'],
    category: [
      'cafe-bakery',
      'restaurant',
      'grocery',
      'retail',
      'corporate',
      'campus',
      'education-consulting',
      'nonprofit',
      'other',
    ],
    priority: ['A', 'B', 'C'],
    stage: [
      'target',
      'researched',
      'contact_identified',
      'warm_intro',
      'outreach_ready',
      'contacted',
      'follow_up',
      'responded',
      'meeting_scheduled',
      'discovery',
      'proposal',
      'negotiation',
      'committed',
      'closed_won',
      'nurture',
      'lost',
    ],
    activity_kind: [
      'email',
      'call',
      'walk_in',
      'follow_up',
      'reply',
      'meeting',
      'commitment',
      'note',
      'stage_change',
    ],
    task_source: ['meeting', 'exec', 'manual', 'system'],
    task_status: ['open', 'done'],
    template_kind: [
      'cold_email',
      'follow_up',
      'impact_sprint',
      'education_consulting',
      'walk_in_script',
      'thank_you',
    ],
  });

  /** Pipeline phases, left to right on the board (spec §6.1). */
  const PHASES = deepFreeze(['Prospect', 'Outreach', 'Conversation', 'Won', 'Parked']);

  /** @type {Readonly<Record<string, Phase>>} */
  const STAGE_PHASE = deepFreeze({
    target: 'Prospect',
    researched: 'Prospect',
    contact_identified: 'Prospect',
    warm_intro: 'Prospect',
    outreach_ready: 'Prospect',
    contacted: 'Outreach',
    follow_up: 'Outreach',
    responded: 'Outreach',
    meeting_scheduled: 'Conversation',
    discovery: 'Conversation',
    proposal: 'Conversation',
    negotiation: 'Conversation',
    committed: 'Won',
    closed_won: 'Won',
    nurture: 'Parked',
    lost: 'Parked',
  });

  /**
   * @param {string} stage
   * @returns {Phase|null} the phase a stage belongs to, or null for an unknown stage
   */
  function phaseOf(stage) {
    return Object.prototype.hasOwnProperty.call(STAGE_PHASE, stage) ? STAGE_PHASE[stage] : null;
  }

  /**
   * @param {Phase} phase
   * @returns {string[]} the stages in a phase, in pipeline order
   */
  function stagesIn(phase) {
    return ENUMS.stage.filter(function (stage) {
      return STAGE_PHASE[stage] === phase;
    });
  }

  /**
   * Presidents and other portfolios' VPs ("exec") read everything and file requests; coordinators
   * also work sponsors; vps also manage events, settings, templates and meetings (PLAN A1).
   */
  const ROLE_RANK = deepFreeze({ exec: 0, president: 0, coordinator: 1, vp: 2 });

  /**
   * @param {string} role the caller's role
   * @param {Role} needed the minimum role required
   * @returns {boolean} true when `role` is at least `needed`; unknown roles never qualify
   */
  function roleAtLeast(role, needed) {
    if (!Object.prototype.hasOwnProperty.call(ROLE_RANK, role)) return false;
    if (!Object.prototype.hasOwnProperty.call(ROLE_RANK, needed)) return false;
    return ROLE_RANK[role] >= ROLE_RANK[needed];
  }

  // ---------------------------------------------------------------------------
  // Small helpers
  // ---------------------------------------------------------------------------

  /**
   * @param {*} v
   * @returns {string} trimmed text; null and undefined become ''
   */
  function text(v) {
    return v === undefined || v === null ? '' : String(v).trim();
  }

  /**
   * @param {*} v
   * @returns {boolean} true for true or the text "TRUE" in any case
   */
  function isTrue(v) {
    return v === true || String(v).trim().toUpperCase() === 'TRUE';
  }

  /**
   * @param {number} n
   * @param {number} width
   * @returns {string} n left-padded with zeros to `width` characters
   */
  function pad(n, width) {
    let s = String(n);
    while (s.length < width) s = '0' + s;
    return s;
  }

  /**
   * @param {Array} list
   * @returns {Array} the list without duplicates, first occurrences kept
   */
  function unique(list) {
    const seen = {};
    return list.filter(function (item) {
      if (seen[item]) return false;
      seen[item] = true;
      return true;
    });
  }

  // ---------------------------------------------------------------------------
  // Settings defaults (spec §9)
  // ---------------------------------------------------------------------------

  /** Used until a vp changes a value on the Settings screen. */
  const DEFAULT_SETTINGS = deepFreeze({
    impact_stats: { meals: 150000, founded_year: 2020, volunteers: 400, raised_cad: 90000 },
    quotas: {
      remote_min: 15,
      remote_max: 20,
      walkins_min: 2,
      walkins_max: 3,
      busy_remote: 30,
      busy_week: false,
    },
    meeting: { weekday: null, time: null, length_min: 30 },
    phase: { name: 'Launch' },
    ask_lead_days: 21,
    follow_up_days: 5,
    giving_ladder: [
      { amount: 500, text: '500 meals — a full distribution' },
      { amount: 1000, text: 'blankets, socks and hygiene kits for several handouts' },
      { amount: 2500, text: 'a month of distributions' },
      { amount: 5000, text: 'large-scale outreach' },
    ],
    accent_hex: '#CD1E2F',
    // Who incoming requests from other portfolios go to; blank means the first active vp (PLAN A15).
    lead_vp_id: '',
    // Shown beside the templates and on My work so nobody hunts Drive for them.
    links: { one_pager_url: '', everything_doc_url: '', slack_channel_url: '' },
  });

  /**
   * Settings tab rows -> one settings object, with defaults filling anything not stored.
   * Object-valued settings are merged key by key, so a stored `{remote_min: 10}` keeps the
   * other quota defaults. An unreadable stored value is ignored.
   * @param {Array<{key: string, value_json: string}>} rows
   * @returns {Object}
   */
  function parseSettings(rows) {
    const out = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    (rows || []).forEach(function (row) {
      const key = text(row.key);
      if (!key || !text(row.value_json)) return;
      let value;
      try {
        value = JSON.parse(row.value_json);
      } catch (err) {
        return;
      }
      const base = out[key];
      const bothObjects =
        base &&
        value &&
        typeof base === 'object' &&
        typeof value === 'object' &&
        !Array.isArray(base) &&
        !Array.isArray(value);
      out[key] = bothObjects ? Object.assign({}, base, value) : value;
    });
    return out;
  }

  // ---------------------------------------------------------------------------
  // Dates. Every date is a "YYYY-MM-DD" string and all arithmetic is done in UTC on whole
  // days, so a daylight-saving change can never move a date (spec §6.6).
  // ---------------------------------------------------------------------------

  const ISO_DATE = /^(\d{4})-(\d{2})-(\d{2})$/;
  const DAY_MS = 86400000;
  const MONTHS = [
    'January',
    'February',
    'March',
    'April',
    'May',
    'June',
    'July',
    'August',
    'September',
    'October',
    'November',
    'December',
  ];

  /**
   * @param {*} s
   * @returns {{y: number, m: number, d: number}|null} the parts of a real calendar date, else null
   */
  function parseIsoDate(s) {
    if (typeof s !== 'string') return null;
    const match = ISO_DATE.exec(s);
    if (!match) return null;
    const y = Number(match[1]);
    const m = Number(match[2]);
    const d = Number(match[3]);
    if (y < 1900 || y > 2200) return null;
    const t = new Date(Date.UTC(y, m - 1, d));
    if (t.getUTCFullYear() !== y || t.getUTCMonth() !== m - 1 || t.getUTCDate() !== d) return null;
    return { y: y, m: m, d: d };
  }

  /**
   * @param {*} s
   * @returns {boolean} true for a real calendar date written YYYY-MM-DD
   */
  function isIsoDate(s) {
    return parseIsoDate(s) !== null;
  }

  /**
   * @param {number} ms a UTC instant
   * @returns {string} that instant's UTC calendar date, YYYY-MM-DD
   */
  function formatIso(ms) {
    const d = new Date(ms);
    return (
      pad(d.getUTCFullYear(), 4) + '-' + pad(d.getUTCMonth() + 1, 2) + '-' + pad(d.getUTCDate(), 2)
    );
  }

  /**
   * @param {string} iso
   * @returns {number} whole days since 1970-01-01
   */
  function dayNumber(iso) {
    const p = parseIsoDate(iso);
    return Date.UTC(p.y, p.m - 1, p.d) / DAY_MS;
  }

  /**
   * @param {string} iso
   * @param {number} n days to add (negative to subtract)
   * @returns {string|null} the date n days later, or null when `iso` is not a date
   */
  function addDays(iso, n) {
    const p = parseIsoDate(iso);
    return p ? formatIso(Date.UTC(p.y, p.m - 1, p.d + n)) : null;
  }

  /**
   * @param {string} from
   * @param {string} to
   * @returns {number|null} whole days from `from` to `to` (negative if `to` is earlier)
   */
  function daysBetween(from, to) {
    if (!isIsoDate(from) || !isIsoDate(to)) return null;
    return Math.round(dayNumber(to) - dayNumber(from));
  }

  /**
   * @param {string} iso
   * @returns {number} 0 for Monday ... 6 for Sunday
   */
  function weekdayIndex(iso) {
    const p = parseIsoDate(iso);
    return (new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay() + 6) % 7;
  }

  /**
   * The calendar week is Monday to Sunday (spec §5).
   * @param {string} iso any date in the week
   * @returns {{start: string, end: string}|null} that week's Monday and Sunday
   */
  function weekRange(iso) {
    if (!isIsoDate(iso)) return null;
    const start = addDays(iso, -weekdayIndex(iso));
    return { start: start, end: addDays(start, 6) };
  }

  /**
   * @param {string} iso
   * @param {string} start
   * @param {string} end
   * @returns {boolean} true when iso is a date from start to end, both included
   */
  function isInRange(iso, start, end) {
    return isIsoDate(iso) && iso >= start && iso <= end;
  }

  /**
   * @param {number} year
   * @param {number} monthIndex 0 for January
   * @param {number} n which Sunday: 1 for the first
   * @returns {number} the day of the month of that Sunday
   */
  function nthSunday(year, monthIndex, n) {
    const firstWeekday = new Date(Date.UTC(year, monthIndex, 1)).getUTCDay();
    return 1 + ((7 - firstWeekday) % 7) + 7 * (n - 1);
  }

  /**
   * America/Vancouver's offset from UTC at an instant, from the current North American rules
   * (valid from 2007): daylight time runs from the second Sunday of March at 2:00 a.m. to the
   * first Sunday of November at 2:00 a.m. Written out by hand so the browser and Apps Script
   * agree without relying on either one's time-zone support.
   * @param {number} utcMs
   * @returns {number} -420 (PDT) or -480 (PST), in minutes
   */
  function vancouverOffsetMinutes(utcMs) {
    const year = new Date(utcMs).getUTCFullYear();
    const dstStart = Date.UTC(year, 2, nthSunday(year, 2, 2), 10, 0, 0); // 2:00 PST = 10:00Z
    const dstEnd = Date.UTC(year, 10, nthSunday(year, 10, 1), 9, 0, 0); // 2:00 PDT = 09:00Z
    return utcMs >= dstStart && utcMs < dstEnd ? -420 : -480;
  }

  /**
   * @param {number} utcMs an instant, e.g. Date.now()
   * @returns {string} the calendar date in Vancouver at that instant, YYYY-MM-DD
   */
  function vancouverDate(utcMs) {
    return formatIso(utcMs + vancouverOffsetMinutes(utcMs) * 60000);
  }

  /**
   * Overdue: before today. Due soon: today up to `soonDays` from now (spec §6.6).
   * @param {string} due
   * @param {string} today
   * @param {number} [soonDays] 7 when omitted
   * @returns {'none'|'overdue'|'soon'|'later'}
   */
  function dueStatus(due, today, soonDays) {
    if (!isIsoDate(due) || !isIsoDate(today)) return 'none';
    if (due < today) return 'overdue';
    return due <= addDays(today, soonDays === undefined ? 7 : soonDays) ? 'soon' : 'later';
  }

  /**
   * @param {string} due
   * @param {string} today
   * @returns {boolean}
   */
  function isOverdue(due, today) {
    return dueStatus(due, today) === 'overdue';
  }

  /**
   * @param {string} due
   * @param {string} today
   * @param {number} [soonDays]
   * @returns {boolean}
   */
  function isDueSoon(due, today, soonDays) {
    return dueStatus(due, today, soonDays) === 'soon';
  }

  const WEEKDAYS_SHORT = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const WEEKDAYS_LONG = [
    'Monday',
    'Tuesday',
    'Wednesday',
    'Thursday',
    'Friday',
    'Saturday',
    'Sunday',
  ];

  /**
   * @param {string} iso
   * @returns {string} e.g. "Oct 16"; '' when not a date
   */
  function shortDate(iso) {
    const p = parseIsoDate(iso);
    return p ? MONTHS[p.m - 1].slice(0, 3) + ' ' + p.d : '';
  }

  /**
   * @param {string} iso
   * @returns {string} e.g. "Thu Oct 16"; '' when not a date
   */
  function dayLabel(iso) {
    return isIsoDate(iso) ? WEEKDAYS_SHORT[weekdayIndex(iso)] + ' ' + shortDate(iso) : '';
  }

  /**
   * How a due date reads in a list: "3 d late", "Today", "Tomorrow", "Thu", or "Oct 30".
   * @param {string} due
   * @param {string} today
   * @param {boolean} [long] true for "Thu Oct 8 · 3 d late" and "Thu Oct 16" (desktop)
   * @returns {string} '' when there is no date
   */
  function dueLabel(due, today, long) {
    if (!isIsoDate(due) || !isIsoDate(today)) return '';
    const n = daysBetween(today, due);
    if (n < 0) return (long ? dayLabel(due) + ' · ' : '') + -n + ' d late';
    if (n === 0) return 'Today';
    if (n === 1) return 'Tomorrow';
    if (long) return dayLabel(due);
    return n < 7 ? WEEKDAYS_SHORT[weekdayIndex(due)] : shortDate(due);
  }

  /**
   * @param {string} today
   * @param {number} weekday 0 for Monday ... 6 for Sunday
   * @returns {string} the first date after today on that weekday
   */
  function nextWeekday(today, weekday) {
    const ahead = (weekday - weekdayIndex(today) + 7) % 7 || 7;
    return addDays(today, ahead);
  }

  /**
   * The date chips under every date field (PLAN §9.3): Tomorrow, +3 d, +follow-up days, +7 d and
   * next Monday. Duplicate dates are dropped.
   * @param {string} today
   * @param {number} [followUpDays]
   * @returns {Array<{label: string, date: string}>}
   */
  function quickDates(today, followUpDays) {
    if (!isIsoDate(today)) return [];
    const days = followUpDays === undefined ? DEFAULT_SETTINGS.follow_up_days : followUpDays;
    const out = [];
    const seen = {};
    [
      { label: 'Tomorrow', date: addDays(today, 1) },
      { label: '+3 d', date: addDays(today, 3) },
      { label: '+' + days + ' d', date: addDays(today, days) },
      { label: '+7 d', date: addDays(today, 7) },
      { label: 'Next Mon', date: nextWeekday(today, 0) },
    ].forEach(function (chip) {
      if (seen[chip.date]) return;
      seen[chip.date] = true;
      out.push(chip);
    });
    return out;
  }

  /**
   * The academic year starts on September 1; "Won this term" counts from there (PLAN A28).
   * @param {string} today
   * @returns {string|null}
   */
  function termStart(today) {
    const p = parseIsoDate(today);
    if (!p) return null;
    return (p.m >= 9 ? p.y : p.y - 1) + '-09-01';
  }

  /**
   * @param {*} weekday a number (0 Monday ... 6 Sunday) or an English day name
   * @returns {number|null}
   */
  function meetingWeekdayIndex(weekday) {
    if (typeof weekday === 'number' && weekday >= 0 && weekday <= 6) return Math.floor(weekday);
    const t = text(weekday).toLowerCase();
    if (!t) return null;
    for (let i = 0; i < 7; i++) {
      if (WEEKDAYS_LONG[i].toLowerCase().indexOf(t.slice(0, 3)) === 0) return i;
    }
    return null;
  }

  /**
   * @param {*} time "HH:MM" (24-hour)
   * @returns {number|null} minutes after midnight
   */
  function minutesOfDay(time) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(text(time));
    if (!m || Number(m[1]) > 23 || Number(m[2]) > 59) return null;
    return Number(m[1]) * 60 + Number(m[2]);
  }

  /**
   * The night before the weekly meeting, when My work asks everyone to bring their numbers up to
   * date: the 24 hours before the meeting (Settings "meeting"), or Sunday 17:00 to Monday 12:00
   * Vancouver time while no meeting day is set.
   * @param {number} nowMs
   * @param {{weekday: *, time: *}} [meeting]
   * @returns {boolean}
   */
  function isBeforeMeetingWindow(nowMs, meeting) {
    const localMs = nowMs + vancouverOffsetMinutes(nowMs) * 60000;
    const local = new Date(localMs);
    const minuteOfWeek =
      weekdayIndex(formatIso(localMs)) * 1440 + local.getUTCHours() * 60 + local.getUTCMinutes();
    const week = 7 * 1440;
    const weekday = meetingWeekdayIndex(meeting && meeting.weekday);
    let start;
    let end;
    if (weekday === null) {
      start = 6 * 1440 + 17 * 60;
      end = 12 * 60;
    } else {
      const at = minutesOfDay(meeting && meeting.time);
      end = weekday * 1440 + (at === null ? 18 * 60 : at);
      start = (end - 1440 + week) % week;
    }
    return start < end
      ? minuteOfWeek >= start && minuteOfWeek < end
      : minuteOfWeek >= start || minuteOfWeek < end;
  }

  /**
   * The day whose Monday-to-Sunday week a meeting looks back on. A Monday meeting (the default
   * while no day is set) reviews the week that ended the night before, so on that Monday the
   * scoreboard shows last week, not the new week that holds only Monday.
   * @param {string} today
   * @param {{weekday: *}} [meeting]
   * @returns {string} today, or yesterday on a Monday meeting day
   */
  function reportWeekDate(today, meeting) {
    if (!isIsoDate(today)) return today;
    const weekday = meetingWeekdayIndex(meeting && meeting.weekday);
    return weekdayIndex(today) === 0 && (weekday === null || weekday === 0)
      ? addDays(today, -1)
      : today;
  }

  /**
   * @param {string} today
   * @param {{weekday: *}} [meeting]
   * @returns {string} the next meeting day after today, or a week from today when none is set
   */
  function nextMeetingDate(today, meeting) {
    const weekday = meetingWeekdayIndex(meeting && meeting.weekday);
    return weekday === null ? addDays(today, 7) : nextWeekday(today, weekday);
  }

  /**
   * @param {{weekday: *}} [meeting]
   * @returns {string} e.g. "Monday's meeting", or "the meeting"
   */
  function meetingName(meeting) {
    const weekday = meetingWeekdayIndex(meeting && meeting.weekday);
    return weekday === null ? "Monday's meeting" : WEEKDAYS_LONG[weekday] + "'s meeting";
  }

  // ---------------------------------------------------------------------------
  // Sponsors: next action, stage changes, cadence (spec §6.2, §6.3, §6.8)
  // ---------------------------------------------------------------------------

  /** Stages where a sponsor does not need a next action. */
  const NO_NEXT_ACTION_STAGES = deepFreeze(['nurture', 'lost', 'closed_won']);
  /** Touches we send out, as opposed to replies and notes. */
  const OUTBOUND_KINDS = deepFreeze(['email', 'call', 'walk_in', 'follow_up']);
  /** Touches that count as "remote" in the weekly quota. */
  const REMOTE_KINDS = deepFreeze(['email', 'call', 'follow_up']);
  /** Fields the stage-change dialog may supply. */
  const STAGE_INPUT_FIELDS = deepFreeze([
    'next_action',
    'next_action_due',
    'lost_reason',
    'ask_summary',
    'potential_value_cad',
    'nurture_until',
    'summary',
  ]);
  const FOLLOW_UP_1 = 'Follow-up 1 (add something new)';
  const FOLLOW_UP_FINAL = 'Final follow-up';
  const BOOK_CALL = 'Book a 20-minute call';
  const PROPOSAL_FOLLOW_UP = 'Follow up on the proposal';
  const NURTURE_DAYS = 90;
  /** Stages where what was agreed (or asked for) must be written down (PLAN A10). */
  const TERMS_STAGES = deepFreeze(['proposal', 'negotiation', 'committed', 'closed_won']);
  /** Stages where the amount must also be written down (0 for in-kind). */
  const VALUE_STAGES = deepFreeze(['committed', 'closed_won']);

  /**
   * @param {string} stage
   * @returns {boolean} true when `stage` is one of the 16 stages
   */
  function isStage(stage) {
    return ENUMS.stage.indexOf(stage) !== -1;
  }

  /**
   * @param {string} stage
   * @returns {boolean} true when a sponsor in this stage must have a next action and a due date
   */
  function requiresNextAction(stage) {
    return isStage(stage) && NO_NEXT_ACTION_STAGES.indexOf(stage) === -1;
  }

  /**
   * @returns {{logo_received: boolean, goods_or_payment_received: boolean, social_post_done: boolean, thank_you_sent: boolean, recap_sent: boolean}}
   *   the deliverables checklist as it starts when a sponsor is won
   */
  function initialDeliverables() {
    return {
      logo_received: false,
      goods_or_payment_received: false,
      social_post_done: false,
      thank_you_sent: false,
      recap_sent: false,
    };
  }

  /**
   * @typedef {Object} Problem
   * @property {string} field the field the message belongs next to
   * @property {string} message plain-English explanation
   */

  /**
   * Checks a sponsor against the rules. Used by the client to disable Save with an inline
   * explanation and by the server to refuse the write regardless (spec §6.2).
   * @param {Object} sponsor
   * @param {{requireOwner?: boolean, attachedEventCount?: number}} [ctx]
   *   requireOwner: true when adding a sponsor from the form. attachedEventCount: how many
   *   events the sponsor is attached to; checked only when given.
   * @returns {Problem[]} empty when the sponsor is fine
   */
  function validateSponsor(sponsor, ctx) {
    const c = ctx || {};
    const s = sponsor || {};
    const problems = [];
    function add(field, message) {
      problems.push({ field: field, message: message });
    }
    if (!text(s.name)) add('name', 'Enter the sponsor name.');
    if (ENUMS.category.indexOf(text(s.category)) === -1) add('category', 'Pick a category.');
    if (text(s.priority) && ENUMS.priority.indexOf(text(s.priority)) === -1) {
      add('priority', 'Priority must be A, B or C.');
    }
    if (c.requireOwner && !text(s.owner_id)) add('owner_id', 'Pick an owner.');

    const stage = text(s.stage);
    if (!isStage(stage)) {
      add('stage', 'Pick a stage.');
    } else {
      if (requiresNextAction(stage)) {
        if (!text(s.next_action)) add('next_action', 'Every active sponsor needs a next action.');
        if (!isIsoDate(text(s.next_action_due))) {
          add('next_action_due', 'Give the next action a due date.');
        }
      }
      if (stage === 'lost' && !text(s.lost_reason)) {
        add('lost_reason', 'Say why this sponsor is lost.');
      }
      if (stage === 'nurture' && !isIsoDate(text(s.nurture_until))) {
        add('nurture_until', 'Pick when to look at this sponsor again.');
      }
      if (TERMS_STAGES.indexOf(stage) !== -1 && !text(s.ask_summary)) {
        add(
          'ask_summary',
          VALUE_STAGES.indexOf(stage) !== -1
            ? 'Write down what the sponsor agreed to.'
            : 'Write down what we are asking for.'
        );
      }
      if (VALUE_STAGES.indexOf(stage) !== -1 && text(s.potential_value_cad) === '') {
        add('potential_value_cad', 'Enter the amount in dollars (0 for goods or in-kind).');
      }
      if (stage === 'closed_won') {
        if (typeof c.attachedEventCount === 'number' && c.attachedEventCount < 1) {
          add('events', 'Attach at least one event before closing this sponsor.');
        }
      }
    }
    ['next_action_due', 'nurture_until', 'last_contact_at'].forEach(function (field) {
      const alreadyFlagged = problems.some(function (p) {
        return p.field === field;
      });
      if (!alreadyFlagged && text(s[field]) && !isIsoDate(text(s[field]))) {
        add(field, 'Use a date like 2026-10-16.');
      }
    });
    FIT_FIELDS.forEach(function (field) {
      const raw = s[field];
      if (raw === undefined || raw === null || text(raw) === '') return;
      const n = Number(raw);
      if (!isFinite(n) || n < 0 || n > 5 || Math.floor(n) !== n) {
        add(field, 'Score from 0 to 5.');
      }
    });
    if (text(s.potential_value_cad) !== '') {
      const v = Number(s.potential_value_cad);
      if (!isFinite(v) || v < 0) add('potential_value_cad', 'Enter an amount of 0 or more.');
    }
    return problems;
  }

  /**
   * What happens when a sponsor moves to a new stage (spec §6.2): the fields to write, anything
   * that blocks the move, and a suggested next action. Pure: the caller does the write.
   *  - lost: needs a reason; clears the next action.
   *  - nurture: sets "look again on" (default +90 days); clears the next action.
   *  - closed_won: needs an attached event and a filled ask summary; starts the deliverables.
   *  - anything else: needs a next action and due date (already on the sponsor, or in `input`).
   * @param {Object} sponsor the sponsor as it is now
   * @param {string} toStage
   * @param {Object} [input] values from the dialog: next_action, next_action_due, lost_reason,
   *   ask_summary, nurture_until
   * @param {{today?: string, attachedEventCount?: number, activities?: Object[], followUpDays?: number}} [ctx]
   * @returns {{ok: boolean, problems: Problem[], patch: Object|null, suggestion: Object|null}}
   */
  function applyStageChange(sponsor, toStage, input, ctx) {
    const inp = input || {};
    const c = ctx || {};
    if (!isStage(toStage)) {
      return {
        ok: false,
        problems: [{ field: 'stage', message: 'Unknown stage.' }],
        patch: null,
        suggestion: null,
      };
    }
    const patch = { stage: toStage };
    STAGE_INPUT_FIELDS.forEach(function (field) {
      if (inp[field] !== undefined) patch[field] = inp[field];
    });
    if (toStage === 'lost') {
      patch.next_action = '';
      patch.next_action_due = '';
      patch.nurture_until = '';
    } else if (toStage === 'nurture') {
      patch.nurture_until =
        text(inp.nurture_until) || (c.today ? addDays(c.today, NURTURE_DAYS) : '');
      patch.next_action = '';
      patch.next_action_due = '';
      patch.lost_reason = '';
    } else {
      if (sponsor.stage === 'lost') patch.lost_reason = '';
      if (sponsor.stage === 'nurture') patch.nurture_until = '';
    }
    if (toStage === 'closed_won' && !text(sponsor.deliverables_json)) {
      patch.deliverables_json = JSON.stringify(initialDeliverables());
    }
    const after = Object.assign({}, sponsor, patch);
    const relevant = [
      'stage',
      'next_action',
      'next_action_due',
      'lost_reason',
      'nurture_until',
      'ask_summary',
      'potential_value_cad',
      'events',
    ];
    const problems = validateSponsor(after, {
      attachedEventCount: toStage === 'closed_won' ? c.attachedEventCount || 0 : undefined,
    }).filter(function (p) {
      return relevant.indexOf(p.field) !== -1;
    });
    return {
      ok: problems.length === 0,
      problems: problems,
      patch: problems.length === 0 ? patch : null,
      suggestion: suggestNextAction(toStage, c.activities || [], c.today, c.followUpDays),
    };
  }

  /**
   * Suggested next action when a sponsor reaches a stage. Suggested, never forced (spec §6.3).
   * @param {string} toStage
   * @param {Object[]} activities the sponsor's activity rows
   * @param {string} today
   * @param {number} [followUpDays] 5 when omitted
   * @returns {{next_action: string, next_action_due: string}|null}
   */
  function suggestNextAction(toStage, activities, today, followUpDays) {
    if (!isIsoDate(today)) return null;
    const days = followUpDays === undefined ? DEFAULT_SETTINGS.follow_up_days : followUpDays;
    if (toStage === 'contacted')
      return { next_action: FOLLOW_UP_1, next_action_due: addDays(today, days) };
    if (toStage === 'follow_up') {
      // Counted as outbound touches since the last reply, so a second email logged as "Email"
      // still leads to the final follow-up (PLAN A8).
      return {
        next_action: outboundTouchesWithoutReply(activities) >= 2 ? FOLLOW_UP_FINAL : FOLLOW_UP_1,
        next_action_due: addDays(today, days),
      };
    }
    if (toStage === 'responded')
      return { next_action: BOOK_CALL, next_action_due: addDays(today, 3) };
    if (toStage === 'proposal')
      return { next_action: PROPOSAL_FOLLOW_UP, next_action_due: addDays(today, days) };
    if (toStage === 'committed')
      return { next_action: 'Confirm the details in writing', next_action_due: addDays(today, 3) };
    return null;
  }

  /**
   * The next action to propose in the Log sheet after a touch (PLAN §10.2): the follow-up rhythm
   * for outbound touches, a call after a reply, otherwise nothing (keep the current one).
   * @param {Object} sponsor the sponsor before the touch
   * @param {string} kind the kind of touch being logged
   * @param {Object[]} activities the sponsor's activity rows, including the new touch
   * @param {string} today
   * @param {number} [followUpDays]
   * @returns {{next_action: string, next_action_due: string}|null}
   */
  function nextActionAfterTouch(sponsor, kind, activities, today, followUpDays) {
    if (!isIsoDate(today)) return null;
    const days = followUpDays === undefined ? DEFAULT_SETTINGS.follow_up_days : followUpDays;
    const stage = text(sponsor && sponsor.stage);
    const phase = phaseOf(stage);
    if (kind === 'reply' && phase !== 'Won' && phase !== 'Conversation') {
      return { next_action: BOOK_CALL, next_action_due: addDays(today, 3) };
    }
    if (OUTBOUND_KINDS.indexOf(kind) === -1) return null;
    if (!(phase === 'Prospect' || stage === 'contacted' || stage === 'follow_up')) return null;
    const n = outboundTouchesWithoutReply(activities);
    if (n <= 1) return { next_action: FOLLOW_UP_1, next_action_due: addDays(today, days) };
    if (n === 2) return { next_action: FOLLOW_UP_FINAL, next_action_due: addDays(today, days) };
    return {
      next_action: 'No reply after ' + n + ' touches: try a new angle or move to Nurture',
      next_action_due: addDays(today, days),
    };
  }

  /**
   * At most one question after a touch is saved, in a fixed order (PLAN §10.3): move a Prospect
   * to Contacted, move a replying sponsor to Responded, or park an unanswered one in Nurture.
   * When the sponsor already has a next action dated after today (set in the Log sheet), the
   * move keeps it.
   * @param {Object} sponsor the sponsor after the touch was saved
   * @param {string} kind
   * @param {Object[]} activities the sponsor's activity rows, including the new touch
   * @param {string} today
   * @param {number} [followUpDays]
   * @returns {{key: string, toStage: string, label: string, detail: string, input: Object}|null}
   */
  function nextStepFor(sponsor, kind, activities, today, followUpDays) {
    if (!sponsor || !isIsoDate(today)) return null;
    const stage = text(sponsor.stage);
    const name = text(sponsor.name) || 'this sponsor';
    const keepCurrent =
      text(sponsor.next_action) &&
      isIsoDate(text(sponsor.next_action_due)) &&
      sponsor.next_action_due > today;
    function withNext(toStage) {
      return keepCurrent
        ? { next_action: sponsor.next_action, next_action_due: sponsor.next_action_due }
        : suggestNextAction(toStage, activities, today, followUpDays);
    }
    function detailOf(input) {
      return input && input.next_action
        ? 'Next: ' + input.next_action + ' · ' + dayLabel(input.next_action_due)
        : '';
    }
    if (shouldOfferMoveToContacted(stage, kind)) {
      const input = withNext('contacted');
      return {
        key: 'contacted',
        toStage: 'contacted',
        label: 'Move ' + name + ' to Contacted?',
        detail: detailOf(input),
        input: input,
      };
    }
    if (shouldPromptResponded(stage, kind)) {
      const input = withNext('responded');
      return {
        key: 'responded',
        toStage: 'responded',
        label: 'They replied. Move ' + name + ' to Responded?',
        detail: detailOf(input),
        input: input,
      };
    }
    if (needsNurtureNudge(sponsor, activities)) {
      const until = addDays(today, NURTURE_DAYS);
      return {
        key: 'nurture',
        toStage: 'nurture',
        label: 'No reply after 3 touches. Move ' + name + ' to Nurture?',
        detail: 'Look again on ' + dayLabel(until),
        input: { nurture_until: until },
      };
    }
    return null;
  }

  /**
   * Which kind of touch a next action describes, so "Done" can open the Log sheet with the
   * right button already chosen. A wrong guess costs one tap.
   * @param {string} nextAction
   * @returns {string} an activity kind
   */
  function guessKind(nextAction) {
    const t = text(nextAction);
    if (/follow/i.test(t)) return 'follow_up';
    if (/\b(call|phone|ring)\b/i.test(t)) return 'call';
    if (/\b(walk|visit|drop|stop by|in person)\b/i.test(t)) return 'walk_in';
    if (/\bmeet/i.test(t)) return 'meeting';
    return 'email';
  }

  /**
   * @param {Object[]} activities one sponsor's activity rows, in any order
   * @returns {number} outbound touches since the sponsor last replied (or in total, if never)
   */
  function outboundTouchesWithoutReply(activities) {
    const ordered = (activities || []).slice().sort(function (a, b) {
      return text(a.happened_on) < text(b.happened_on)
        ? -1
        : text(a.happened_on) > text(b.happened_on)
          ? 1
          : 0;
    });
    let count = 0;
    ordered.forEach(function (a) {
      if (a.kind === 'reply') count = 0;
      else if (OUTBOUND_KINDS.indexOf(a.kind) !== -1) count++;
    });
    return count;
  }

  /**
   * "No reply after 3 touches. Move to Nurture?" (spec §6.3)
   * @param {Object} sponsor
   * @param {Object[]} activities
   * @returns {boolean}
   */
  function needsNurtureNudge(sponsor, activities) {
    const stage = text(sponsor.stage);
    return (
      (stage === 'contacted' || stage === 'follow_up') &&
      outboundTouchesWithoutReply(activities) >= 3
    );
  }

  /**
   * @param {string} stage the sponsor's stage
   * @param {string} kind the kind of touch just logged
   * @returns {boolean} true when we should offer "Move to Responded?"
   */
  function shouldPromptResponded(stage, kind) {
    return (stage === 'contacted' || stage === 'follow_up') && kind === 'reply';
  }

  /**
   * @param {string} stage the sponsor's stage
   * @param {string} kind the kind of touch just logged
   * @returns {boolean} true when we should offer "Move to Contacted" (spec §7)
   */
  function shouldOfferMoveToContacted(stage, kind) {
    return phaseOf(stage) === 'Prospect' && OUTBOUND_KINDS.indexOf(kind) !== -1;
  }

  /**
   * @param {Object} sponsor
   * @returns {boolean} true when nobody owns the sponsor (spec §6.8)
   */
  function isUnassigned(sponsor) {
    return !text(sponsor.owner_id);
  }

  /**
   * @param {string} [fromName] previous owner's name
   * @param {string} [toName] new owner's name
   * @returns {string} the note written to the timeline when the owner changes (spec §6.8)
   */
  function ownerChangeSummary(fromName, toName) {
    return (
      'Owner changed from ' + (text(fromName) || 'nobody') + ' to ' + (text(toName) || 'nobody')
    );
  }

  /**
   * @param {Object} sponsor
   * @returns {boolean} true when we know how to reach someone there
   */
  function hasContact(sponsor) {
    return !!(
      text(sponsor.contact_name) ||
      text(sponsor.contact_email) ||
      text(sponsor.contact_phone)
    );
  }

  /** Categories that produced last year's wins (spec §1: local businesses and campus partners). */
  const WARM_CATEGORIES = deepFreeze(['cafe-bakery', 'restaurant', 'grocery', 'campus']);

  /**
   * Warm leads first, cold corporate last (spec §1).
   * @param {Object} sponsor
   * @returns {boolean} true for a past sponsor, a warm introduction, or a local or campus business
   */
  function isWarm(sponsor) {
    return (
      isTrue(sponsor.is_past_sponsor) ||
      !!text(sponsor.warm_intro) ||
      WARM_CATEGORIES.indexOf(text(sponsor.category)) !== -1
    );
  }

  /**
   * When a sponsor first gets an owner, its seeded "Assign an owner" action is replaced by a real
   * one, so the row leaves the overdue list the moment it is assigned (PLAN §10.6).
   * @param {Object} sponsor the sponsor before the change
   * @param {string} newOwnerId
   * @param {string} today
   * @returns {Object} extra fields to write with the owner change ({} when there are none)
   */
  function ownerAssignedPatch(sponsor, newOwnerId, today) {
    if (!text(newOwnerId) || text(sponsor.next_action) !== 'Assign an owner') return {};
    let action = 'Research and find a contact';
    if (isTrue(sponsor.is_past_sponsor)) action = 'Re-contact: ask about this year';
    else if (hasContact(sponsor)) action = 'Send the first email';
    return { next_action: action, next_action_due: addDays(today, 7) };
  }

  /**
   * @param {Object[]} sponsors
   * @param {string} memberId
   * @returns {number} sponsors the member owns that are not archived or parked
   */
  function activeSponsorCount(sponsors, memberId) {
    return sponsors.filter(function (s) {
      return s.owner_id === memberId && !isTrue(s.archived) && phaseOf(s.stage) !== 'Parked';
    }).length;
  }

  /**
   * @param {*} name
   * @returns {string} the name lower-cased, without a leading "the", punctuation or extra spaces
   */
  function normName(name) {
    return text(name)
      .toLowerCase()
      .replace(/^the\s+/, '')
      .replace(/[^a-z0-9À-ɏ]+/g, ' ')
      .trim();
  }

  /**
   * Sponsors whose names look like `name`, for the duplicate check in Add sponsor.
   * @param {string} name
   * @param {Object[]} sponsors
   * @param {number} [limit] 3 when omitted
   * @returns {{exact: Object|null, similar: Object[]}} exact: same name once trimmed and
   *   lower-cased (saving is refused); similar: up to `limit` names that start with or contain it
   */
  function findSimilarSponsors(name, sponsors, limit) {
    const wanted = normName(name);
    const exactKey = text(name).toLowerCase();
    if (!wanted) return { exact: null, similar: [] };
    let exact = null;
    const similar = [];
    sponsors.forEach(function (s) {
      if (text(s.name).toLowerCase() === exactKey) {
        if (!exact) exact = s;
        return;
      }
      const n = normName(s.name);
      if (
        n &&
        (n === wanted ||
          (wanted.length >= 3 && (n.indexOf(wanted) === 0 || wanted.indexOf(n) === 0)))
      ) {
        similar.push(s);
      }
    });
    return { exact: exact, similar: similar.slice(0, limit === undefined ? 3 : limit) };
  }

  /**
   * Groups of live sponsors that share a name once trimmed and lower-cased.
   * @param {Object[]} sponsors
   * @returns {Object[][]} each group has two or more sponsors
   */
  function duplicateGroups(sponsors) {
    const groups = {};
    sponsors.forEach(function (s) {
      if (isTrue(s.archived)) return;
      const key = text(s.name).toLowerCase();
      if (!key) return;
      (groups[key] = groups[key] || []).push(s);
    });
    return Object.keys(groups)
      .filter(function (k) {
        return groups[k].length > 1;
      })
      .map(function (k) {
        return groups[k];
      });
  }

  /**
   * Type-ahead over sponsors: names that start with the query first, then names that contain it,
   * then contact names and neighbourhoods. Archived sponsors last.
   * @param {string} query
   * @param {Object[]} sponsors
   * @param {number} [limit] 8 when omitted
   * @returns {Object[]}
   */
  function searchSponsors(query, sponsors, limit) {
    const q = text(query).toLowerCase();
    if (!q) return [];
    const scored = [];
    sponsors.forEach(function (s) {
      const name = text(s.name).toLowerCase();
      let score = -1;
      if (name.indexOf(q) === 0) score = 0;
      else if (name.indexOf(q) !== -1) score = 1;
      else if (
        text(s.contact_name).toLowerCase().indexOf(q) !== -1 ||
        text(s.neighbourhood).toLowerCase().indexOf(q) !== -1
      )
        score = 2;
      if (score < 0) return;
      if (isTrue(s.archived)) score += 3;
      scored.push({ s: s, score: score, name: name });
    });
    scored.sort(function (a, b) {
      return a.score - b.score || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
    });
    return scored.slice(0, limit === undefined ? 8 : limit).map(function (x) {
      return x.s;
    });
  }

  /**
   * @param {Object[]} activities
   * @param {string} [sponsorId] only this sponsor's rows, when given
   * @returns {Object|null} the latest "Terms confirmed" note (PLAN A10)
   */
  function termsConfirmedNote(activities, sponsorId) {
    let best = null;
    (activities || []).forEach(function (a) {
      if (sponsorId && a.sponsor_id !== sponsorId) return;
      if (!/^Terms confirmed/.test(text(a.summary))) return;
      if (!best || text(a.created_at) > text(best.created_at)) best = a;
    });
    return best;
  }

  /**
   * @param {Object} sponsor
   * @param {string} vpName
