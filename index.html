          light.length ? h('p', { class: 'note-inline', style: 'margin-top:10px' }, 'Under 10 active sponsors: ' + light.map(function (m) { return Rules.firstName(m.full_name) + ' (' + Rules.activeSponsorCount(Hub.rows('Sponsors'), m.id) + ')'; }).join(', ') + '. Who sources new warm targets?') : null,
          vp ? h('h3', { style: 'margin:18px 0 6px' }, 'Actions') : null,
          vp ? actionTable(d) : null,
        ])
      );
      return page;
    }

    function section(key, content) {
      const meta = Rules.MEETING_SECTIONS.filter(function (s) {
        return s.key === key;
      })[0];
      return h(
        'section',
        { class: 'agenda-section', id: 'agenda-' + key },
        h('div', { class: 'section-head' }, h('h2', null, meta.title), h('span', { class: 'budget' }, meta.minutes + ' min')),
        content
      );
    }

    function actionTable(d) {
      const people = Hub.activeMembers().filter(function (m) {
        return Rules.roleAtLeast(m.role, 'coordinator');
      });
      const rows = d.actions.map(function (a, i) {
        return h(
          'tr',
          null,
          h('td', { style: 'width:46%' }, h('input', { class: 'input', 'data-key': 'act-title-' + a.key, placeholder: 'What', value: a.title, onInput: function (e) { a.title = e.target.value; keep(); }, onKeydown: function (e) { if (e.key === 'Enter') { d.actions.splice(i + 1, 0, newAction()); keep(); Hub.render(true); focusTitle(d.actions[i + 1].key); } } })),
          h(
            'td',
            null,
            h(
              'select',
              { class: 'select', 'aria-label': 'Owner', onChange: function (e) { a.owner_id = e.target.value; keep(); } },
              h('option', { value: '' }, 'Owner…'),
              people.map(function (m) {
                const opt = h('option', { value: m.id }, m.full_name);
                if (m.id === a.owner_id) opt.selected = true;
                return opt;
              })
            )
          ),
          h('td', { style: 'width:150px' }, h('input', { class: 'input', type: 'date', 'aria-label': 'Due', value: a.due_on, onChange: function (e) { a.due_on = e.target.value; keep(); } })),
          h('td', { style: 'width:44px' }, h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Remove row', onClick: function () { d.actions.splice(i, 1); keep(); Hub.render(true); } }, Hub.icon('close')))
        );
      });
      return h(
        'div',
        null,
        rows.length ? h('table', { class: 'action-table' }, h('tbody', null, rows)) : h('p', { class: 'muted' }, 'No actions yet. Each row becomes a task with an owner and a date when you save.'),
        h('button', { type: 'button', class: 'btn btn-secondary btn-sm', style: 'margin-top:8px', onClick: function () { const a = newAction(); d.actions.push(a); keep(); Hub.render(true); focusTitle(a.key); } }, Hub.icon('plus'), 'Add row')
      );
    }

    function focusTitle(key) {
      setTimeout(function () {
        const el = document.querySelector('[data-key="act-title-' + key + '"]');
        if (el) el.focus();
      }, 20);
    }

    function summary(d) {
      const today = Hub.today();
      const set = Hub.settings();
      const people = Hub.activeMembers().filter(function (m) {
        return Rules.roleAtLeast(m.role, 'coordinator');
      });
      const board = Rules.scoreboard(people, Hub.rows('Activity'), Rules.reportWeekDate(today, set.meeting), set.quotas);
      const hot = Rules.hotLeads(Hub.rows('Sponsors'), Hub.rows('Activity'), today).map(function (x) {
        const s = x.sponsor;
        return s.name + ' (' + (Rules.firstName(Hub.memberName(s.owner_id)) || 'unassigned') + ') · ' + Hub.labelOf(Rules.STAGE_LABEL, s.stage) + (s.next_action ? ' · next: ' + s.next_action + (s.next_action_due ? ' by ' + Rules.shortDate(s.next_action_due) : '') : '');
      });
      const deadlines = Hub.upcomingEvents()
        .map(function (e) {
          return Rules.eventStatus(e, Hub.statusData(), today, Hub.leadVp());
        })
        .filter(function (st) {
          return st.health === 'red' || st.health === 'amber';
        })
        .map(function (st) {
          return st.lines.join('\n  ');
        });
      return Rules.meetingSummaryText({
        date: d.date,
        win: d.win,
        total: board.total.counts,
        hotLeads: hot,
        deadlines: deadlines,
        skillDrop: d.skill,
        actions: d.actions.map(function (a) {
          return { owner: Hub.memberName(a.owner_id), title: a.title, due: a.due_on };
        }),
      });
    }

    function copySlack() {
      const d = draft();
      if (Hub.copyAndTell(summary(d), 'Slack summary')) {
        d.copied = true;
        keep();
      }
    }

    function saveMeeting() {
      const d = draft();
      const today = Hub.today();
      const already = Hub.rows('Meetings').some(function (m) {
        return m.held_on === d.date && m.id !== d.id;
      });
      if (already && !Hub.state.ui.meetingConfirmDouble) {
        Hub.openMenu({
          title: 'A meeting is already saved for today',
          items: [
            { label: 'Save a second one anyway', onSelect: function () { Hub.state.ui.meetingConfirmDouble = true; saveMeeting(); } },
            { label: 'Cancel', onSelect: function () {} },
          ],
        });
        return;
      }
      const ownerless = d.actions.filter(function (a) {
        return a.title.trim() && !a.owner_id;
      });
      if (ownerless.length) {
        Hub.toast({ error: true, text: 'Give every action an owner first: ' + ownerless.map(function (a) { return a.title.trim(); }).join(', ') + '.' });
        return;
      }
      Hub.state.ui.meetingConfirmDouble = false;
      const actions = d.actions
        .filter(function (a) {
          return a.title.trim();
        })
        .map(function (a) {
          return { title: a.title.trim(), owner_id: a.owner_id, due_on: a.due_on, event_id: a.event_id, sponsor_id: a.sponsor_id };
        });
      const slack = summary(d);
      const agenda = {
        wins_since: winsSince(),
        hot: Rules.hotLeads(Hub.rows('Sponsors'), Hub.rows('Activity'), today).map(function (x) {
          return x.sponsor.id;
        }),
        overdue: Rules.needsAttention({ sponsors: Hub.rows('Sponsors'), tasks: Hub.rows('Tasks') }, today).length,
        slack: slack,
      };
      const input = {
        id: d.id,
        held_on: d.date,
        attendee_ids: d.attendees,
        win_of_week: d.win.trim(),
        skill_drop: d.skill.trim(),
        agenda_json: agenda,
        notes: '',
        posted_to_slack: d.copied === true,
        actions: actions,
      };
      const meetingRow = { id: d.id, held_on: d.date, attendee_ids: d.attendees.join(','), win_of_week: input.win_of_week, skill_drop: input.skill_drop, agenda_json: JSON.stringify(agenda), notes: '', posted_to_slack: input.posted_to_slack, created_at: Hub.nowIso(), updated_at: '' };
      // The same task ids the server will use (Rules.derivedId), so nothing needs swapping after.
      const temps = actions.map(function (a, i) {
        return { tab: 'Tasks', row: Object.assign({ id: Rules.derivedId(d.id, i), source: 'meeting', status: 'open', meeting_id: d.id, created_at: Hub.nowIso(), updated_at: '', done_at: '' }, a) };
      });
      const inserts = [{ tab: 'Meetings', row: meetingRow }].concat(temps);
      Hub.save({
        what: 'the meeting',
        inserts: inserts,
        // The draft is cleared below, so the save is kept in this browser until it goes through.
        persist: { fn: 'saveMeeting', args: [input], inserts: inserts },
        send: function () {
          return Hub.call('saveMeeting', input);
        },
      });
      Hub.state.ui.meetingDraft = null;
      Hub.setPref(DRAFT, null);
      Hub.toast({ text: 'Meeting saved · ' + Hub.plural(actions.length, 'task') + ' created', ms: 4000 });
      Hub.go('team');
    }

    function tick() {
      const el = document.getElementById('meeting-clock');
      if (!el || !Hub.state.ui.meetingDraft) return;
      const c = clockText(Hub.state.ui.meetingDraft);
      el.textContent = c.text;
      el.className = 'clock' + (c.over ? ' over' : '');
      const sec = document.getElementById('meeting-section');
      if (sec) sec.textContent = c.section;
    }

    Hub.views.meeting = {
      title: 'Meeting',
      render: render,
      after: function () {
        if (!clockTimer) clockTimer = setInterval(tick, 1000);
      },
    };
  })();
</script>

    <script>
  /*
   * Templates and Copy email (docs/PLAN.md §10.8, §10.15). From a sponsor the right template is
   * picked and filled from the record (one meal count, from Settings); what the Hub cannot know
   * becomes a small field; Copy works inside Google's frame; "I sent it" logs the touch where the
   * send happens. VPs edit the wording on the Templates page.
   */
  (function () {
    'use strict';
    const Hub = window.Hub;
    const h = Hub.h;

    const FIELD_LABEL = {
      why_them: 'Why them, in one line',
      new_thing: "One thing you didn't mention before",
      walk_in_day: 'When you can drop by',
      deliverables: "What we'll do for them",
      contact_name: 'Contact name',
      ask_summary: "What you're asking for",
      event_name: 'Event',
      event_date: 'Event date',
      sponsor_name: 'Sponsor name',
      sender_name: 'Your name',
    };
    const KIND_ORDER = ['walk_in_script', 'cold_email', 'follow_up', 'impact_sprint', 'education_consulting', 'thank_you'];

    /** @param {string} text @returns {HTMLElement} text with {{placeholders}} highlighted */
    function highlighted(text) {
      const out = h('div', { class: 'template-preview' });
      String(text)
        .split(/(\{\{\s*[a-z_][a-z0-9_]*\s*\}\})/i)
        .forEach(function (part) {
          if (/^\{\{/.test(part)) Hub.add(out, h('span', { class: 'ph' }, part));
          else if (part) Hub.add(out, document.createTextNode(part));
        });
      return out;
    }

    function templates() {
      return Hub.rows('Templates')
        .slice()
        .sort(function (a, b) {
          return KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind);
        });
    }

    /** Copy email from a sponsor (PLAN §10.8). */
    function openCopyEmail(sponsorId) {
      const s = Hub.byId('Sponsors', sponsorId);
      if (!s) return;
      const today = Hub.today();
      const events = Hub.eventsFor(s.id);
      const upcoming = events.filter(function (e) {
        return e.status !== 'done' && e.status !== 'cancelled' && (!Rules.isIsoDate(e.starts_on) || e.starts_on >= today);
      });
      const picked = Rules.pickTemplate(s, events, Hub.rows('Templates'));
      const st = { templateId: picked ? picked.id : '', eventId: (upcoming[0] || events[0] || {}).id || '', fills: {}, copied: false };

      function template() {
        return Hub.byId('Templates', st.templateId);
      }
      function data() {
        const base = Rules.buildTemplateData({ sponsor: s, event: Hub.byId('Events', st.eventId), member: Hub.state.me, settings: Hub.settings() });
        Object.keys(st.fills).forEach(function (k) {
          if (String(st.fills[k]).trim()) base[k] = st.fills[k].trim();
        });
        return base;
      }

      const api = Hub.openSheet({
        title: 'Copy email · ' + s.name,
        size: 'tall wide',
        render: function (body) {
          const t = template();
          Hub.add(body, 
            h(
              'div',
              { class: 'chips-row', role: 'group', 'aria-label': 'Template', style: 'margin-bottom:10px' },
              templates().map(function (x) {
                return h(
                  'button',
                  {
                    type: 'button',
                    class: 'fchip',
                    'aria-pressed': x.id === st.templateId ? 'true' : 'false',
                    onClick: function () {
                      st.templateId = x.id;
                      st.copied = false;
                      api.refresh();
                    },
                  },
                  x.name
                );
              })
            )
          );
          if (!t) {
            Hub.add(body, Hub.emptyState('No templates yet.'));
            return;
          }
          if (Rules.isStubTemplate(t)) {
            Hub.add(body, h('div', { class: 'banner warn' }, h('div', { class: 'grow' }, 'This template has no text yet. A VP pastes it from the Everything doc (tab: Our Cold Emails) on the Templates page.')));
            return;
          }
          if (events.length > 1) {
            Hub.add(body, 
              Hub.field(
                'Event',
                h(
                  'select',
                  {
                    class: 'select',
                    onChange: function (e) {
                      st.eventId = e.target.value;
                      api.refresh();
                    },
                  },
                  events.map(function (e) {
                    const opt = h('option', { value: e.id }, e.name);
                    if (e.id === st.eventId) opt.selected = true;
                    return opt;
                  })
                )
              )
            );
          }
          const fields = Rules.templateFields(t.subject + '\n' + t.body).filter(function (f) {
            const v = Rules.buildTemplateData({ sponsor: s, event: Hub.byId('Events', st.eventId), member: Hub.state.me, settings: Hub.settings() })[f];
            return v === undefined || v === null || String(v).trim() === '';
          });
          const preview = h('div', { 'data-preview': 'true' });
          Hub.add(body, preview);
          function updatePreview() {
            const dd = data();
            const subject = Rules.renderTemplate(t.subject || '', dd);
            const text = Rules.renderTemplate(t.body || '', dd);
            const missing = text.missing.concat(subject.missing).filter(function (x, i, a) {
              return a.indexOf(x) === i;
            });
            Hub.fill(
              preview,
              subject.text ? h('p', { class: 'small' }, h('strong', null, 'Subject: '), subject.text) : null,
              t.kind === 'walk_in_script' ? h('div', { class: 'script-large' }, highlighted(text.text)) : highlighted(text.text),
              missing.length ? h('p', { class: 'muted small', style: 'margin-top:6px' }, 'Still to fill: ' + missing.join(', ')) : null
            );
          }
          updatePreview();
          if (fields.length) {
            Hub.add(body, h('div', { class: 'block-label' }, 'Fill in the highlighted blanks'));
            const grid = h('div', { class: 'fill-grid' });
            fields.forEach(function (f) {
              Hub.add(
                grid,
                Hub.field(
                  FIELD_LABEL[f] || f.replace(/_/g, ' '),
                  h('input', {
                    class: 'input',
                    'data-key': 'fill-' + f,
                    value: st.fills[f] || '',
                    onInput: function (e) {
                      st.fills[f] = e.target.value;
                      updatePreview();
                    },
                  })
                )
              );
            });
            Hub.add(body, grid);
          }
          Hub.add(body, h('p', { class: 'muted small', style: 'margin-top:4px' }, 'Send from the shared inbox, ' + Rules.SHARED_INBOX + ', so any VP can pick up the reply.'));
        },
        foot: function (f) {
          const t = template();
          if (!t || Rules.isStubTemplate(t)) return;
          const dd = data();
          const subject = Rules.renderTemplate(t.subject || '', dd).text;
          if (subject) {
            Hub.add(f, 
              h('button', {
                type: 'button',
                class: 'btn btn-secondary',
                onClick: function () {
                  Hub.copyAndTell(Rules.renderTemplate(t.subject || '', data()).text, 'Subject');
                },
              }, 'Copy subject')
            );
          }
          Hub.add(f, 
            h('button', {
              type: 'button',
              class: 'btn btn-primary-wide',
              onClick: function () {
                if (Hub.copyAndTell(Rules.renderTemplate(t.body || '', data()).text, t.kind === 'walk_in_script' ? 'Script' : 'Email')) {
                  st.copied = true;
                  api.refresh();
                }
              },
            }, Hub.icon('copy'), t.kind === 'walk_in_script' ? 'Copy script' : 'Copy email')
          );
          if (st.copied && Hub.canEdit()) {
            const kind = t.kind === 'walk_in_script' ? 'walk_in' : t.kind === 'follow_up' ? 'follow_up' : 'email';
            Hub.add(f, 
              h('button', {
                type: 'button',
                class: 'btn',
                style: 'background:var(--ok);color:#fff',
                onClick: function () {
                  api.close('sent');
                  if (kind === 'walk_in') Hub.openLog({ sponsorId: s.id, kind: kind });
                  else Hub.quickTouch(s.id, kind, 'Sent: ' + (Rules.renderTemplate(t.subject || '', data()).text || t.name));
                },
              }, Hub.icon('check'), kind === 'walk_in' ? 'Log the walk-in' : 'I sent it: log it')
            );
          }
        },
      });
      return api;
    }

    function render() {
      const list = templates();
      const links = Hub.settings().links || {};
      const page = h(
        'div',
        { class: 'page' },
        h(
          'div',
          { class: 'page-head' },
          h('h1', null, 'Templates'),
          links.one_pager_url ? h('a', { class: 'btn btn-secondary btn-sm', href: links.one_pager_url, target: '_blank', rel: 'noopener' }, Hub.icon('external'), 'One-pager') : null,
          links.everything_doc_url ? h('a', { class: 'btn btn-secondary btn-sm', href: links.everything_doc_url, target: '_blank', rel: 'noopener' }, Hub.icon('external'), 'Everything doc') : null
        ),
        h('p', { class: 'muted' }, 'Open a template from a sponsor (Copy email) to fill it in for them. Here you can read and copy them as they are.')
      );
      if (!list.length) Hub.add(page, h('div', { class: 'card' }, Hub.emptyState('No templates yet. Run seedAll in the Apps Script editor to add the starting set.')));
      list.forEach(function (t) {
        const stub = Rules.isStubTemplate(t);
        const noInbox = !stub && t.kind !== 'walk_in_script' && String(t.body).indexOf(Rules.SHARED_INBOX) === -1;
        const rendered = Rules.renderTemplate(t.body || '', Rules.buildTemplateData({ member: Hub.state.me, settings: Hub.settings() })).text;
        Hub.add(page, 
          h(
            'section',
            { class: 'card card-pad section' },
            h('div', { class: 'hstack wrap', style: 'margin-bottom:6px' }, h('h2', { class: 'grow' }, t.name), h('span', { class: 'chip outline' }, t.kind.replace(/_/g, ' '))),
            t.subject ? h('p', { class: 'small' }, h('strong', null, 'Subject: '), t.subject) : null,
            stub
              ? h('div', { class: 'banner warn' }, h('div', { class: 'grow' }, 'No text yet. ' + (Hub.isVp() ? 'Paste it from the Everything doc (tab: Our Cold Emails) with Edit.' : 'A VP pastes it from the Everything doc.')))
              : h('div', { class: t.kind === 'walk_in_script' ? 'script-large' : '' }, highlighted(rendered)),
            noInbox ? h('p', { class: 'muted small', style: 'margin-top:6px' }, 'Tip: end with the signature so replies reach the shared inbox: ' + Rules.SHARED_INBOX) : null,
            h(
              'div',
              { class: 'hstack', style: 'margin-top:10px' },
              stub ? null : h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onClick: function () { Hub.copyAndTell(rendered, 'Template'); } }, Hub.icon('copy'), 'Copy'),
              Hub.isVp() ? h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onClick: function () { openEditor(t.id); } }, 'Edit') : null
            )
          )
        );
      });
      return page;
    }

    function openEditor(id) {
      const t = Hub.byId('Templates', id);
      if (!t) return;
      const v = { name: t.name, subject: t.subject || '', body: t.body || '' };
      const api = Hub.openSheet({
        title: 'Edit · ' + t.name,
        size: 'tall wide',
        isDirty: function () {
          return v.body !== t.body || v.subject !== (t.subject || '') || v.name !== t.name;
        },
        render: function (body) {
          Hub.add(body, 
            Hub.field('Name', h('input', { class: 'input', 'data-key': 'tpl-name', value: v.name, onInput: function (e) { v.name = e.target.value; } })),
            Hub.field('Subject', h('input', { class: 'input', 'data-key': 'tpl-subject', value: v.subject, onInput: function (e) { v.subject = e.target.value; } })),
            Hub.field('Text', h('textarea', { class: 'textarea', 'data-key': 'tpl-body', style: 'min-height:280px', value: v.body, onInput: function (e) { v.body = e.target.value; } }), {
              hint: 'Placeholders the Hub fills: {{contact_name}} {{sponsor_name}} {{event_name}} {{event_date}} {{ask_summary}} {{meals}} {{founded_year}} {{sender_name}}. Anything else in {{double braces}} becomes a field to fill when copying.',
            }),
            h(
              'button',
              {
                type: 'button',
                class: 'btn btn-ghost btn-sm',
                onClick: function () {
                  if (v.body.indexOf(Rules.SHARED_INBOX) === -1) {
                    v.body = v.body.replace(/\s+$/, '') + '\n\n{{sender_name}}\nProject Hastings UBC Sponsorships\n' + Rules.SHARED_INBOX;
                    api.refresh();
                  }
                },
              },
              'Add the signature'
            )
          );
        },
        foot: function (f) {
          Hub.add(f, 
            h('button', {
              type: 'button',
              class: 'btn btn-primary-wide',
              onClick: function () {
                const patch = {};
                if (v.name.trim() !== t.name) patch.name = v.name.trim();
                if (v.subject !== (t.subject || '')) patch.subject = v.subject;
                if (v.body !== t.body) patch.body = v.body;
                api.close('saved');
                if (!Object.keys(patch).length) return;
                Hub.save({
                  what: t.name,
                  changes: [{ tab: 'Templates', id: t.id, patch: patch }],
                  conflictTab: 'Templates',
                  send: function () {
                    return Hub.call('saveTemplate', t.id, patch, Hub.sendVersion('Templates', t.id, t.updated_at || ''));
                  },
                });
              },
            }, 'Save')
          );
        },
      });
    }

    Hub.views.templates = { title: 'Templates', render: render };
    Hub.openCopyEmail = openCopyEmail;
  })();
</script>

    <script>
  /*
   * Settings (docs/PLAN.md §10.16): what a vp can change without code, the set-up still left to
   * do, and the exports for handover. Others see the values read-only.
   */
  (function () {
    'use strict';
    const Hub = window.Hub;
    const h = Hub.h;
    const WEEKDAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

    /**
     * @param {string} key
     * @param {*} value
     * @param {string} label
     * @param {string} seen the setting's updated_at when the VP started editing it
     */
    function saveSetting(key, value, label, seen) {
      const row = Hub.byId('Settings', key);
      const json = JSON.stringify(value);
      Hub.save({
        what: label || key,
        changes: row ? [{ tab: 'Settings', id: key, patch: { value_json: json } }] : [],
        inserts: row ? [] : [{ tab: 'Settings', row: { key: key, value_json: json, created_at: Hub.nowIso(), updated_at: '' } }],
        conflictTab: 'Settings',
        send: function () {
          return Hub.call('saveSetting', key, value, Hub.sendVersion('Settings', key, seen));
        },
        done: function () {
          Hub.applyTheme();
        },
      });
      Hub.toast({ text: (label || 'Setting') + ' saved', ms: 2000 });
    }

    /**
     * A card's values while a VP edits them. Kept in Hub.state.ui, so a poll that redraws the page
     * keeps what they typed (PLAN A3); until they type, it follows the saved settings. `seen` holds
     * each setting's version as they started, so a colleague's save in between is a conflict.
     * @param {string} name
     * @param {string[]} keys the Settings keys the card saves
     * @param {function(): Object} fresh the values from the saved settings
     * @returns {{values: Object, seen: Object<string, string>, dirty: boolean}}
     */
    function draft(name, keys, fresh) {
      const all = Hub.state.ui.settingsDrafts || (Hub.state.ui.settingsDrafts = {});
      if (!all[name] || !all[name].dirty) {
        all[name] = { values: fresh(), seen: {}, dirty: false };
        keys.forEach(function (k) {
          all[name].seen[k] = Hub.versionOf('Settings', k);
        });
      }
      return all[name];
    }

    /** Forgets a card's edits once they are saved. */
    function saved(name) {
      if (Hub.state.ui.settingsDrafts) delete Hub.state.ui.settingsDrafts[name];
    }

    /**
     * @param {Object<string, *>} values
     * @param {Object<string, string>} labels key -> what the box is called
     * @returns {boolean} true when a number box was left empty (and says which)
     */
    function blankNumber(values, labels) {
      const empty = Object.keys(labels).filter(function (k) {
        return values[k] === '' || values[k] === null || (typeof values[k] === 'number' && isNaN(values[k]));
      })[0];
      if (empty) Hub.toast({ error: true, text: 'Fill in "' + labels[empty] + '" first.' });
      return !!empty;
    }

    function card(title, content, foot) {
      return h('section', { class: 'card card-pad section' }, h('h2', { style: 'margin-bottom:10px' }, title), content, foot || null);
    }

    function numberField(label, value, onInput, attrs) {
      return Hub.field(label, h('input', Object.assign({ class: 'input', type: 'number', min: 0, value: value === null || value === undefined ? '' : value, onInput: function (e) { onInput(e.target.value === '' ? '' : Number(e.target.value)); } }, attrs || {})));
    }

    function render() {
      const set = Hub.settings();
      const vp = Hub.isVp();
      const page = h('div', { class: 'page', style: 'max-width:820px' }, h('div', { class: 'page-head' }, h('h1', null, 'Settings')));
      Hub.add(page, setupLeft());
      if (!vp) Hub.add(page, h('p', { class: 'muted' }, 'Only a VP can change these. Here is how the Hub is set up.'));

      // Impact stats
      const impact = draft('impact', ['impact_stats'], function () {
        return { stats: Object.assign({}, set.impact_stats) };
      });
      const stats = impact.values.stats;
      const STAT_LABELS = { meals: 'Meals served', founded_year: 'Founded in', volunteers: 'Volunteers', raised_cad: 'Raised (CAD)' };
      Hub.add(page,
        card(
          'Impact numbers (used in every email)',
          h(
            'div',
            null,
            Object.keys(STAT_LABELS).map(function (k) {
              return numberField(STAT_LABELS[k], stats[k], function (v) { stats[k] = v; impact.dirty = true; }, { disabled: !vp || null, 'data-key': 'set-' + k });
            })
          ),
          vp
            ? h('button', { type: 'button', class: 'btn btn-sm', onClick: function () {
                if (blankNumber(stats, STAT_LABELS)) return;
                saveSetting('impact_stats', stats, 'Impact numbers', impact.seen.impact_stats);
                saved('impact');
              } }, 'Save')
            : null
        )
      );

      // Quotas
      const quotas = draft('quotas', ['quotas'], function () {
        return { q: Object.assign({}, set.quotas) };
      });
      const q = quotas.values.q;
      const QUOTA_LABELS = {
        remote_min: 'Remote touches: target',
        remote_max: 'Remote touches: upper',
        walkins_min: 'Walk-ins: target',
        walkins_max: 'Walk-ins: upper',
        busy_remote: 'Remote target in a busy week',
      };
      Hub.add(page,
        card(
          'Weekly targets (coordinators)',
          h(
            'div',
            null,
            Object.keys(QUOTA_LABELS).map(function (k) {
              return numberField(QUOTA_LABELS[k], q[k], function (v) { q[k] = v; quotas.dirty = true; }, { disabled: !vp || null, 'data-key': 'set-' + k });
            }),
            h('label', { class: 'hstack', style: 'min-height:44px' }, h('input', { type: 'checkbox', checked: q.busy_week === true, disabled: !vp || null, onChange: function (e) { q.busy_week = e.target.checked; quotas.dirty = true; } }), 'Busy week (before Impact Sprint)')
          ),
          vp
            ? h('button', { type: 'button', class: 'btn btn-sm', onClick: function () {
                if (blankNumber(q, QUOTA_LABELS)) return;
                saveSetting('quotas', q, 'Targets', quotas.seen.quotas);
                saved('quotas');
              } }, 'Save')
            : null
        )
      );

      // Meeting and rhythm
      const rhythm = draft('rhythm', ['meeting', 'follow_up_days', 'ask_lead_days', 'phase'], function () {
        return {
          m: Object.assign({}, set.meeting),
          followUp: set.follow_up_days,
          leadDays: set.ask_lead_days,
          phaseName: (set.phase && set.phase.name) || '',
        };
      });
      const r = rhythm.values;
      const m = r.m;
      const weekdayIdx = Rules.meetingWeekdayIndex(m.weekday);
      function edited() {
        rhythm.dirty = true;
      }
      Hub.add(page,
        card(
          'Meeting and rhythm',
          h(
            'div',
            null,
            Hub.field(
              'Weekly meeting day',
              h(
                'select',
                { class: 'select', disabled: !vp || null, onChange: function (e) { m.weekday = e.target.value || null; edited(); } },
                h('option', { value: '' }, 'Not set (Sunday evening is the night before)'),
                WEEKDAYS.map(function (d, i) {
                  const opt = h('option', { value: d }, d);
                  if (weekdayIdx === i) opt.selected = true;
                  return opt;
                })
              )
            ),
            Hub.field('Time', h('input', { class: 'input', type: 'time', value: m.time || '', disabled: !vp || null, onInput: function (e) { m.time = e.target.value || null; edited(); } })),
            numberField('Length (minutes)', m.length_min, function (v) { m.length_min = v; edited(); }, { disabled: !vp || null }),
            numberField('Days until a follow-up', r.followUp, function (v) { r.followUp = v; edited(); }, { disabled: !vp || null, min: 1 }),
            numberField('Asks go out this many days before an event', r.leadDays, function (v) { r.leadDays = v; edited(); }, { disabled: !vp || null, min: 1 }),
            Hub.field('Phase name', h('input', { class: 'input', value: r.phaseName || '', disabled: !vp || null, onInput: function (e) { r.phaseName = e.target.value; edited(); } }))
          ),
          vp
            ? h(
                'button',
                {
                  type: 'button',
                  class: 'btn btn-sm',
                  onClick: function () {
                    if (blankNumber({ length_min: m.length_min === undefined ? 0 : m.length_min, followUp: r.followUp, leadDays: r.leadDays }, { length_min: 'Length (minutes)', followUp: 'Days until a follow-up', leadDays: 'Asks go out this many days before an event' })) return;
                    saveSetting('meeting', m, 'Meeting', rhythm.seen.meeting);
                    if (r.followUp !== set.follow_up_days) saveSetting('follow_up_days', Number(r.followUp), 'Follow-up days', rhythm.seen.follow_up_days);
                    if (r.leadDays !== set.ask_lead_days) saveSetting('ask_lead_days', Number(r.leadDays), 'Lead days', rhythm.seen.ask_lead_days);
                    if (r.phaseName.trim() && r.phaseName.trim() !== (set.phase && set.phase.name)) saveSetting('phase', { name: r.phaseName.trim() }, 'Phase', rhythm.seen.phase);
                    saved('rhythm');
                  },
                },
                'Save'
              )
            : null
        )
      );

      // Lead VP and links
      const vps = Hub.activeMembers().filter(function (x) {
        return x.role === 'vp';
      });
      const linkDraft = draft('links', ['lead_vp_id', 'links'], function () {
        return {
          leadId: set.lead_vp_id || '',
          links: Object.assign({ one_pager_url: '', everything_doc_url: '', slack_channel_url: '' }, set.links),
        };
      });
      const links = linkDraft.values.links;
      Hub.add(page,
        card(
          'Requests and links',
          h(
            'div',
            null,
            Hub.field(
              'Requests from other portfolios go to',
              h(
                'select',
                { class: 'select', disabled: !vp || null, onChange: function (e) { linkDraft.values.leadId = e.target.value; linkDraft.dirty = true; } },
                h('option', { value: '' }, 'The first VP on the list' + (vps[0] ? ' (' + vps[0].full_name + ')' : '')),
                vps.map(function (x) {
                  const opt = h('option', { value: x.id }, x.full_name);
                  if (x.id === linkDraft.values.leadId) opt.selected = true;
                  return opt;
                })
              )
            ),
            ['one_pager_url', 'everything_doc_url', 'slack_channel_url'].map(function (k) {
              return Hub.field({ one_pager_url: 'One-pager (link)', everything_doc_url: 'Everything doc (link)', slack_channel_url: 'Slack channel (link)' }[k], h('input', { class: 'input', type: 'url', placeholder: 'https://', value: links[k], disabled: !vp || null, onInput: function (e) { links[k] = e.target.value.trim(); linkDraft.dirty = true; } }));
            })
          ),
          vp
            ? h(
                'button',
                {
                  type: 'button',
                  class: 'btn btn-sm',
                  onClick: function () {
                    const bad = Object.keys(links).filter(function (k) {
                      return links[k] && !/^https:\/\/\S+$/.test(links[k]);
                    });
                    if (bad.length) {
                      Hub.toast({ error: true, text: 'Links must start with https://' });
                      return;
                    }
                    if (linkDraft.values.leadId !== (set.lead_vp_id || '')) saveSetting('lead_vp_id', linkDraft.values.leadId, 'Lead VP', linkDraft.seen.lead_vp_id);
                    saveSetting('links', links, 'Links', linkDraft.seen.links);
                    saved('links');
                  },
                },
                'Save'
              )
            : null
        )
      );

      // Accent and giving ladder
      const look = draft('look', ['accent_hex', 'giving_ladder'], function () {
        return {
          accent: set.accent_hex || '#CD1E2F',
          ladder: (set.giving_ladder || []).map(function (step) {
            return { amount: step.amount, text: step.text };
          }),
        };
      });
      const ladder = look.values.ladder;
      Hub.add(page,
        card(
          'Look and giving ladder',
          h(
            'div',
            null,
            Hub.field('Accent colour', h('div', { class: 'hstack' }, h('input', { type: 'color', value: look.values.accent, disabled: !vp || null, onInput: function (e) { look.values.accent = e.target.value; look.dirty = true; } }), h('span', { class: 'muted small' }, 'Light theme only; dark keeps a lighter red for contrast.'))),
            h('div', { class: 'block-label' }, 'Giving ladder'),
            ladder.map(function (step, i) {
              return h(
                'div',
                { class: 'hstack', style: 'margin-bottom:8px' },
                h('input', { class: 'input', type: 'number', min: 0, style: 'max-width:110px', value: step.amount, disabled: !vp || null, 'aria-label': 'Amount ' + (i + 1), onInput: function (e) { step.amount = Number(e.target.value) || 0; look.dirty = true; } }),
                h('input', { class: 'input', value: step.text, disabled: !vp || null, 'aria-label': 'What it pays for ' + (i + 1), onInput: function (e) { step.text = e.target.value; look.dirty = true; } })
              );
            })
          ),
          vp
            ? h(
                'button',
                {
                  type: 'button',
                  class: 'btn btn-sm',
                  onClick: function () {
                    if (look.values.accent.toLowerCase() !== String(set.accent_hex || '').toLowerCase()) saveSetting('accent_hex', look.values.accent.toUpperCase(), 'Accent', look.seen.accent_hex);
                    saveSetting('giving_ladder', ladder, 'Giving ladder', look.seen.giving_ladder);
                    saved('look');
                  },
                },
                'Save'
              )
            : null
        )
      );

      // People and import
      Hub.add(page, 
        card(
          'People',
          h(
            'div',
            null,
            h('p', null, 'The team list is the Members tab of the Sheet. To add someone:'),
            h('ol', { class: 'small', style: 'padding-left:20px' }, h('li', null, 'Add a row with their email, full name, role (coordinator, vp, president or exec) and active = TRUE.'), h('li', null, 'Share the Sheet with that email as Editor.'), h('li', null, 'Send them the link. Access works on their next visit.')),
            h('p', { class: 'small' }, 'To remove someone, set active to FALSE (keep the row: history refers to it) and stop sharing the Sheet.')
          ),
          Hub.sheetUrl() ? h('a', { class: 'btn btn-secondary btn-sm', href: Hub.sheetUrl(), target: '_blank', rel: 'noopener' }, Hub.icon('sheet'), 'Open the Sheet') : null
        ),
        card(
          'Bringing in a list of sponsors',
          h('p', null, 'Paste rows into the Sponsors tab of the Sheet, with at least name, category and stage (and an owner, next action and due date for active stages). The Hub gives each row an id and shows it within a minute. Check the Pipeline for the “Possible duplicates” banner afterwards.')
        )
      );

      // Export
      const actCount = Hub.rows('Activity').length;
      Hub.add(page, 
        card(
          'Export and handover',
          h(
            'div',
            null,
            h('p', { class: 'small' }, 'Activity: ' + Rules.formatNumber(actCount) + ' of 10,000 rows.' + (actCount > 7000 ? ' Time to archive last year’s rows (see HANDOVER.md).' : '')),
            h(
              'div',
              { class: 'hstack wrap' },
              h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onClick: copyJson }, Hub.icon('copy'), 'Copy JSON'),
              h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onClick: copyCsv }, Hub.icon('copy'), 'Copy sponsors as CSV'),
              h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onClick: downloadJson }, 'Download JSON')
            ),
            h('p', { class: 'muted small', style: 'margin-top:8px' }, 'Version ' + Hub.state.version + '. HANDOVER.md in the project explains moving the Hub to next year’s VP.')
          )
        )
      );
      return page;
    }

    /** The set-up still left to do, read from the data (PLAN §10.16). */
    function setupLeft() {
      const today = Hub.today();
      const items = [];
      Hub.rows('Templates').forEach(function (t) {
        if (Rules.isStubTemplate(t)) items.push({ text: 'Template “' + t.name + '” has no text yet.', go: function () { Hub.go('templates'); } });
      });
      Hub.rows('Members').forEach(function (m) {
        if (/^TODO-/i.test(m.email || '')) items.push({ text: m.full_name + ' has a placeholder email and cannot sign in.', sheet: true });
      });
      const leadId = Hub.settings().lead_vp_id;
      if (!leadId) items.push({ text: 'Choose who receives requests from other portfolios (Requests and links below).' });
      else if (!Hub.activeMembers().some(function (m) { return m.id === leadId && m.role === 'vp'; })) {
        items.push({ text: 'The VP chosen to receive requests is no longer an active VP; requests go to the first VP on the list. Choose again below.' });
      }
      Hub.rows('Events').forEach(function (e) {
        if (e.date_confirmed !== true && e.status !== 'done' && e.status !== 'cancelled' && Rules.isIsoDate(e.starts_on) && Rules.daysBetween(today, e.starts_on) <= 60 && e.starts_on >= today) {
          items.push({ text: e.name + ': date not confirmed (' + Rules.shortDate(e.starts_on) + ').', go: function () { Hub.go('events', e.id); } });
        }
      });
      if (!items.length) return null;
      return h(
        'section',
        { class: 'banner warn', style: 'display:block' },
        h('strong', null, 'Set-up left · ' + items.length),
        h(
          'ul',
          { style: 'margin:8px 0 0;padding-left:18px' },
          items.map(function (i) {
            return h(
              'li',
              { style: 'margin:4px 0' },
              i.text,
              ' ',
              i.go ? h('button', { type: 'button', class: 'btn btn-ghost btn-xs', onClick: i.go }, 'Fix') : null,
              i.sheet && Hub.sheetUrl() ? h('a', { class: 'btn btn-ghost btn-xs', href: Hub.sheetUrl(), target: '_blank', rel: 'noopener' }, 'Open the Sheet') : null
            );
          })
        )
      );
    }

    function bundle() {
      const data = {};
      Object.keys(Hub.state.data || {}).forEach(function (tab) {
        data[tab] = Hub.rows(tab).filter(function (r) {
          return !r._local;
        });
      });
      return { exportedAt: Hub.nowIso(), version: Hub.state.version, settings: Hub.settings(), data: data };
    }

    function copyJson() {
      Hub.copyAndTell(JSON.stringify(bundle(), null, 1), 'JSON');
    }

    function csvCell(v) {
      const s = v === null || v === undefined ? '' : String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }

    function copyCsv() {
      const cols = ['Name', 'Category', 'Priority', 'Stage', 'Owner', 'Contact', 'Email', 'Phone', 'Ask', 'Asking for', 'Value', 'Events', 'Last contact', 'Next action', 'Due', 'Past sponsor', 'Summary'];
      const lines = [cols.join(',')];
      Hub.rows('Sponsors').forEach(function (s) {
        lines.push(
          [
            s.name,
            Rules.CATEGORY_LABEL[s.category] || s.category,
            s.priority,
            Rules.STAGE_LABEL[s.stage] || s.stage,
            Hub.memberName(s.owner_id),
            s.contact_name,
            s.contact_email,
            s.contact_phone,
            s.ask_type,
            s.ask_summary,
            s.potential_value_cad,
            Hub.eventsFor(s.id)
              .map(function (e) {
                return e.name;
              })
              .join('; '),
            s.last_contact_at,
            s.next_action,
            s.next_action_due,
            s.is_past_sponsor === true ? 'yes' : '',
            s.summary,
          ]
            .map(csvCell)
            .join(',')
        );
      });
      Hub.copyAndTell(lines.join('\n'), 'CSV');
    }

    function downloadJson() {
      try {
        const blob = new Blob([JSON.stringify(bundle(), null, 1)], { type: 'application/json' });
        const a = h('a', { href: URL.createObjectURL(blob), download: 'phubc-sponsorship-hub-' + Hub.today() + '.json' });
        document.body.append(a);
        a.click();
        a.remove();
      } catch (err) {
        Hub.toast({ error: true, text: 'This browser blocked the download. Use Copy JSON instead.' });
      }
    }

    Hub.views.settings = { title: 'Settings', render: render };
  })();
</script>

    <script>window.HUB_SITE = {"apiUrl":"https://script.google.com/macros/s/AKfycbxWVp-tBoBwPDbjoFuLm84r2mHNrucNpiqji9NMk-pAOl9hzeOivz4U1PswoEdK2r2O/exec","clientId":""};</script>
<script>
/*
 * The website's loader. The Hub's screens were written for Apps Script's own page, where
 * google.script.run reaches the server. On the website the same calls become fetches to the
 * Apps Script web app (src/Web.js), signed with a session the person gets by signing in with
 * Google. This file also draws the sign-in screen.
 *
 * Built into the page by scripts/build-site.js, after the Hub's own scripts; window.HUB_SITE
 * ({apiUrl, clientId}) is put in front of it.
 */
(function () {
  'use strict';
  var CFG = window.HUB_SITE;
  var KEY = 'hubsite.session.v1';

  // ---- The session --------------------------------------------------------------------------

  var session = null; // {token, email, expiresAt}
  try {
    session = JSON.parse(window.localStorage.getItem(KEY) || 'null');
    if (session && (!session.token || Date.parse(session.expiresAt) < Date.now())) session = null;
  } catch (err) {
    session = null;
  }

  function keep(next) {
    session = next;
    try {
      if (next) window.localStorage.setItem(KEY, JSON.stringify(next));
      else window.localStorage.removeItem(KEY);
    } catch (err) {
      // private mode: signed in for this page only
    }
  }

  // ---- Calls --------------------------------------------------------------------------------

  /**
   * One call to the Apps Script web app. Plain text, so the browser sends no preflight request
   * (Apps Script does not answer one).
   * @param {string} fn
   * @param {Array} args
   * @returns {Promise<*>}
   */
  function send(fn, args) {
    return window
      .fetch(CFG.apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: fn, args: args, session: session ? session.token : undefined }),
        redirect: 'follow',
      })
      .then(function (response) {
        return response.text();
      })
      .then(function (text) {
        var out;
        try {
          out = JSON.parse(text);
        } catch (err) {
          // Google answered with a page, not our JSON (a busy moment, or a quota): try again later.
          throw new Error('The Hub could not be reached just now.', { cause: err });
        }
        if (out.session && session) {
          keep({ token: out.session, email: session.email, expiresAt: renewedAt() });
        }
        if (out.error) {
          var failure = new Error(out.error);
          failure.code = out.code;
          if (out.code === 'auth') signedOut(out.error);
          throw failure;
        }
        return out.result;
      });
  }

  /** @returns {string} when a renewed session ends (the server renews for 30 days) */
  function renewedAt() {
    return new Date(Date.now() + 30 * 86400000).toISOString();
  }

  function runner() {
    var ok = function () {};
    var fail = function () {};
    var proxy = new Proxy(
      {},
      {
        get: function (target, name) {
          if (name === 'withSuccessHandler') {
            return function (fn) {
              ok = fn;
              return proxy;
            };
          }
          if (name === 'withFailureHandler') {
            return function (fn) {
              fail = fn;
              return proxy;
            };
          }
          return function () {
            send(String(name), Array.prototype.slice.call(arguments)).then(
              function (result) {
                ok(result);
              },
              function (err) {
                fail(err);
              }
            );
          };
        },
      }
    );
    return proxy;
  }

  // ---- Where the person is (real addresses: ?v=pipeline&id=...) -----------------------------

  var changeHandler = null;

  function params() {
    var out = {};
    new URLSearchParams(window.location.search).forEach(function (value, key) {
      out[key] = value;
    });
    return out;
  }

  function query(p) {
    var q = new URLSearchParams(p || {}).toString();
    return window.location.pathname + (q ? '?' + q : '');
  }

  var script = {
    get run() {
      return runner();
    },
    history: {
      push: function (state, p) {
        window.history.pushState(state, '', query(p));
      },
      replace: function (state, p) {
        window.history.replaceState(state, '', query(p));
      },
      setChangeHandler: function (fn) {
        changeHandler = fn;
      },
    },
    url: {
      getLocation: function (cb) {
        cb({ parameter: params(), hash: '' });
      },
    },
    host: {
      setTitle: function (title) {
        document.title = title;
      },
    },
  };
  // Google's sign-in script also hangs its things on window.google: share it, never replace it.
  window.google = window.google || {};
  window.google.script = script;
  window.addEventListener('popstate', function (e) {
    if (changeHandler) changeHandler({ state: e.state, location: { parameter: params() } });
  });

  // ---- The sign-in screen -------------------------------------------------------------------

  var started = false;
  var screen = null;
  var note = null;
  var buttonBox = null;

  var CSS =
    '#hub-signin{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;' +
    'padding:20px;background:var(--bg,#faf6f5);overflow:auto}' +
    '#hub-signin .card{width:100%;max-width:380px;background:var(--surface,#fff);border:1px solid var(--line,#e8dedc);' +
    'border-radius:var(--radius,12px);padding:28px 24px;text-align:center}' +
    '#hub-signin .mark{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:12px;' +
    'background:var(--accent,#cd1e2f);color:#fff;font-weight:800;font-size:18px;margin-bottom:14px}' +
    '#hub-signin h1{font-size:22px;margin:0 0 4px}' +
    '#hub-signin p{margin:6px 0;color:var(--muted,#6b6162);font-size:14px}' +
    '#hub-signin .signin-note{color:var(--text,#231f20);font-size:14px;margin:14px 0 4px}' +
    '#hub-signin .signin-note.error{color:var(--overdue,#b42318)}' +
    '#hub-signin .signin-button{display:flex;justify-content:center;margin:18px 0 6px;min-height:44px}';

  function drawScreen() {
    if (screen) return;
    var style = document.createElement('style');
    style.textContent = CSS;
    document.head.appendChild(style);
    screen = document.createElement('div');
    screen.id = 'hub-signin';
    screen.setAttribute('role', 'dialog');
    screen.setAttribute('aria-label', 'Sign in');
    screen.innerHTML =
      '<div class="card"><span class="mark" aria-hidden="true">PH</span>' +
      '<h1>Sponsorship Hub</h1><p>Project Hastings @ UBC</p>' +
      '<div class="signin-button" id="hub-signin-button"></div>' +
      '<p class="signin-note" id="hub-signin-note" role="status"></p>' +
      '<p>Sign in with the Google account that is on the Sponsorships team list.</p></div>';
    document.body.appendChild(screen);
    note = screen.querySelector('#hub-signin-note');
    buttonBox = screen.querySelector('#hub-signin-button');
  }

  /** @param {string} text @param {boolean} [bad] */
  function say(text, bad) {
    drawScreen();
    note.textContent = text || '';
    note.className = 'signin-note' + (bad ? ' error' : '');
  }

  function showScreen() {
    drawScreen();
    screen.hidden = false;
    screen.style.display = 'flex';
    var app = document.getElementById('app');
    if (app) app.setAttribute('aria-hidden', 'true');
    loadGoogle();
  }

  function hideScreen() {
    if (!screen) return;
    screen.hidden = true;
    screen.style.display = 'none';
    var app = document.getElementById('app');
    if (app) app.removeAttribute('aria-hidden');
  }

  var loading = null;

  /** Loads Google's sign-in script once and draws its button. */
  function loadGoogle() {
    if (!CFG.clientId) {
      say('Sign-in is not switched on yet. Ask Joseph.', true);
      return;
    }
    if (window.google && window.google.accounts && window.google.accounts.id) {
      drawButton();
      return;
    }
    if (loading) return;
    say('Loading Google sign-in…');
    loading = document.createElement('script');
    loading.src = 'https://accounts.google.com/gsi/client';
    loading.async = true;
    loading.onload = function () {
      // Whatever Google's script did to window.google, the Hub's own part must survive.
      if (!window.google.script) window.google.script = script;
      drawButton();
    };
    loading.onerror = function () {
      loading = null;
      say('Could not load Google sign-in. Check your connection and reload the page.', true);
    };
    document.head.appendChild(loading);
  }

  var initialised = false;

  function drawButton() {
    var id = window.google.accounts.id;
    if (!initialised) {
      initialised = true;
      id.initialize({
        client_id: CFG.clientId,
        callback: onCredential,
        auto_select: true,
        cancel_on_tap_outside: false,
      });
    }
    say('');
    buttonBox.textContent = '';
    id.renderButton(buttonBox, {
      type: 'standard',
      theme: 'filled_blue',
      size: 'large',
      text: 'signin_with',
      shape: 'pill',
      width: 280,
    });
  }

  /** @param {{credential: string}} response what Google hands back after a sign-in */
  function onCredential(response) {
    say('Signing in…');
    send('signIn', [response && response.credential]).then(
      function (result) {
        keep({ token: result.session, email: result.email, expiresAt: result.expiresAt });
        say('');
        hideScreen();
        begin();
      },
      function (err) {
        var text = err && err.message ? err.message : String(err);
        var listed = /not on the Sponsorships team list/.test(text);
        say(
          listed
            ? text.replace(/^Not authorised: /, '').replace(/\.$/, '') +
                ' yet. Ask Joseph to add you, or choose another account.'
            : text.replace(/^Not authorised: /, ''),
          true
        );
      }
    );
  }

  /** The server stopped accepting the session (it ended, or the person was switched off). */
  function signedOut(message) {
    keep(null);
    showScreen();
    say(
      /team list/.test(message)
        ? message.replace(/^Not authorised: /, '')
        : 'Please sign in again.',
      true
    );
  }

  // ---- Starting the Hub ---------------------------------------------------------------------

  function begin() {
    if (started) {
      var loaded = window.Hub.state && window.Hub.state.data;
      // The first load itself was refused: start over with the new session.
      if (!loaded) {
        window.location.reload();
        return;
      }
      // Signed back in after the session ended: send what could not be sent, and catch up.
      if (window.Hub.retryFailed) window.Hub.retryFailed();
      if (window.Hub.poll) window.Hub.poll();
      return;
    }
    started = true;
    window.Hub.signOut = signOut;
    window.Hub.start();
  }

  function signOut() {
    try {
      if (window.google.accounts && window.google.accounts.id)
        window.google.accounts.id.disableAutoSelect();
    } catch (err) {
      // fine
    }
    keep(null);
    window.location.href = window.location.pathname;
  }

  if (session) begin();
  else showScreen();
})();
</script>
