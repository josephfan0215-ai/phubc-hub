                    h('div', { class: 'grow' }, h('div', null, h('strong', null, s ? s.name : ''), ' · ', a.summary), h('div', { class: 'tl-meta' }, Hub.labelOf(Rules.KIND_LABEL, a.kind) + ' · ' + Rules.dayLabel(a.happened_on)))
                  );
                })
              )
            : h('p', { class: 'muted small', style: 'margin-top:8px' }, 'Nothing logged yet this week.')
        )
      );

      // Links
      const links = set.links || {};
      if (links.one_pager_url || links.everything_doc_url) {
        Hub.add(page, 
          h(
            'div',
            { class: 'hstack wrap section' },
            links.one_pager_url ? h('a', { class: 'btn btn-secondary btn-sm', href: links.one_pager_url, target: '_blank', rel: 'noopener' }, Hub.icon('external'), 'One-pager') : null,
            links.everything_doc_url ? h('a', { class: 'btn btn-secondary btn-sm', href: links.everything_doc_url, target: '_blank', rel: 'noopener' }, Hub.icon('external'), 'Everything doc') : null
          )
        );
      }
      return page;
    }

    function eventAlerts(today) {
      const items = Hub.upcomingEvents()
        .filter(function (e) {
          return Rules.daysBetween(today, e.starts_on) <= 60;
        })
        .map(function (e) {
          return { e: e, st: Rules.eventStatus(e, Hub.statusData(), today, Hub.leadVp()) };
        })
        .filter(function (x) {
          return x.st.health === 'red' || x.st.health === 'amber';
        });
      if (!items.length) return null;
      return h(
        'section',
        { class: 'section' },
        Hub.sectionHead('Events that need sponsors', items.length),
        h(
          'ul',
          { class: 'list' },
          items.map(function (x) {
            return h(
              'li',
              { class: 'row clickable', onClick: function () { Hub.go('events', x.e.id); } },
              h('span', { class: 'health-dot ' + x.st.health, 'aria-hidden': 'true' }),
              h(
                'div',
                { class: 'row-main' },
                h('div', { class: 'row-title' }, x.e.name),
                h('div', { class: 'row-sub' }, [x.st.coverage.length ? Rules.coverageLabel(x.st.coverage) : 'No needs logged', asksText(x.e)].filter(Boolean).join(' · '))
              ),
              h('span', { class: 'health ' + x.st.health }, Rules.HEALTH_LABEL[x.st.health])
            );
          })
        )
      );
    }

    function quotaBar(label, value, target, extra) {
      return h(
        'div',
        null,
        h('div', { class: 'hstack', style: 'margin-bottom:4px' }, h('span', { class: 'grow small', style: 'font-weight:600' }, label), h('span', { class: 'small' }, target ? value + ' / ' + target : String(value)), extra ? h('span', { class: 'muted small' }, '· ' + extra) : null),
        Hub.bar(value, target || Math.max(value, 1), target ? value >= target : false)
      );
    }

    function todayList(queue) {
      const groups = { overdue: [], today: [], week: [], later: [] };
      queue.forEach(function (i) {
        groups[i.group].push(i);
      });
      const showLater = Hub.state.ui.myShowLater;
      const lis = [];
      const label = { overdue: 'Overdue', today: 'Today', week: 'This week', later: 'Later' };
      ['overdue', 'today', 'week'].concat(showLater ? ['later'] : []).forEach(function (g) {
        if (!groups[g].length) return;
        lis.push(h('li', { class: 'group-label' + (g === 'overdue' ? ' overdue' : '') }, label[g] + ' · ' + groups[g].length));
        groups[g].forEach(function (item) {
          lis.push(Hub.workRow(item));
        });
      });
      const head = Hub.sectionHead(
        'Today',
        groups.overdue.length + groups.today.length + groups.week.length || null,
        groups.later.length
          ? h(
              'button',
              {
                type: 'button',
                class: 'btn btn-ghost btn-sm',
                onClick: function () {
                  Hub.state.ui.myShowLater = !showLater;
                  Hub.render();
                },
              },
              showLater ? 'Hide later' : 'Later (' + groups.later.length + ')'
            )
          : null
      );
      return h(
        'section',
        { class: 'section' },
        head,
        lis.length
          ? h('ul', { class: 'list' }, lis)
          : h('div', { class: 'card' }, Hub.emptyState('Nothing due. Open the pipeline and give one of your sponsors a next action.', 'Open my sponsors', function () { Hub.setPipelineFilter({ owner: 'me' }); }))
      );
    }

    function addTaskBox() {
      const st = Hub.state.ui.newTask || (Hub.state.ui.newTask = { title: '', due: Rules.addDays(Hub.today(), 1) });
      const input = h('input', {
        class: 'input',
        'data-key': 'new-task',
        placeholder: 'Add a task for yourself…',
        'aria-label': 'New task',
        maxlength: 300,
        value: st.title,
        onInput: function (e) {
          st.title = e.target.value;
        },
        onKeydown: function (e) {
          if (e.key === 'Enter') add();
        },
      });
      function add() {
        const title = (input.value || '').trim();
        if (!title) return;
        Hub.addTask({ title: title, due_on: st.due });
        st.title = '';
        input.value = '';
        Hub.toast({ text: 'Task added for ' + Rules.dayLabel(st.due), ms: 2500 });
      }
      return h(
        'section',
        { class: 'section card card-pad' },
        h('div', { class: 'hstack' }, input, h('button', { type: 'button', class: 'btn btn-secondary', onClick: add }, 'Add')),
        h('div', { style: 'margin-top:8px' }, Hub.dateChips({
          value: st.due,
          chips: Rules.quickDates(Hub.today(), Hub.settings().follow_up_days).filter(function (c) {
            return c.label !== '+' + Hub.settings().follow_up_days + ' d' || Hub.settings().follow_up_days === 7;
          }),
          onPick: function (d) {
            st.due = d;
            st.title = input.value;
            Hub.render(true);
          },
        }))
      );
    }

    Hub.views.my = { title: 'My work', render: render };
  })();
</script>

    <script>
  /*
   * Events (docs/PLAN.md §10.11, §10.12): the exec landing view. Every upcoming event as a row with
   * its health stripe; expanded, one status paragraph that is identical on screen and in Slack
   * (Rules.eventStatus), each need with coverage and who is on it, what is secured, and the
   * attached sponsors. Anyone may ask Sponsorships for something; vps edit events and needs.
   */
  (function () {
    'use strict';
    const Hub = window.Hub;
    const h = Hub.h;

    /** @returns {Object[]} events not done or cancelled and not over, by asks-out date */
    function upcomingEvents() {
      const today = Hub.today();
      return Hub.memoize('upcomingEvents', function () {
        return Hub.rows('Events')
          .filter(function (e) {
            return e.status !== 'done' && e.status !== 'cancelled' && (!Rules.isIsoDate(e.ends_on || e.starts_on) || (e.ends_on || e.starts_on) >= Rules.addDays(today, -1));
          })
          .sort(function (a, b) {
            const ka = (a.asks_due_on || '9999') + (a.starts_on || '');
            const kb = (b.asks_due_on || '9999') + (b.starts_on || '');
            return ka < kb ? -1 : ka > kb ? 1 : 0;
          });
      });
    }

    /** @param {Object} e @returns {string} the asks line, worded for whoever is reading */
    function asksLine(e) {
      const today = Hub.today();
      const since = Rules.daysBetween(e.asks_due_on, today);
      if (since === null) return '';
      if (since > 0) return 'Asks were due ' + Rules.shortDate(e.asks_due_on) + ' (' + Hub.plural(since, 'day') + ' ago)';
      if (since === 0) return 'Asks are due today';
      return (Hub.canEdit() ? 'Asks out by ' : 'Tell Sponsorships by ') + Rules.shortDate(e.asks_due_on);
    }

    /**
     * One event row with its health stripe. Compact rows (Home) open the Events view.
     * @param {Object} e
     * @param {{compact?: boolean, expanded?: boolean}} [opts]
     * @returns {HTMLElement}
     */
    function eventRow(e, opts) {
      const o = opts || {};
      const today = Hub.today();
      const st = Rules.eventStatus(e, Hub.statusData(), today, Hub.leadVp());
      const away = Rules.countdownDays(e.starts_on, today);
      const late = Rules.daysBetween(e.asks_due_on, today) > 0 && st.health === 'red';
      const head = h(
        'button',
        {
          type: 'button',
          class: 'event-head',
          'aria-expanded': o.compact ? null : o.expanded ? 'true' : 'false',
          onClick: function () {
            if (o.compact) Hub.go('events', e.id);
            else Hub.go('events', o.expanded ? '' : e.id, { keepScroll: true });
          },
        },
        h(
          'div',
          { class: 'grow' },
          h('div', { class: 'hstack wrap' }, h('strong', { style: 'font-size:16px' }, e.name), e.date_confirmed === true ? null : h('span', { class: 'chip outline' }, 'date TBC')),
          h(
            'div',
            { class: 'muted small' },
            [
              Rules.isIsoDate(e.starts_on) ? Rules.dayLabel(e.starts_on) : 'No date',
              away === null ? '' : away > 0 ? 'in ' + Hub.plural(away, 'day') : away === 0 ? 'today' : '',
              e.owning_portfolio ? e.owning_portfolio : '',
            ]
              .filter(Boolean)
              .join(' · ')
          ),
          h('div', { class: 'small', style: 'margin-top:4px;font-weight:600' }, st.coverage.length ? Rules.coverageLabel(st.coverage) : 'No needs logged'),
          h('div', { class: 'small', style: late ? 'color:var(--overdue);font-weight:600' : 'color:var(--muted)' }, asksLine(e)),
          Rules.isIsoDate(e.marketing_form_due_on) && e.marketing_form_due_on >= Rules.addDays(Hub.today(), -7) && Hub.canEdit()
            ? h('div', { class: 'small hstack', style: 'gap:4px;color:var(--muted)' }, 'Marketing form by ', Hub.dueText(e.marketing_form_due_on, { long: true }))
            : null
        ),
        h(
          'div',
          { style: 'display:flex;flex-direction:column;align-items:flex-end;gap:6px' },
          h('span', { class: 'health ' + st.health }, Rules.HEALTH_LABEL[st.health]),
          owners(st)
        )
      );
      const row = h('div', { class: 'event-row h-' + st.health, id: 'event-' + e.id }, head);
      if (!o.compact && !o.expanded && (!Rules.isIsoDate(e.starts_on) || e.starts_on >= Hub.today())) {
        row.append(
          h(
            'div',
            { class: 'hstack', style: 'margin-top:8px' },
            h('button', { type: 'button', class: 'btn btn-ghost btn-xs', onClick: function () { openRequest({ eventId: e.id }); } }, Hub.icon('plus', 14), 'Add a request'),
            h('button', { type: 'button', class: 'btn btn-ghost btn-xs', onClick: function () { Hub.copyAndTell(st.text, 'Status'); } }, Hub.icon('copy', 14), 'Copy status')
          )
        );
      }
      if (o.expanded) Hub.add(row, expanded(e, st));
      return row;
    }

    /** @returns {HTMLElement|null} initials of who owns the event's attached sponsors (up to three) */
    function owners(st) {
      const ids = [];
      st.attached.forEach(function (sp) {
        if (sp.owner_id && Rules.phaseOf(sp.stage) !== 'Parked' && ids.indexOf(sp.owner_id) === -1) ids.push(sp.owner_id);
      });
      if (!ids.length) return null;
      return h(
        'div',
        { class: 'hstack', style: 'gap:2px' },
        ids.slice(0, 3).map(function (id) {
          return Hub.avatar(id);
        }),
        ids.length > 3 ? h('span', { class: 'muted small' }, '+' + (ids.length - 3)) : null
      );
    }

    function expanded(e, st) {
      const canEdit = Hub.canEdit();
      const vp = Hub.isVp();
      const box = h('div', { style: 'margin-top:8px' });
      Hub.add(box, 
        h('div', { class: 'status-text', 'aria-label': 'Status' }, st.text),
        h(
          'div',
          { class: 'hstack wrap' },
          h('button', { type: 'button', class: 'btn btn-sm', onClick: function () { Hub.copyAndTell(st.text, 'Status'); } }, Hub.icon('copy'), 'Copy status'),
          // Only an event still to come takes a request (the server refuses one that is over).
          requestable(e) ? h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onClick: function () { openRequest({ eventId: e.id }); } }, Hub.icon('plus'), 'Add a request') : null,
          canEdit ? h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onClick: function () { Hub.openAttach({ eventId: e.id }); } }, Hub.icon('link'), 'Attach sponsor') : null,
          Hub.state.appUrl ? h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onClick: function () { Hub.copyDeepLink('events', e.id); } }, 'Copy link') : null,
          vp ? h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onClick: function () { openEventEditor(e.id); } }, 'Edit event') : null
        )
      );
      // Needs
      const needs = Hub.needsFor(e.id);
      const lead = Hub.leadVp();
      Hub.add(box, h('h3', { style: 'margin:16px 0 4px' }, 'Needs'));
      if (!needs.length) Hub.add(box, h('p', { class: 'muted small' }, 'No needs logged. Anyone can add a request.'));
      needs.forEach(function (n) {
        const c = st.coverage.filter(function (x) {
          return x.need.id === n.id;
        })[0];
        const linked = Hub.linksForEvent(e.id).filter(function (l) {
          return l.event_need_id === n.id;
        });
        let who;
        if (c && c.sponsorIds.length) {
          who = c.sponsorIds
            .map(function (id) {
              const s = Hub.byId('Sponsors', id);
              return s ? s.name + ' (' + (Hub.memberName(s.owner_id) || 'unassigned') + ', ' + Hub.labelOf(Rules.STAGE_LABEL, s.stage) + ')' : '';
            })
            .filter(Boolean)
            .join(', ');
        } else if (linked.length) {
          who =
            'Attached, not in conversation yet: ' +
            linked
              .map(function (l) {
                const s = Hub.byId('Sponsors', l.sponsor_id);
                return s ? s.name + ' (' + Hub.labelOf(Rules.STAGE_LABEL, s.stage) + ')' : '';
              })
              .filter(Boolean)
              .join(', ');
        } else {
          const task = Hub.rows('Tasks').filter(function (t) {
            return t.event_id === e.id && Rules.isOpenTask(t) && t.title.indexOf(n.ask_type) !== -1;
          })[0];
          who = task
            ? 'Picked up by ' + (Hub.memberName(task.owner_id) || 'someone') + (task.due_on ? ', due ' + Rules.shortDate(task.due_on) : '')
            : 'Not picked up yet · ' + (lead ? Rules.firstName(lead.full_name) : 'lead VP');
        }
        const late = Rules.needIsLate(n, e, Hub.settings().ask_lead_days);
        Hub.add(box, 
          h(
            'div',
            { class: 'need-row' + (n.status === 'dropped' ? ' muted' : '') },
            h(
              'div',
              null,
              h('div', { class: 'hstack wrap' }, h('strong', null, n.ask_type), n.status !== 'open' ? h('span', { class: 'chip outline' }, n.status) : null, late ? h('span', { class: 'chip warm' }, 'late request') : null),
              h('div', { class: 'small' }, n.description || ''),
              h('div', { class: 'muted small' }, who),
              n.requested_by ? h('div', { class: 'muted small' }, 'Requested by ' + (Hub.memberName(n.requested_by) || 'someone') + (n.created_at ? ' on ' + Rules.shortDate(Rules.vancouverDate(Date.parse(n.created_at))) : '')) : null
            ),
            h(
              'div',
              { style: 'text-align:right' },
              c ? h('div', { class: 'cov' + (c.covered ? ' covered' : '') }, c.count + '/' + c.target, Hub.bar(c.count, c.target, c.covered)) : null,
              n.due_on && n.due_on !== e.asks_due_on ? h('div', { style: 'margin-top:4px' }, Hub.dueText(n.due_on)) : null,
              vp ? h('button', { type: 'button', class: 'btn btn-ghost btn-xs', style: 'margin-top:4px', onClick: function () { openNeedEditor(n.id, e.id); } }, 'Edit') : null
            )
          )
        );
      });
      if (vp) Hub.add(box, h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onClick: function () { openNeedEditor(null, e.id); } }, Hub.icon('plus'), 'Add a need'));
      // Secured
      const won = st.attached.filter(function (s) {
        return Rules.phaseOf(s.stage) === 'Won';
      });
      if (won.length) {
        Hub.add(box, h('h3', { style: 'margin:16px 0 4px' }, 'Secured'));
        Hub.add(box, 
          h(
            'ul',
            { class: 'list' },
            won.map(function (s) {
              let d = {};
              try {
                d = s.deliverables_json ? JSON.parse(s.deliverables_json) : {};
              } catch (err) {
                d = {};
              }
              const doneCount = Object.keys(d).filter(function (k) {
                return d[k] === true;
              }).length;
              const confirmed = Rules.termsConfirmedNote(Hub.rows('Activity'), s.id);
              const value = s.potential_value_cad !== '' && s.potential_value_cad !== null && Number(s.potential_value_cad) > 0 ? Hub.money(s.potential_value_cad) + (confirmed ? '' : ' est.') : '';
              return Hub.sponsorRow(s, { sub: [s.ask_summary, value, s.stage === 'closed_won' ? doneCount + '/5 deliverables' : ''].filter(Boolean).join(' · ') });
            })
          )
        );
      }
      // Attached sponsors by phase
      const byPhase = {};
      st.attached.forEach(function (s) {
        const p = Rules.phaseOf(s.stage);
        if (p === 'Won') return;
        (byPhase[p] = byPhase[p] || []).push(s);
      });
      ['Conversation', 'Outreach', 'Prospect', 'Parked'].forEach(function (p) {
        if (!byPhase[p]) return;
        Hub.add(box, h('h3', { style: 'margin:16px 0 4px' }, p + ' · ' + byPhase[p].length));
        Hub.add(box, 
          h(
            'ul',
            { class: 'list' },
            byPhase[p].map(function (s) {
              return Hub.sponsorRow(s);
            })
          )
        );
      });
      if (e.notes || e.needs_text) {
        Hub.add(box, h('p', { class: 'muted small', style: 'margin-top:12px' }, [e.needs_text, e.notes].filter(Boolean).join(' · ')));
      }
      return box;
    }

    function render(route) {
      const today = Hub.today();
      const events = upcomingEvents();
      const past = Hub.rows('Events').filter(function (e) {
        return events.indexOf(e) === -1;
      });
      const lead = Hub.leadVp();
      const won = Rules.wonThisTerm(Hub.rows('Sponsors'), Hub.rows('Activity'), today);
      const page = h(
        'div',
        { class: 'page' },
        h(
          'div',
          { class: 'page-head' },
          h('h1', null, 'Events'),
          h('button', { type: 'button', class: 'btn btn-sm', onClick: copyAll }, Hub.icon('copy'), 'Copy all upcoming'),
          h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onClick: function () { openRequest({}); } }, Hub.icon('plus'), 'Ask Sponsorships'),
          Hub.isVp() ? h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onClick: function () { openEventEditor(null); } }, 'New event') : null
        ),
        h(
          'p',
          { class: 'muted small' },
          'Data as of ' + Hub.syncedAtLabel() + ' · Won this term: ' + won.count + (won.sum ? ' (' + Hub.money(won.sum) + ')' : '') + (lead ? ' · Questions: ' + lead.full_name + ' · ' + Rules.SHARED_INBOX : '')
        )
      );
      if (!events.length) Hub.add(page, h('div', { class: 'card' }, Hub.emptyState('No upcoming events.')));
      events.forEach(function (e) {
        Hub.add(page, eventRow(e, { expanded: route.id === e.id }));
      });
      if (past.length) {
        Hub.add(page, 
          h(
            'details',
            { class: 'section' },
            h('summary', { style: 'cursor:pointer;font-weight:600' }, 'Done · ' + past.length),
            h('div', { style: 'margin-top:10px' }, past.map(function (e) { return eventRow(e, { expanded: route.id === e.id }); }))
          )
        );
      }
      return page;
    }

    function copyAll() {
      const today = Hub.today();
      const data = Hub.statusData();
      const statuses = upcomingEvents().map(function (e) {
        return Rules.eventStatus(e, data, today, Hub.leadVp());
      });
      const won = Rules.wonThisTerm(Hub.rows('Sponsors'), Hub.rows('Activity'), today);
      const text = [Rules.statusSummaryLine(statuses.map(function (s) { return s.health; }), won, today)]
        .concat(
          statuses.map(function (s) {
            return s.text;
          })
        )
        .join('\n\n');
      Hub.copyAndTell(text, 'Status for every upcoming event');
    }

    // ---- Add a request (anyone, presidents and exec included) ---------------------------------

    /** @param {Object} e @returns {boolean} true when a request can still be made for it */
    function requestable(e) {
      const today = Hub.today();
      return (
        (!Rules.isIsoDate(e.starts_on) || e.starts_on >= today) &&
        upcomingEvents().some(function (x) {
          return x.id === e.id;
        })
      );
    }

    function openRequest(opts) {
      const today = Hub.today();
      const lead = Hub.settings().ask_lead_days;
      const events = upcomingEvents().filter(requestable);
      const wanted = opts.eventId && events.some(function (e) { return e.id === opts.eventId; }) ? opts.eventId : '';
      const st = { eventId: wanted, askType: '', description: '', qty: 1, due: '', dupOk: false };
      function event() {
        return st.eventId ? Hub.byId('Events', st.eventId) : null;
      }
      function defaultDue() {
        const e = event();
        return e ? e.asks_due_on || Rules.defaultAskDueOn(e.starts_on, lead) || '' : '';
      }
      st.due = defaultDue();
      const api = Hub.openSheet({
        manual: true,
        title: 'Ask Sponsorships for something',
        size: 'tall',
        isDirty: function () {
          return !!st.description.trim();
        },
        render: function (body) {
          const e = event();
          Hub.add(body, 
            Hub.field(
              'For which event',
              h(
                'select',
                {
                  class: 'select',
                  onChange: function (ev) {
                    st.eventId = ev.target.value;
                    st.due = defaultDue();
                    st.dupOk = false;
                    api.refresh();
                  },
                },
                events.map(function (x) {
                  const opt = h('option', { value: x.id }, x.name + (Rules.isIsoDate(x.starts_on) ? ' · ' + Rules.shortDate(x.starts_on) : ''));
                  if (x.id === st.eventId) opt.selected = true;
                  return opt;
                }),
                (function () {
                  const opt = h('option', { value: '' }, 'No event / something else');
                  if (!st.eventId) opt.selected = true;
                  return opt;
                })()
              )
            )
          );
          if (e) {
            Hub.add(body, 
              h(
                'div',
                { class: 'field' },
                h('span', { class: 'label' }, 'What is needed'),
                h(
                  'div',
                  { class: 'suggest-chips' },
                  Rules.ENUMS.ask_type.map(function (a) {
                    const on = st.askType === a;
                    return h(
                      'button',
                      {
                        type: 'button',
                        'aria-pressed': on ? 'true' : 'false',
                        style: on ? 'background:var(--text);color:var(--surface);border-color:var(--text)' : null,
                        onClick: function () {
                          st.askType = a;
                          st.dupOk = false;
                          api.refresh();
                        },
                      },
                      a
                    );
                  })
                )
              )
            );
          }
          Hub.add(body, 
            Hub.field(
              e ? 'In a few words' : 'What do you need from Sponsorships?',
              h('input', {
                class: 'input',
                'data-key': 'req-desc',
                placeholder: '~40 pumpkins, pickup right after Oct 31',
                maxlength: 300,
                value: st.description,
                onInput: function (ev) {
                  st.description = ev.target.value;
                  updateFoot();
                },
              })
            )
          );
          if (e) {
            Hub.add(body, 
              Hub.field(
                'How many sponsors',
                h('div', { class: 'stepper' }, [1, 2, 3, 4, 5].map(function (n) {
                  return h('button', { type: 'button', 'aria-pressed': st.qty === n ? 'true' : 'false', onClick: function () { st.qty = n; api.refresh(); } }, String(n));
                }))
              ),
              Hub.field(
                'Tell Sponsorships by',
                h('input', {
                  type: 'date',
                  class: 'input',
                  value: st.due,
                  onChange: function (ev) {
                    st.due = ev.target.value;
                  },
                })
              )
            );
            if (Rules.isLateRequest(today, e.starts_on, lead)) {
              Hub.add(body, h('div', { class: 'banner warn' }, h('div', { class: 'grow' }, 'This is inside the 3-week window. Sponsorships will try, but late asks usually fail.')));
            }
            const dup = st.askType
              ? Hub.needsFor(e.id).filter(function (n) {
                  return n.ask_type === st.askType && n.status === 'open';
                })[0]
              : null;
            if (dup && !st.dupOk) {
              Hub.add(body, 
                h(
                  'div',
                  { class: 'banner info', style: 'margin-top:10px' },
                  h('div', { class: 'grow' }, 'There is already a ' + dup.ask_type + ' need for this event: ' + (dup.description || '') + '.'),
                  h('button', { type: 'button', class: 'btn btn-secondary btn-xs', onClick: function () { st.dupOk = true; api.refresh(); } }, 'Add anyway')
                )
              );
            }
          }
          Hub.add(body, h('p', { class: 'muted small', style: 'margin-top:12px' }, 'Requested by ' + Hub.state.me.full_name + '. ' + (Hub.leadVp() ? Hub.leadVp().full_name + ' gets a task for it.' : '')));
        },
        foot: function (f) {
          saveBtn = h('button', { type: 'button', class: 'btn btn-primary-wide', onClick: save }, 'Send request');
          Hub.add(f, saveBtn);
          updateFoot();
        },
      });
      let saveBtn = null;
      function problem() {
        const e = event();
        if (!st.description.trim()) return 'Say what is needed.';
        if (e && !st.askType) return 'Pick what is needed.';
        if (e) {
          const dup = Hub.needsFor(e.id).filter(function (n) {
            return n.ask_type === st.askType && n.status === 'open';
          })[0];
          if (dup && !st.dupOk) return 'Check the existing need first.';
        }
        return '';
      }
      function updateFoot() {
        if (saveBtn) saveBtn.disabled = !!problem();
      }
      function save() {
        if (problem()) return;
        const needId = Hub.uuid();
        const input = st.eventId
          ? { id: needId, event_id: st.eventId, ask_type: st.askType, description: st.description.trim(), quantity_target: st.qty, due_on: st.due }
          : { id: needId, description: st.description.trim() };
        api.close('saved');
        const tempNeed = st.eventId
          ? { id: needId, event_id: st.eventId, ask_type: st.askType, description: input.description, quantity_target: st.qty, due_on: st.due, requested_by: Hub.state.me.id, status: 'open', created_at: Hub.nowIso(), updated_at: '' }
          : null;
        Hub.save({
          what: 'the request',
          inserts: tempNeed ? [{ tab: 'EventNeeds', row: tempNeed }] : [],
          send: function () {
            return Hub.call('addRequest', input);
          },
          done: function () {
            Hub.bump();
          },
        });
        Hub.toast({ text: 'Request sent. ' + (Hub.leadVp() ? Rules.firstName(Hub.leadVp().full_name) + ' has a task for it.' : ''), ms: 4000 });
      }
      api.refresh();
      return api;
    }

    // ---- VP editors ---------------------------------------------------------------------

    function openEventEditor(id) {
      const e = id ? Hub.byId('Events', id) : null;
      const lead = Hub.settings().ask_lead_days;
      const v = {
        name: e ? e.name : '',
        event_type: e ? e.event_type : 'fundraiser',
        owning_portfolio: e ? e.owning_portfolio : 'fundraising',
        starts_on: e ? e.starts_on : '',
        ends_on: e ? e.ends_on : '',
        date_confirmed: e ? e.date_confirmed === true : false,
        asks_due_on: e ? e.asks_due_on : '',
        marketing_form_due_on: e ? e.marketing_form_due_on : '',
        status: e ? e.status : 'planned',
        needs_text: e ? e.needs_text : '',
        notes: e ? e.notes : '',
      };
      const touched = {};
      const api = Hub.openSheet({
        title: e ? 'Edit ' + e.name : 'New event',
        size: 'tall',
        render: function (body) {
          const patch = changes();
          const derived = Rules.eventDatePatch(e, patch, lead);
          const preview = [];
          if (derived.asks_due_on !== undefined && patch.asks_due_on === undefined) preview.push('Asks-out moves to ' + Rules.dayLabel(derived.asks_due_on) + '.');
          else if (e && patch.starts_on && derived.asks_due_on === undefined && e.asks_due_on) preview.push('Asks-out stays ' + Rules.dayLabel(e.asks_due_on) + ' (set by hand).');
          if (derived.marketing_form_due_on !== undefined && patch.marketing_form_due_on === undefined) preview.push('Marketing form moves to ' + Rules.dayLabel(derived.marketing_form_due_on) + '.');
          Hub.add(body, 
            Hub.field('Name', input('name')),
            Hub.field('Starts on', input('starts_on', 'date')),
            Hub.field('Ends on', input('ends_on', 'date')),
            h('label', { class: 'hstack', style: 'min-height:44px' }, h('input', { type: 'checkbox', checked: v.date_confirmed, onChange: function (ev) { v.date_confirmed = ev.target.checked; touched.date_confirmed = true; } }), 'Date confirmed'),
            preview.length ? h('div', { class: 'banner info', style: 'margin:6px 0 12px' }, h('div', { class: 'grow' }, preview.join(' '))) : null,
            Hub.field('Asks out by', input('asks_due_on', 'date'), { hint: 'Leave it to follow the start date (' + lead + ' days before), or set it by hand.' }),
            Hub.field('Marketing form by', input('marketing_form_due_on', 'date')),
            Hub.field('Type', select('event_type', Rules.ENUMS.event_type)),
            Hub.field('Owning portfolio', select('owning_portfolio', Rules.ENUMS.owning_portfolio)),
            Hub.field('Status', select('status', Rules.ENUMS.event_status)),
            Hub.field('What they need (free text)', area('needs_text')),
            Hub.field('Notes', area('notes'))
          );
        },
        foot: function (f) {
          Hub.add(f, h('button', { type: 'button', class: 'btn btn-primary-wide', onClick: save }, 'Save'));
        },
      });
      function input(key, type) {
        return h('input', {
          class: 'input',
          type: type || 'text',
          'data-key': 'ev-' + key,
          value: v[key] || '',
          onChange: function (ev) {
            v[key] = ev.target.value;
            touched[key] = true;
            if (key === 'starts_on') api.refresh();
          },
          onInput: function (ev) {
            v[key] = ev.target.value;
            touched[key] = true;
          },
        });
      }
      function select(key, list) {
        return h(
          'select',
          { class: 'select', onChange: function (ev) { v[key] = ev.target.value; touched[key] = true; } },
          list.map(function (x) {
            const opt = h('option', { value: x }, x);
            if (x === v[key]) opt.selected = true;
            return opt;
          })
        );
      }
      function area(key) {
        return h('textarea', { class: 'textarea', 'data-key': 'ev-' + key, value: v[key] || '', onInput: function (ev) { v[key] = ev.target.value; touched[key] = true; } });
      }
      function changes() {
        const out = {};
        Object.keys(touched).forEach(function (k) {
          out[k] = typeof v[k] === 'string' ? v[k].trim() : v[k];
        });
        if (!e) {
          ['name', 'event_type', 'owning_portfolio', 'starts_on', 'status'].forEach(function (k) {
            if (out[k] === undefined) out[k] = v[k];
          });
        }
        return out;
      }
      function save() {
        const patch = changes();
        const problems = Rules.validateEvent(Object.assign({}, e || {}, Rules.eventDatePatch(e, patch, lead)));
        if (problems.length) {
          Hub.toast({ error: true, text: problems[0].message });
          return;
        }
        api.close('saved');
        if (!Object.keys(patch).length) return;
        const newId = e ? '' : Hub.uuid();
        Hub.save({
          what: e ? e.name : patch.name,
          changes: e ? [{ tab: 'Events', id: e.id, patch: Rules.eventDatePatch(e, patch, lead) }] : [],
          inserts: e ? [] : [{ tab: 'Events', row: Object.assign({ id: newId, date_confirmed: false, created_at: Hub.nowIso(), updated_at: '' }, Rules.eventDatePatch(null, patch, lead)) }],
          send: function () {
            if (!e) return Hub.call('saveEvent', null, Object.assign({ id: newId }, patch));
            // e is the event as the editor opened it: a change by someone since is a conflict.
            return Hub.call('saveEvent', e.id, patch, Hub.sendVersion('Events', e.id, e.updated_at || ''));
          },
          conflictTab: 'Events',
        });
      }
      return api;
    }

    function openNeedEditor(id, eventId) {
      const n = id ? Hub.byId('EventNeeds', id) : null;
      const e = Hub.byId('Events', eventId);
      const v = {
        ask_type: n ? n.ask_type : 'cash',
        description: n ? n.description : '',
        quantity_target: n ? n.quantity_target || 1 : 1,
        due_on: n ? n.due_on : e ? e.asks_due_on : '',
        status: n ? n.status : 'open',
      };
      const api = Hub.openSheet({
        title: n ? 'Edit need' : 'Add a need',
        size: 'small',
        render: function (body) {
          Hub.add(body, 
            Hub.field('What', h('select', { class: 'select', onChange: function (ev) { v.ask_type = ev.target.value; } }, Rules.ENUMS.ask_type.map(function (a) {
              const opt = h('option', { value: a }, a);
              if (a === v.ask_type) opt.selected = true;
              return opt;
            }))),
            Hub.field('Description', h('input', { class: 'input', 'data-key': 'need-desc', value: v.description, onInput: function (ev) { v.description = ev.target.value; } })),
            Hub.field('How many sponsors', h('input', { class: 'input', type: 'number', min: 1, value: v.quantity_target, onInput: function (ev) { v.quantity_target = ev.target.value; } })),
            Hub.field('Due', h('input', { class: 'input', type: 'date', value: v.due_on, onChange: function (ev) { v.due_on = ev.target.value; } })),
            Hub.field('Status', h('select', { class: 'select', onChange: function (ev) { v.status = ev.target.value; } }, Rules.ENUMS.need_status.map(function (x) {
              const opt = h('option', { value: x }, x);
              if (x === v.status) opt.selected = true;
              return opt;
            })))
          );
        },
        foot: function (f) {
          Hub.add(f, h('button', { type: 'button', class: 'btn btn-primary-wide', onClick: save }, 'Save'));
        },
      });
      function save() {
        const patch = { ask_type: v.ask_type, description: String(v.description).trim(), quantity_target: Number(v.quantity_target) || 1, due_on: v.due_on, status: v.status };
        const problems = Rules.validateNeed(Object.assign({ event_id: eventId }, patch));
        if (problems.length) {
          Hub.toast({ error: true, text: problems[0].message });
          return;
        }
        api.close('saved');
        const newId = n ? '' : Hub.uuid();
        Hub.save({
          what: 'the need',
          changes: n ? [{ tab: 'EventNeeds', id: n.id, patch: patch }] : [],
          inserts: n ? [] : [{ tab: 'EventNeeds', row: Object.assign({ id: newId, event_id: eventId, requested_by: '', created_at: Hub.nowIso(), updated_at: '' }, patch) }],
          send: function () {
            if (!n) return Hub.call('saveNeed', null, Object.assign({ id: newId, event_id: eventId }, patch));
            return Hub.call('saveNeed', n.id, patch, Hub.sendVersion('EventNeeds', n.id, n.updated_at || ''));
          },
          conflictTab: 'EventNeeds',
        });
      }
      return api;
    }

    Hub.views.events = {
      title: 'Events',
      render: render,
      after: function (route) {
        if (!route.id) return;
        const el = document.getElementById('event-' + route.id);
        if (el && Hub.state.ui.lastExpanded !== route.id) {
          Hub.state.ui.lastExpanded = route.id;
          el.scrollIntoView({ block: 'start' });
          window.scrollBy(0, -60);
        }
      },
    };
    Object.assign(Hub, {
      upcomingEvents: upcomingEvents,
      eventRow: eventRow,
      openRequest: openRequest,
      openEventEditor: openEventEditor,
      openNeedEditor: openNeedEditor,
    });
  })();
</script>

    <script>
  /*
   * Team (docs/PLAN.md §10.13): the week's scoreboard in roster order (never ranked, never red),
   * when each person last logged anything, the warm split, pipeline movement, the sponsors going
   * quiet behind a far-off date, and the saved meetings.
   */
  (function () {
    'use strict';
    const Hub = window.Hub;
    const h = Hub.h;

    function render() {
      const today = Hub.today();
      const weekDate = Hub.state.ui.teamWeek || Rules.reportWeekDate(today, Hub.settings().meeting);
      const week = Rules.weekRange(weekDate);
      const set = Hub.settings();
      const sponsors = Hub.rows('Sponsors');
      const acts = Hub.rows('Activity');
      const people = Hub.activeMembers().filter(function (m) {
        return Rules.roleAtLeast(m.role, 'coordinator');
      });
      const board = Rules.scoreboard(people, acts, weekDate, set.quotas, Hub.warmIds());
      const moves = Rules.pipelineMovement(acts, week.start, week.end);
      const quiet = Rules.staleSponsors(sponsors, today, 10);
      const meetings = Hub.rows('Meetings').slice().sort(function (a, b) {
        return (b.held_on || '') < (a.held_on || '') ? -1 : 1;
      });

      const page = h(
        'div',
        { class: 'page' },
        h(
          'div',
          { class: 'page-head' },
          h('h1', null, 'Team'),
          Hub.isVp() ? h('button', { type: 'button', class: 'btn btn-sm', onClick: function () { Hub.go('meeting'); } }, Hub.icon('play'), 'Start meeting mode') : null
        )
      );

      // Week picker
      Hub.add(page, 
        h(
          'div',
          { class: 'hstack', style: 'margin-bottom:10px' },
          h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Previous week', onClick: function () { Hub.state.ui.teamWeek = Rules.addDays(week.start, -7); Hub.render(); } }, Hub.icon('back')),
          h('strong', null, Rules.shortDate(week.start) + ' – ' + Rules.shortDate(week.end)),
          h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Next week', disabled: week.end >= today ? true : null, onClick: function () { Hub.state.ui.teamWeek = Rules.addDays(week.start, 7); Hub.render(); } }, Hub.icon('next')),
          week.end < today ? h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onClick: function () { Hub.state.ui.teamWeek = today; Hub.render(); } }, 'This week') : null,
          set.quotas.busy_week === true ? h('span', { class: 'chip warm' }, 'busy week') : null
        )
      );
      Hub.add(page, scoreboardTable(board, acts, sponsors));
      Hub.add(page, h('p', { class: 'muted small', style: 'margin-top:8px' }, 'Remote = email, call and follow-up. Walk-ins = walk-in. Rows are in roster order; nobody is ranked.'));

      // Pipeline movement
      Hub.add(page, 
        h(
          'section',
          { class: 'section' },
          Hub.sectionHead('Pipeline movement'),
          h(
            'div',
            { class: 'tiles' },
            tile(moves.outreach, 'Entered Outreach'),
            tile(moves.conversation, 'Entered Conversation'),
            tile(moves.won, 'Won'),
            tile(moves.lost, 'Lost')
          )
        )
      );

      // Going quiet
      Hub.add(page, 
        Hub.listSection(
          'Going quiet',
          quiet.slice(0, 20).map(function (s) {
            const last = s.last_contact_at || String(s.created_at).slice(0, 10);
            return Hub.sponsorRow(s, { sub: 'Last touch ' + (Rules.isIsoDate(last) ? Rules.shortDate(last) : 'never') + (s.next_action ? ' · next: ' + s.next_action : '') });
          }),
          { count: quiet.length || null, empty: 'Every sponsor in outreach or conversation was touched in the last 10 days.' }
        )
      );

      // Meetings
      Hub.add(page, 
        h(
          'section',
          { class: 'section' },
          Hub.sectionHead('Meetings', meetings.length || null),
          meetings.length
            ? h(
                'ul',
                { class: 'list' },
                meetings.map(function (m) {
                  const tasks = Hub.rows('Tasks').filter(function (t) {
                    return t.meeting_id === m.id;
                  });
                  const done = tasks.filter(function (t) {
                    return t.status === 'done';
                  }).length;
                  return h(
                    'li',
                    { class: 'row clickable', onClick: function () { openMeeting(m); } },
                    h('div', { class: 'row-main' }, h('div', { class: 'row-title' }, Rules.dayLabel(m.held_on)), h('div', { class: 'row-sub' }, (m.win_of_week || 'No win written down') + ' · ' + done + '/' + tasks.length + ' actions done'))
                  );
                })
              )
            : h('div', { class: 'card' }, Hub.emptyState('No meetings saved yet.' + (Hub.isVp() ? ' Start meeting mode on Monday.' : '')))
        )
      );
      return page;
    }

    function tile(n, label) {
      return h('div', { class: 'tile' }, h('span', { class: 'num' }, String(n)), h('span', { class: 'what' }, label));
    }

    function scoreboardTable(board, acts, sponsors) {
      const today = Hub.today();
      const rows = board.rows.map(function (r) {
        const last = Rules.lastLoggedOn(acts, r.member_id);
        const stale = !last || Rules.daysBetween(last, today) > 7;
        const under = r.quota && (!r.remoteMet || !r.walkinsMet);
        return h(
          'tr',
          { style: under ? 'background:var(--surface-2)' : null },
          h('td', null, h('span', { style: 'font-weight:600' }, r.full_name), under ? h('span', { class: 'muted small' }, ' · under') : null),
          h('td', null, r.counts.remote + (r.quota ? ' / ' + r.quota.remote : ''), r.counts.remoteWarm ? h('span', { class: 'muted small' }, ' (' + r.counts.remoteWarm + ' warm)') : null),
          h('td', null, r.counts.walkins + (r.quota ? ' / ' + r.quota.walkins : '')),
          h('td', null, String(r.counts.replies)),
          h('td', { class: 'col-mid' }, String(r.counts.meetings)),
          h('td', { class: 'col-mid' }, String(r.counts.commitments)),
          h('td', { class: 'col-mid' }, String(Rules.activeSponsorCount(sponsors, r.member_id))),
          h('td', { class: stale ? 'muted' : '' }, last ? Rules.shortDate(last) : '—')
        );
      });
      const t = board.total;
      rows.push(
        h(
          'tr',
          { style: 'font-weight:700' },
          h('td', null, 'Team'),
          h('td', null, t.counts.remote + (t.quota ? ' / ' + t.quota.remote : ''), t.counts.remoteWarm ? h('span', { class: 'muted small' }, ' (' + t.counts.remoteWarm + ' warm)') : null),
          h('td', null, t.counts.walkins + (t.quota ? ' / ' + t.quota.walkins : '')),
          h('td', null, String(t.counts.replies)),
          h('td', { class: 'col-mid' }, String(t.counts.meetings)),
          h('td', { class: 'col-mid' }, String(t.counts.commitments)),
          h('td', { class: 'col-mid' }, ''),
          h('td', null, '')
        )
      );
      return h(
        'div',
        { class: 'table-wrap scoreboard' },
        h(
          'table',
          { class: 'table', style: 'table-layout:auto' },
          h(
            'thead',
            null,
            h(
              'tr',
              null,
              h('th', null, 'Member'),
              h('th', null, 'Remote'),
              h('th', null, 'Walk-ins'),
              h('th', null, 'Replies'),
              h('th', { class: 'col-mid' }, 'Meetings'),
              h('th', { class: 'col-mid' }, 'Commitments'),
              h('th', { class: 'col-mid' }, 'Active sponsors'),
              h('th', null, 'Last logged')
            )
          ),
          h('tbody', null, rows)
        )
      );
    }

    /** A saved meeting, read-only, with its Slack text to copy again. */
    function openMeeting(m) {
      let agenda = {};
      try {
        agenda = m.agenda_json ? JSON.parse(m.agenda_json) : {};
      } catch (err) {
        agenda = {};
      }
      const tasks = Hub.rows('Tasks').filter(function (t) {
        return t.meeting_id === m.id;
      });
      Hub.openSheet({
        title: 'Meeting · ' + Rules.dayLabel(m.held_on),
        size: 'tall',

   * Save. "Copy for Slack" writes the summary. The draft survives a reload.

        Hub.state.ui.meetingDraft =
          saved && saved.date === today
            ? saved
            : {
                id: Hub.uuid(),
                date: today,
                startedAt: Hub.now(),
                attendees: Hub.activeMembers()
                  .filter(function (m) {

                skill: '',

                actions: [],
                copied: false,

      return Hub.state.ui.meetingDraft;
    }

    function keep() {
      Hub.setPref(DRAFT, Hub.state.ui.meetingDraft);
    }

    function newAction(extra) {
      return Object.assign({ key: Hub.uuid(), title: '', owner_id: '', due_on: Rules.nextMeetingDate(Hub.today(), Hub.settings().meeting), event_id: '', sponsor_id: '' }, extra || {});
    }

    /** @returns {string} the first day the wins window covers: the day after the last saved meeting, else a week ago */
    function winsSince() {
      const today = Hub.today();
      const last = Hub.rows('Meetings')
        .map(function (m) {
          return m.held_on;
        })
        .filter(function (d) {
          return Rules.isIsoDate(d) && d < today;
        })
        .sort()
        .pop();
      return last ? Rules.addDays(last, 1) : Rules.addDays(today, -7);
    }

    function clockText(d) {
      const mins = Math.floor((Hub.now() - d.startedAt) / 60000);
      const secs = Math.floor(((Hub.now() - d.startedAt) % 60000) / 1000);
      let left = mins;
      let section = Rules.MEETING_SECTIONS[Rules.MEETING_SECTIONS.length - 1];
      for (let i = 0; i < Rules.MEETING_SECTIONS.length; i++) {
        if (left < Rules.MEETING_SECTIONS[i].minutes) {
          section = Rules.MEETING_SECTIONS[i];
          break;
        }
        left -= Rules.MEETING_SECTIONS[i].minutes;
      }
      const total = Hub.settings().meeting.length_min || 30;
      return { text: mins + ':' + String(secs).padStart(2, '0') + ' / ' + total + ':00', over: mins >= total, section: section.title };
    }

    function render() {
      const vp = Hub.isVp();

      Hub.add(page, 
        h(
          'div',
          { class: 'meeting-bar' },
          h('strong', { class: 'grow' }, 'Meeting · ' + Rules.dayLabel(d.date)),
          h('span', { id: 'meeting-clock', class: 'clock' + (clock.over ? ' over' : ''), 'aria-live': 'off' }, clock.text),
          h('span', { id: 'meeting-section', class: 'muted small' }, clock.section),
          vp ? h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onClick: copySlack }, Hub.icon('copy'), 'Copy for Slack') : h('span', { class: 'chip outline' }, 'Following along: a VP runs the meeting'),
          vp ? h('button', { type: 'button', class: 'btn btn-sm', onClick: saveMeeting }, 'Save meeting') : null,
          h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onClick: function () { Hub.go('team'); } }, 'Exit')
        )
      );
      const body = h('div', { class: 'page', style: 'max-width:980px' });
      Hub.add(page, body);

      // Attendees
      Hub.add(body, 
        h(
          'div',
          { class: 'chips-row', role: 'group', 'aria-label': 'Attendees' },

              'button',
              {

        section('win', [
          wins.length
            ? h(
                'ul',
                { class: 'list', style: 'margin-bottom:10px' },
                wins.slice(0, 8).map(function (a) {

                  return h('li', { class: 'row' }, h('span', { class: 'grow' }, text), vp ? h('button', { type: 'button', class: 'btn btn-ghost btn-xs', onClick: function () { d.win = text.replace(/ \(\w{3} \d+\)$/, ''); keep(); Hub.render(true); } }, 'Use') : null);
                })
              )
            : h('p', { class: 'muted' }, 'No replies, meetings or wins logged since the last meeting.'),
          vp ? h('textarea', { class: 'textarea one-line', 'data-key': 'm-win', placeholder: 'The win we share', value: d.win, onInput: function (e) { d.win = e.target.value; keep(); } }) : null,
        ])
      );

      // 2. Scoreboard
      const people = Hub.activeMembers().filter(function (m) {
        return Rules.roleAtLeast(m.role, 'coordinator');
      });
      // On a Monday meeting the board shows the week that just ended (Rules.reportWeekDate).
      const board = Rules.scoreboard(people, Hub.rows('Activity'), Rules.reportWeekDate(today, set.meeting), set.quotas, Hub.warmIds());
      Hub.add(body, 
        section('scoreboard', [
          h(
            'ul',
            { class: 'list' },
            board.rows.map(function (r) {
              const under = r.quota && (!r.remoteMet || !r.walkinsMet);
              return h(
                'li',
                { class: 'row', style: under ? 'background:var(--surface-2)' : null },
                h('span', { class: 'grow', style: 'font-weight:600' }, r.full_name, under ? h('span', { class: 'muted small', style: 'font-weight:500' }, ' · under') : null),
                h('span', null, 'remote ' + r.counts.remote + (r.quota ? '/' + r.quota.remote : '') + ' · walk-ins ' + r.counts.walkins + (r.quota ? '/' + r.quota.walkins : '') + ' · replies ' + r.counts.replies)
              );
            }),
            h('li', { class: 'row', style: 'font-weight:700' }, h('span', { class: 'grow' }, 'Team'), h('span', null, 'remote ' + board.total.counts.remote + ' · walk-ins ' + board.total.counts.walkins + ' · replies ' + board.total.counts.replies))
          ),
        ])
      );

      // 3. Hot leads and deadlines
      const hot = Rules.hotLeads(Hub.rows('Sponsors'), Hub.rows('Activity'), today);
      const deadlineEvents = Hub.upcomingEvents().filter(function (e) {
        const st = Rules.eventStatus(e, Hub.statusData(), today, Hub.leadVp());
        return st.health !== 'green' && st.health !== 'grey' && Rules.isIsoDate(e.asks_due_on) && e.asks_due_on <= Rules.addDays(today, 21);
      });
      const overdue = Rules.needsAttention({ sponsors: Hub.rows('Sponsors'), tasks: Hub.rows('Tasks'), events: Hub.rows('Events') }, today);
      const byOwner = Rules.countByOwner(overdue, Hub.rows('Members'));
      Hub.add(body, 
        section('leads', [
          hot.length
            ? h(
                'ul',
                { class: 'list' },
                hot.map(function (x) {
                  const s = x.sponsor;
                  return h(
                    'li',
                    { class: 'row' },
                    Hub.avatar(s.owner_id),
                    h(
                      'div',
                      { class: 'row-main' },
                      h('div', { class: 'row-title' }, s.name),
                      h('div', { class: 'row-meta' }, Hub.stageChip(s.stage, Hub.canEdit() ? function () { Hub.openStage(s.id); } : null), Hub.dueText(s.next_action_due), h('span', { class: 'row-sub' }, s.next_action || '')),
                      x.last || s.last_contact_at
                        ? h('div', { class: 'row-sub' }, 'Last touch: ' + (x.last ? Hub.labelOf(Rules.KIND_LABEL, x.last.kind) + ' ' + Rules.shortDate(x.last.happened_on) + (x.last.summary ? ' · ' + x.last.summary : '') : Rules.shortDate(s.last_contact_at)))
                        : null
                    ),
                    Hub.canEdit() ? h('div', { class: 'row-actions' }, Hub.rowButton('Next', function () { Hub.editNext(s.id); }, 'Change the next action'), Hub.rowButton('Later', function () { Hub.laterSponsor(s.id); }, 'Reschedule', true)) : null
                  );
                })
              )
            : h('p', { class: 'muted' }, 'No hot leads this week.'),
          h('h3', { style: 'margin:18px 0 6px' }, 'Deadlines'),
          deadlineEvents.length
            ? deadlineEvents.map(function (e) {
                return h('div', { class: 'status-text' }, Rules.eventStatusText(e, Hub.statusData(), today, Hub.leadVp()));
              })

          overdue.length
            ? h(
                'div',
                null,
                h('h3', { style: 'margin:18px 0 6px' }, 'Overdue, by owner'),

                })
              )
            : null,
        ])
      );

      // 4. Skill drop
      const saved = Hub.rows('Meetings').length;
      const suggestion = Rules.SKILL_DROPS[(saved + d.skillShift) % Rules.SKILL_DROPS.length];
      Hub.add(body, 
        section('skill', [
          h('div', { class: 'hstack wrap', style: 'margin-bottom:8px' }, h('span', null, 'Suggestion: ', h('strong', null, suggestion)), vp ? h('button', { type: 'button', class: 'btn btn-ghost btn-xs', onClick: function () { d.skillShift++; keep(); Hub.render(true); } }, 'Another') : null, vp ? h('button', { type: 'button', class: 'btn btn-ghost btn-xs', onClick: function () { d.skill = suggestion; keep(); Hub.render(true); } }, 'Use it') : null),
          vp ? h('textarea', { class: 'textarea one-line', 'data-key': 'm-skill', placeholder: 'What we practised', value: d.skill, onInput: function (e) { d.skill = e.target.value; keep(); } }) : null,
        ])
      );

      // 5. Assignments
      const unassignedA = Rules.unassignedPriorityA(Hub.rows('Sponsors'));
      const openNeeds = [];
      Hub.upcomingEvents().forEach(function (e) {
        Rules.needCoverage(Hub.needsFor(e.id), Hub.linksForEvent(e.id), Hub.rows('Sponsors')).forEach(function (c) {
          if (c.need.status === 'open' && c.count === 0) openNeeds.push({ event: e, coverage: c });
        });
      });
      const light = people.filter(function (m) {
        return m.role === 'coordinator' && Rules.activeSponsorCount(Hub.rows('Sponsors'), m.id) < 10;
      });
      Hub.add(body, 
        section('assign', [
          h('h3', { style: 'margin:0 0 6px' }, 'Priority-A sponsors with no owner · ' + unassignedA.length),
          unassignedA.length
            ? h(
                'ul',
                { class: 'list' },
                unassignedA.map(function (s) {
                  return h(
                    'li',
                    { class: 'row' },
                    h('div', { class: 'row-main' }, h('div', { class: 'hstack' }, h('span', { class: 'row-title' }, s.name), Rules.isWarm(s) ? h('span', { class: 'chip warm' }, 'warm') : null), h('div', { class: 'row-sub' }, Hub.labelOf(Rules.CATEGORY_LABEL, s.category) + (s.ask_type ? ' · ' + s.ask_type : ''))),
                    Hub.canEdit() ? h('div', { class: 'row-actions' }, Hub.rowButton('Assign', function () { Hub.openOwner(s.id); }, 'Assign an owner to ' + s.name)) : null
                  );
                })
              )
            : h('p', { class: 'muted' }, 'Every priority-A sponsor has an owner.'),
          h('h3', { style: 'margin:18px 0 6px' }, 'Needs with no sponsor · ' + openNeeds.length),
          openNeeds.length
            ? h(
                'ul',
                { class: 'list' },
                openNeeds.map(function (x) {
                  const title = 'Find a ' + x.coverage.need.ask_type + ' sponsor for ' + Hub.shortEventName(x.event.name);
                  const added = d.actions.some(function (a) {
                    return a.title === title;
                  });
                  return h(
                    'li',
                    { class: 'row' },
                    h('div', { class: 'row-main' }, h('div', { class: 'row-title' }, Hub.shortEventName(x.event.name) + ' · ' + x.coverage.need.ask_type + ' 0/' + x.coverage.target), h('div', { class: 'row-sub' }, (x.coverage.need.description || '') + (x.coverage.need.requested_by ? ' · requested by ' + Rules.firstName(Hub.memberName(x.coverage.need.requested_by)) : ''))),
                    vp ? h('div', { class: 'row-actions' }, added ? h('span', { class: 'chip phase-won' }, 'in actions') : Hub.rowButton('Add action', function () { d.actions.push(newAction({ title: title, event_id: x.event.id })); keep(); Hub.render(true); })) : null
                  );
                })
              )
