   * @returns {string} the timeline line that records what a VP confirmed
   */
  function termsConfirmedSummary(sponsor, vpName) {
    const value = text(sponsor.potential_value_cad);
    return (
      'Terms confirmed with ' +
      (text(vpName) || 'a VP') +
      ': ' +
      (text(sponsor.ask_summary) || 'no summary') +
      (value !== '' ? ' ($' + formatNumber(value) + ')' : '')
    );
  }

  // ---------------------------------------------------------------------------
  // Fit score and suggested priority (spec §6.4)
  // ---------------------------------------------------------------------------

  const FIT_FIELDS = deepFreeze([
    'fit_strategic',
    'fit_likelihood',
    'fit_value',
    'fit_access',
    'fit_connection',
    'fit_timing',
  ]);

  /**
   * @param {Object} sponsor
   * @returns {number} the six fit fields added up, 0 to 30 (blank counts as 0)
   */
  function fitScore(sponsor) {
    return FIT_FIELDS.reduce(function (sum, field) {
      const n = Number(sponsor[field]);
      return sum + (isFinite(n) ? Math.min(5, Math.max(0, n)) : 0);
    }, 0);
  }

  /**
   * A suggestion shown beside the priority select; never written without a person choosing it.
   * Working with the Downtown Eastside or food security adds 2 to the score used for the suggestion.
   * @param {Object} sponsor
   * @returns {{score: number, adjusted: number, priority: 'A'|'B'|'C'}} A at 22 or more, B at 15 to 21, else C
   */
  function suggestPriority(sponsor) {
    const score = fitScore(sponsor);
    const adjusted = score + (isTrue(sponsor.supports_dtes) ? 2 : 0);
    return {
      score: score,
      adjusted: adjusted,
      priority: adjusted >= 22 ? 'A' : adjusted >= 15 ? 'B' : 'C',
    };
  }

  // ---------------------------------------------------------------------------
  // Events: deadlines, coverage, health (spec §6.5)
  // ---------------------------------------------------------------------------

  /**
   * @param {string} startsOn
   * @param {number} [leadDays] 21 when omitted
   * @returns {string|null} the "asks out by" date (and the marketing form date): leadDays before the event
   */
  function defaultAskDueOn(startsOn, leadDays) {
    return addDays(
      startsOn,
      -(leadDays === undefined || leadDays === null ? DEFAULT_SETTINGS.ask_lead_days : leadDays)
    );
  }

  /**
   * @param {Object} need
   * @returns {number} how many sponsors the need wants (1 when not set)
   */
  function needTarget(need) {
    const n = Number(need.quantity_target);
    return n > 0 ? n : 1;
  }

  /**
   * @param {Object} sponsor
   * @returns {boolean} true when the sponsor is live: in Conversation or Won, and not archived
   */
  function isLiveSponsor(sponsor) {
    const phase = phaseOf(sponsor.stage);
    return !isTrue(sponsor.archived) && (phase === 'Conversation' || phase === 'Won');
  }

  /**
   * How well each need of one event is covered. A sponsor counts toward a need when it is linked
   * to that need, or when the need has no linked sponsor at all and the sponsor is attached to
   * the event with a matching ask type. Only live sponsors count. Dropped needs are left out.
   * @param {Object[]} needs the event's EventNeeds rows
   * @param {Object[]} links the event's SponsorEvents rows
   * @param {Object[]} sponsors Sponsors rows (at least those linked)
   * @returns {Array<{need: Object, target: number, count: number, covered: boolean, sponsorIds: string[]}>}
   */
  function needCoverage(needs, links, sponsors) {
    const byId = {};
    sponsors.forEach(function (s) {
      byId[s.id] = s;
    });
    return needs
      .filter(function (need) {
        return need.status !== 'dropped';
      })
      .map(function (need) {
        const linked = links.filter(function (l) {
          return l.event_need_id === need.id;
        });
        const candidates = linked.length
          ? linked.map(function (l) {
              return l.sponsor_id;
            })
          : links
              .filter(function (l) {
                return (
                  !l.event_need_id &&
                  byId[l.sponsor_id] &&
                  byId[l.sponsor_id].ask_type === need.ask_type
                );
              })
              .map(function (l) {
                return l.sponsor_id;
              });
        const ids = unique(candidates).filter(function (id) {
          return byId[id] && isLiveSponsor(byId[id]);
        });
        const target = needTarget(need);
        return {
          need: need,
          target: target,
          count: ids.length,
          covered: need.status === 'covered' || ids.length >= target,
          sponsorIds: ids,
        };
      });
  }

  /**
   * Green: every open need has enough live sponsors. Red: an uncovered need is past its date.
   * Amber: an uncovered need's date is within 7 days. Grey: the event is done or cancelled, or
   * has no needs. "Open" (shown as "Not due yet"): uncovered, but not due for more than a week.
   * Each need is judged by its own due date when it has one, else the event's asks-out date, so a
   * late request with a realistic date does not turn an event red by itself (PLAN A12).
   * @param {Object} event
   * @param {ReturnType<typeof needCoverage>} coverage
   * @param {string} today
   * @returns {'green'|'amber'|'red'|'grey'|'open'}
   */
  function eventHealth(event, coverage, today) {
    if (event.status === 'done' || event.status === 'cancelled') return 'grey';
    if (!coverage.length) return 'grey';
    const uncovered = coverage.filter(function (c) {
      return !c.covered;
    });
    if (!uncovered.length) return 'green';
    let health = 'open';
    if (!isIsoDate(today)) return health;
    uncovered.forEach(function (c) {
      const due = isIsoDate(text(c.need.due_on)) ? c.need.due_on : event.asks_due_on;
      if (!isIsoDate(due)) return;
      if (due < today) health = 'red';
      else if (due <= addDays(today, 7) && health !== 'red') health = 'amber';
    });
    return health;
  }

  /** What each health state is called on screen and in copied status text. */
  const HEALTH_LABEL = deepFreeze({
    green: 'On track',
    amber: 'Due soon',
    red: 'Behind',
    open: 'Not due yet',
    grey: 'No open needs',
  });

  /**
   * @param {ReturnType<typeof needCoverage>} coverage
   * @returns {string} e.g. "cash 0/2 · food 1/2"
   */
  function coverageLabel(coverage) {
    return coverage
      .map(function (c) {
        return c.need.ask_type + ' ' + c.count + '/' + c.target;
      })
      .join(' · ');
  }

  /**
   * @param {string} startsOn
   * @param {string} today
   * @returns {number|null} days until the event (negative once it has started)
   */
  function countdownDays(startsOn, today) {
    return daysBetween(today, startsOn);
  }

  // ---------------------------------------------------------------------------
  // Scoreboard (spec §6.7): counts per person per week. Never ranks anyone.
  // ---------------------------------------------------------------------------

  /**
   * @param {Object[]} activities
   * @param {string} memberId
   * @param {string} start first day of the range
   * @param {string} end last day of the range
   * @param {Object<string, boolean>} [warmIds] warm sponsor ids; when given, `remoteWarm` counts
   *   the remote touches to them
   * @returns {{remote: number, walkins: number, replies: number, meetings: number, commitments: number, remoteWarm?: number}}
   *   remote = email + call + follow_up
   */
  function weekCounts(activities, memberId, start, end, warmIds) {
    const out = { remote: 0, walkins: 0, replies: 0, meetings: 0, commitments: 0 };
    if (warmIds) out.remoteWarm = 0;
    activities.forEach(function (a) {
      if (a.member_id !== memberId || !isInRange(a.happened_on, start, end)) return;
      if (REMOTE_KINDS.indexOf(a.kind) !== -1) {
        out.remote++;
        if (warmIds && warmIds[a.sponsor_id]) out.remoteWarm++;
      } else if (a.kind === 'walk_in') out.walkins++;
      else if (a.kind === 'reply') out.replies++;
      else if (a.kind === 'meeting') out.meetings++;
      else if (a.kind === 'commitment') out.commitments++;
    });
    return out;
  }

  /**
   * Weekly targets apply to coordinators. In a busy week (before Impact Sprint) the remote
   * target is `busy_remote` instead of `remote_min`.
   * @param {Object} member
   * @param {Object} [quotas] the quotas setting
   * @returns {{remote: number, walkins: number}|null} null for people without a target
   */
  function quotaFor(member, quotas) {
    if (!member || member.role !== 'coordinator') return null;
    const q = Object.assign({}, DEFAULT_SETTINGS.quotas, quotas || {});
    return { remote: isTrue(q.busy_week) ? q.busy_remote : q.remote_min, walkins: q.walkins_min };
  }

  /**
   * One row per active member in the order given (roster order, never sorted by results),
   * plus a team total.
   * @param {Object[]} members
   * @param {Object[]} activities
   * @param {string} weekDate any date in the week to show
   * @param {Object} [quotas]
   * @param {Object<string, boolean>} [warmIds] see weekCounts
   * @returns {{week: {start: string, end: string}, rows: Object[], total: {counts: Object, quota: Object|null}}|null}
   */
  function scoreboard(members, activities, weekDate, quotas, warmIds) {
    const week = weekRange(weekDate);
    if (!week) return null;
    const rows = members
      .filter(function (m) {
        return m.active !== false && String(m.active).toUpperCase() !== 'FALSE';
      })
      .map(function (m) {
        const counts = weekCounts(activities, m.id, week.start, week.end, warmIds);
        const quota = quotaFor(m, quotas);
        return {
          member_id: m.id,
          full_name: m.full_name,
          role: m.role,
          counts: counts,
          quota: quota,
          remoteMet: quota ? counts.remote >= quota.remote : null,
          walkinsMet: quota ? counts.walkins >= quota.walkins : null,
        };
      });
    const totalCounts = { remote: 0, walkins: 0, replies: 0, meetings: 0, commitments: 0 };
    if (warmIds) totalCounts.remoteWarm = 0;
    let remoteTarget = 0;
    let walkinTarget = 0;
    let anyQuota = false;
    rows.forEach(function (r) {
      Object.keys(totalCounts).forEach(function (k) {
        totalCounts[k] += r.counts[k];
      });
      if (r.quota) {
        anyQuota = true;
        remoteTarget += r.quota.remote;
        walkinTarget += r.quota.walkins;
      }
    });
    return {
      week: week,
      rows: rows,
      total: {
        counts: totalCounts,
        quota: anyQuota ? { remote: remoteTarget, walkins: walkinTarget } : null,
      },
    };
  }

  /**
   * The "pipeline movement this week" table (spec §7.7). A move counts as entering a phase only
   * when it crosses into that phase from another one.
   * @param {Object[]} activities
   * @param {string} start
   * @param {string} end
   * @returns {{outreach: number, conversation: number, won: number, lost: number}}
   */
  function pipelineMovement(activities, start, end) {
    const out = { outreach: 0, conversation: 0, won: 0, lost: 0 };
    activities.forEach(function (a) {
      if (a.kind !== 'stage_change' || !isInRange(a.happened_on, start, end)) return;
      if (a.to_stage === 'lost') {
        if (a.from_stage !== 'lost') out.lost++;
        return;
      }
      const to = phaseOf(a.to_stage);
      if (to === phaseOf(a.from_stage)) return;
      if (to === 'Outreach') out.outreach++;
      else if (to === 'Conversation') out.conversation++;
      else if (to === 'Won') out.won++;
    });
    return out;
  }

  // ---------------------------------------------------------------------------
  // Templates (spec §7.8)
  // ---------------------------------------------------------------------------

  /**
   * @param {string} body
   * @returns {string[]} the {{placeholder}} names used in a template, once each
   */
  function templateFields(body) {
    const re = /\{\{\s*([a-z_][a-z0-9_]*)\s*\}\}/gi;
    const names = [];
    let match;
    while ((match = re.exec(String(body))) !== null) names.push(match[1]);
    return unique(names);
  }

  /**
   * Fills {{placeholders}}. A placeholder with no value is left in place, so the sender can see
   * what still needs filling in.
   * @param {string} body
   * @param {Object} data
   * @returns {{text: string, missing: string[]}}
   */
  function renderTemplate(body, data) {
    const missing = [];
    const out = String(body).replace(/\{\{\s*([a-z_][a-z0-9_]*)\s*\}\}/gi, function (whole, name) {
      const value = data ? data[name] : undefined;
      if (value === undefined || value === null || String(value).trim() === '') {
        if (missing.indexOf(name) === -1) missing.push(name);
        return '{{' + name + '}}';
      }
      return String(value);
    });
    return { text: out, missing: missing };
  }

  /**
   * @param {number} n
   * @returns {string} the number with thousands separators, e.g. 150,000
   */
  function formatNumber(n) {
    return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  /**
   * @param {string} iso
   * @returns {string} e.g. "October 20, 2026"; the input unchanged if it is not a date
   */
  function formatDateLong(iso) {
    const p = parseIsoDate(iso);
    return p ? MONTHS[p.m - 1] + ' ' + p.d + ', ' + p.y : String(iso);
  }

  /**
   * The values for a template when it is opened from a sponsor. One meal count and one founding
   * year come from settings, so nobody quotes two different numbers (spec §1).
   * @param {{sponsor?: Object, event?: Object, member?: Object, settings?: Object}} source
   * @returns {Object} placeholder name -> value; fields with nothing to say are blank
   */
  function buildTemplateData(source) {
    const sponsor = source.sponsor || {};
    const event = source.event || null;
    const member = source.member || {};
    const stats =
      (source.settings && source.settings.impact_stats) || DEFAULT_SETTINGS.impact_stats;
    let eventDate = '';
    if (event && isIsoDate(event.starts_on)) {
      eventDate =
        formatDateLong(event.starts_on) +
        (isTrue(event.date_confirmed) ? '' : ' (date to be confirmed)');
    }
    return {
      sponsor_name: text(sponsor.name),
      contact_name: text(sponsor.contact_name),
      ask_summary: text(sponsor.ask_summary),
      event_name: event ? text(event.name) : '',
      event_date: eventDate,
      meals: formatNumber(stats.meals),
      founded_year: String(stats.founded_year),
      sender_name: text(member.full_name),
    };
  }

  // ---------------------------------------------------------------------------
  // Lists the screens are built from (PLAN §10). Pure, so My work, Home and meeting mode can
  // never disagree about what is overdue.
  // ---------------------------------------------------------------------------

  /**
   * @param {Object} task
   * @returns {boolean} true for a task that is not done
   */
  function isOpenTask(task) {
    return text(task.status) !== 'done';
  }

  /**
   * @param {Object} sponsor
   * @returns {boolean} true when the sponsor is in an active stage but its next action or due
   *   date is missing (spec §6.2): treated as overdue so somebody fixes it
   */
  function lacksNextAction(sponsor) {
    return (
      !isTrue(sponsor.archived) &&
      requiresNextAction(text(sponsor.stage)) &&
      (!text(sponsor.next_action) || !isIsoDate(text(sponsor.next_action_due)))
    );
  }

  /**
   * @param {string} due
   * @param {string} today
   * @returns {'overdue'|'today'|'week'|'later'}
   */
  function dueGroup(due, today) {
    if (!isIsoDate(due)) return 'overdue';
    if (due < today) return 'overdue';
    if (due === today) return 'today';
    return due <= addDays(today, 7) ? 'week' : 'later';
  }

  /**
   * @typedef {Object} WorkItem
   * @property {'sponsor'|'task'} type
   * @property {string} id
   * @property {string} title sponsor name, or task title
   * @property {string} detail the next action (sponsors) or the linked sponsor or event (tasks)
   * @property {string} due YYYY-MM-DD, or '' when missing
   * @property {string} owner_id
   * @property {'overdue'|'today'|'week'|'later'} group
   * @property {Object} row the Sponsors or Tasks row
   */

  /**
   * @param {Object} sponsor
   * @param {string} today
   * @returns {WorkItem}
   */
  function sponsorItem(sponsor, today) {
    const due = text(sponsor.next_action_due);
    return {
      type: 'sponsor',
      id: sponsor.id,
      title: text(sponsor.name),
      detail: text(sponsor.next_action) || 'No next action yet',
      due: isIsoDate(due) ? due : '',
      owner_id: text(sponsor.owner_id),
      group: lacksNextAction(sponsor) ? 'overdue' : dueGroup(due, today),
      row: sponsor,
    };
  }

  /**
   * @param {Object} task
   * @param {string} today
   * @param {Object<string, Object>} [sponsorsById]
   * @param {Object<string, Object>} [eventsById]
   * @returns {WorkItem}
   */
  function taskItem(task, today, sponsorsById, eventsById) {
    const due = text(task.due_on);
    const sponsor = sponsorsById && sponsorsById[task.sponsor_id];
    const event = eventsById && eventsById[task.event_id];
    return {
      type: 'task',
      id: task.id,
      title: text(task.title),
      detail: sponsor ? text(sponsor.name) : event ? text(event.name) : '',
      due: isIsoDate(due) ? due : '',
      owner_id: text(task.owner_id),
      group: isIsoDate(due) ? dueGroup(due, today) : 'later',
      row: task,
    };
  }

  /**
   * Oldest first; a sponsor with no due date sorts first (it is broken, not just late).
   * @param {WorkItem} a
   * @param {WorkItem} b
   * @returns {number}
   */
  function byDue(a, b) {
    const da = a.due || '0000-00-00';
    const db = b.due || '0000-00-00';
    if (a.type === 'task' && !a.due) return 1;
    if (b.type === 'task' && !b.due) return -1;
    return da < db ? -1 : da > db ? 1 : a.title < b.title ? -1 : a.title > b.title ? 1 : 0;
  }

  /**
   * @param {Object[]} rows
   * @returns {Object<string, Object>} rows keyed by id
   */
  function indexById(rows) {
    const out = {};
    (rows || []).forEach(function (r) {
      out[r.id] = r;
    });
    return out;
  }

  /**
   * One person's worklist (My work, PLAN §10.9): their sponsors that need a next action and their
   * open tasks, overdue first, then by date.
   * @param {string} memberId
   * @param {{sponsors: Object[], tasks: Object[], events?: Object[]}} data
   * @param {string} today
   * @returns {WorkItem[]}
   */
  function myQueue(memberId, data, today) {
    const sponsorsById = indexById(data.sponsors);
    const eventsById = indexById(data.events);
    const items = [];
    data.sponsors.forEach(function (s) {
      if (s.owner_id !== memberId || isTrue(s.archived) || !requiresNextAction(text(s.stage)))
        return;
      items.push(sponsorItem(s, today));
    });
    (data.tasks || []).forEach(function (t) {
      if (t.owner_id !== memberId || !isOpenTask(t)) return;
      items.push(taskItem(t, today, sponsorsById, eventsById));
    });
    return items.sort(byDue);
  }

  /**
   * Everything overdue across the team (Home "Needs attention", spec §7.1), oldest first.
   * @param {{sponsors: Object[], tasks: Object[], events?: Object[]}} data
   * @param {string} today
   * @returns {WorkItem[]}
   */
  function needsAttention(data, today) {
    const sponsorsById = indexById(data.sponsors);
    const eventsById = indexById(data.events);
    const items = [];
    data.sponsors.forEach(function (s) {
      if (isTrue(s.archived) || !requiresNextAction(text(s.stage))) return;
      const item = sponsorItem(s, today);
      if (item.group === 'overdue') items.push(item);
    });
    (data.tasks || []).forEach(function (t) {
      if (!isOpenTask(t) || !isIsoDate(text(t.due_on)) || t.due_on >= today) return;
      items.push(taskItem(t, today, sponsorsById, eventsById));
    });
    return items.sort(byDue);
  }

  /**
   * @param {WorkItem[]} items
   * @param {Object[]} members in roster order
   * @returns {Array<{owner_id: string, name: string, count: number}>} one entry per owner with
   *   items, in roster order, "Unassigned" last; never sorted by count (no ranking)
   */
  function countByOwner(items, members) {
    const counts = {};
    items.forEach(function (i) {
      counts[i.owner_id || ''] = (counts[i.owner_id || ''] || 0) + 1;
    });
    const out = [];
    members.forEach(function (m) {
      if (counts[m.id]) out.push({ owner_id: m.id, name: text(m.full_name), count: counts[m.id] });
    });
    Object.keys(counts).forEach(function (id) {
      if (
        id &&
        !members.some(function (m) {
          return m.id === id;
        })
      ) {
        out.push({ owner_id: id, name: 'Someone else', count: counts[id] });
      }
    });
    if (counts['']) out.push({ owner_id: '', name: 'Unassigned', count: counts[''] });
    return out;
  }

  /** Activity kinds that mean a sponsor is talking to us. */
  const HOT_KINDS = deepFreeze(['reply', 'meeting', 'commitment']);

  /**
   * Hot leads (spec §7.1): sponsors in Conversation, or with a reply, meeting or commitment in the
   * last 7 days; most recent first.
   * @param {Object[]} sponsors
   * @param {Object[]} activities
   * @param {string} today
   * @returns {Array<{sponsor: Object, last: Object|null}>} last: the latest hot activity, if any
   */
  function hotLeads(sponsors, activities, today) {
    const since = addDays(today, -7);
    const latest = {};
    activities.forEach(function (a) {
      if (HOT_KINDS.indexOf(a.kind) === -1 || !isInRange(a.happened_on, since, today)) return;
      const known = latest[a.sponsor_id];
      if (!known || a.happened_on > known.happened_on) latest[a.sponsor_id] = a;
    });
    return sponsors
      .filter(function (s) {
        return !isTrue(s.archived) && (phaseOf(s.stage) === 'Conversation' || latest[s.id]);
      })
      .map(function (s) {
        return { sponsor: s, last: latest[s.id] || null };
      })
      .sort(function (a, b) {
        const ka = (a.last && a.last.happened_on) || text(a.sponsor.last_contact_at);
        const kb = (b.last && b.last.happened_on) || text(b.sponsor.last_contact_at);
        return ka > kb ? -1 : ka < kb ? 1 : 0;
      });
  }

  /**
   * @param {Object[]} sponsors
   * @param {string} today
   * @returns {Object[]} nurture sponsors whose "look again on" date has come
   */
  function revisitList(sponsors, today) {
    return sponsors
      .filter(function (s) {
        return (
          !isTrue(s.archived) &&
          s.stage === 'nurture' &&
          isIsoDate(text(s.nurture_until)) &&
          s.nurture_until <= today
        );
      })
      .sort(function (a, b) {
        return a.nurture_until < b.nurture_until ? -1 : a.nurture_until > b.nurture_until ? 1 : 0;
      });
  }

  /**
   * Sponsors talking money whose terms no VP has confirmed yet (PLAN A10).
   * @param {Object[]} sponsors
   * @param {Object[]} activities
   * @returns {Object[]}
   */
  function awaitingVp(sponsors, activities) {
    return sponsors.filter(function (s) {
      return (
        !isTrue(s.archived) &&
        TERMS_STAGES.indexOf(text(s.stage)) !== -1 &&
        !termsConfirmedNote(activities, s.id)
      );
    });
  }

  /**
   * Sponsors in Outreach or Conversation that nobody has touched for `days` (Team "Going quiet").
   * The overdue list cannot see these: their next action may be weeks away.
   * @param {Object[]} sponsors
   * @param {string} today
   * @param {number} [days] 10 when omitted
   * @returns {Object[]} oldest first
   */
  function staleSponsors(sponsors, today, days) {
    const limit = addDays(today, -(days === undefined ? 10 : days));
    function lastTouch(s) {
      const d = text(s.last_contact_at);
      return isIsoDate(d) ? d : text(s.created_at).slice(0, 10);
    }
    return sponsors
      .filter(function (s) {
        const phase = phaseOf(s.stage);
        const last = lastTouch(s);
        return (
          !isTrue(s.archived) &&
          (phase === 'Outreach' || phase === 'Conversation') &&
          isIsoDate(last) &&
          last < limit
        );
      })
      .sort(function (a, b) {
        return lastTouch(a) < lastTouch(b) ? -1 : lastTouch(a) > lastTouch(b) ? 1 : 0;
      });
  }

  /**
   * @param {Object[]} activities
   * @param {string} memberId
   * @returns {string|null} the latest day the member logged anything (stage changes aside)
   */
  function lastLoggedOn(activities, memberId) {
    let best = null;
    activities.forEach(function (a) {
      if (a.member_id !== memberId || a.kind === 'stage_change' || !isIsoDate(a.happened_on))
        return;
      if (!best || a.happened_on > best) best = a.happened_on;
    });
    return best;
  }

  /**
   * Sponsors that moved into Won since the term started, and what they are worth.
   * @param {Object[]} sponsors
   * @param {Object[]} activities
   * @param {string} today
   * @returns {{count: number, sum: number, sponsors: Object[]}}
   */
  function wonThisTerm(sponsors, activities, today) {
    const start = termStart(today);
    const ids = {};
    activities.forEach(function (a) {
      if (
        a.kind === 'stage_change' &&
        phaseOf(a.to_stage) === 'Won' &&
        phaseOf(a.from_stage) !== 'Won' &&
        isInRange(a.happened_on, start, today)
      ) {
        ids[a.sponsor_id] = true;
      }
    });
    const won = sponsors.filter(function (s) {
      return ids[s.id] && phaseOf(s.stage) === 'Won' && !isTrue(s.archived);
    });
    return {
      count: won.length,
      sum: won.reduce(function (sum, s) {
        const n = Number(s.potential_value_cad);
        return sum + (isFinite(n) ? n : 0);
      }, 0),
      sponsors: won,
    };
  }

  /**
   * Things that happened since a moment, for the meeting's "Win of the week": replies, meetings
   * and commitments, and moves into Won.
   * @param {Object[]} activities
   * @param {string} since first day included
   * @param {string} today
   * @returns {Object[]} newest first
   */
  function winsSince(activities, since, today) {
    return activities
      .filter(function (a) {
        if (!isInRange(a.happened_on, since, today)) return false;
        if (HOT_KINDS.indexOf(a.kind) !== -1) return true;
        return (
          a.kind === 'stage_change' &&
          phaseOf(a.to_stage) === 'Won' &&
          phaseOf(a.from_stage) !== 'Won'
        );
      })
      .sort(function (a, b) {
        return a.happened_on > b.happened_on ? -1 : a.happened_on < b.happened_on ? 1 : 0;
      });
  }

  /**
   * What falls due from today through `days` from now, across the team (Home "Due in the next 7
   * days"), sponsors with a broken next action excluded (they are in Needs attention).
   * @param {{sponsors: Object[], tasks: Object[], events?: Object[]}} data
   * @param {string} today
   * @param {number} [days] 7 when omitted
   * @returns {WorkItem[]} by date
   */
  function dueWithin(data, today, days) {
    const end = addDays(today, days === undefined ? 7 : days);
    const sponsorsById = indexById(data.sponsors);
    const eventsById = indexById(data.events);
    const items = [];
    data.sponsors.forEach(function (s) {
      if (isTrue(s.archived) || !requiresNextAction(text(s.stage)) || lacksNextAction(s)) return;
      if (s.next_action_due >= today && s.next_action_due <= end) items.push(sponsorItem(s, today));
    });
    (data.tasks || []).forEach(function (t) {
      if (isOpenTask(t) && isIsoDate(text(t.due_on)) && t.due_on >= today && t.due_on <= end) {
        items.push(taskItem(t, today, sponsorsById, eventsById));
      }
    });
    return items.sort(byDue);
  }

  /**
   * @param {Object[]} activities
   * @param {string} kind
   * @param {string} start
   * @param {string} end
   * @returns {number} how many activities of a kind happened in the range (team)
   */
  function countKind(activities, kind, start, end) {
    return activities.filter(function (a) {
      return a.kind === kind && isInRange(a.happened_on, start, end);
    }).length;
  }

  /**
   * Requests from other portfolios that no sponsor is attached to yet (Home).
   * @param {{needs: Object[], links: Object[], events: Object[]}} data
   * @param {string} today
   * @returns {Object[]} EventNeeds rows
   */
  function requestsWithNobody(data, today) {
    const eventsById = indexById(data.events);
    const linkedNeeds = {};
    data.links.forEach(function (l) {
      if (text(l.event_need_id)) linkedNeeds[l.event_need_id] = true;
    });
    return data.needs.filter(function (n) {
      if (!text(n.requested_by) || n.status !== 'open' || linkedNeeds[n.id]) return false;
      const e = eventsById[n.event_id];
      if (!e || e.status === 'done' || e.status === 'cancelled') return false;
      return !(isIsoDate(text(e.starts_on)) && e.starts_on < today);
    });
  }

  /**
   * Priority-A sponsors nobody owns, warm ones first (meeting mode "Assignments").
   * @param {Object[]} sponsors
   * @returns {Object[]}
   */
  function unassignedPriorityA(sponsors) {
    return sponsors
      .filter(function (s) {
        return (
          !text(s.owner_id) &&
          s.priority === 'A' &&
          !isTrue(s.archived) &&
          phaseOf(s.stage) !== 'Parked'
        );
      })
      .sort(function (a, b) {
        return (isWarm(a) ? 0 : 1) - (isWarm(b) ? 0 : 1) || (text(a.name) < text(b.name) ? -1 : 1);
      });
  }

  /**
   * The line at the top of My work (PLAN §10.9).
   * @param {{remote: number, walkins: number}} counts
   * @param {{remote: number, walkins: number}|null} quota
   * @param {number} overdue
   * @param {boolean} inWindow the night before the meeting
   * @param {Object} [meeting] Settings meeting
   * @returns {string}
   */
  function weekStatusLine(counts, quota, overdue, inWindow, meeting) {
    const remote = quota
      ? counts.remote + '/' + quota.remote + ' remote'
      : counts.remote + ' remote';
    const walk = quota
      ? counts.walkins + '/' + quota.walkins + ' walk-ins'
      : counts.walkins + ' walk-ins';
    const late = overdue + ' overdue';
    if (inWindow)
      return 'Before ' + meetingName(meeting) + ': ' + late + ' · ' + remote + ' · ' + walk;
    return 'Your week: ' + remote + ' · ' + walk + (overdue ? ' · ' + late : '');
  }

  // ---------------------------------------------------------------------------
  // Events: requests, dates and the status text everyone copies (PLAN A12–A15)
  // ---------------------------------------------------------------------------

  /**
   * A request made inside the 3-week window is late: Sponsorships will try, but late asks fail.
   * @param {string} today the day of the request
   * @param {string} startsOn
   * @param {number} [leadDays]
   * @returns {boolean}
   */
  function isLateRequest(today, startsOn, leadDays) {
    const due = defaultAskDueOn(startsOn, leadDays);
    return isIsoDate(today) && isIsoDate(due) && today > due;
  }

  /**
   * @param {Object} need an EventNeeds row with requested_by set
   * @param {Object} event
   * @param {number} [leadDays]
   * @returns {boolean} true when the request was filed inside the 3-week window
   */
  function needIsLate(need, event, leadDays) {
    if (!text(need.requested_by) || !event) return false;
    const ms = Date.parse(text(need.created_at));
    if (isNaN(ms)) return false;
    return isLateRequest(vancouverDate(ms), event.starts_on, leadDays);
  }

  /**
   * Fills the derived dates when an event's start date changes: asks-out and the marketing form
   * move with it, but only while they still equal the old default (a date set by hand stays).
   * @param {Object|null} oldEvent the event as it is now; null for a new event
   * @param {Object} patch
   * @param {number} [leadDays]
   * @returns {Object} the patch with the derived dates added
   */
  function eventDatePatch(oldEvent, patch, leadDays) {
    const old = oldEvent || {};
    const out = Object.assign({}, patch);
    const starts = patch.starts_on;
    if (starts === undefined || !isIsoDate(starts) || starts === old.starts_on) return out;
    const oldDefault = isIsoDate(old.starts_on) ? defaultAskDueOn(old.starts_on, leadDays) : '';
    const newDefault = defaultAskDueOn(starts, leadDays);
    ['asks_due_on', 'marketing_form_due_on'].forEach(function (field) {
      if (patch[field] !== undefined) return;
      if (!text(old[field]) || old[field] === oldDefault) out[field] = newDefault;
    });
    if (patch.ends_on === undefined && (!text(old.ends_on) || old.ends_on === old.starts_on)) {
      out.ends_on = starts;
    }
    if (oldEvent && patch.date_confirmed === undefined) out.date_confirmed = true;
    return out;
  }

  /**
   * @param {Object} event
   * @returns {Problem[]}
   */
  function validateEvent(event) {
    const e = event || {};
    const problems = [];
    function add(field, message) {
      problems.push({ field: field, message: message });
    }
    if (!text(e.name)) add('name', 'Name the event.');
    if (!isIsoDate(text(e.starts_on))) add('starts_on', 'Give the event a date (a guess is fine).');
    ['ends_on', 'asks_due_on', 'marketing_form_due_on'].forEach(function (f) {
      if (text(e[f]) && !isIsoDate(text(e[f]))) add(f, 'Use a date like 2026-10-16.');
    });
    if (isIsoDate(text(e.ends_on)) && isIsoDate(text(e.starts_on)) && e.ends_on < e.starts_on) {
      add('ends_on', 'The event cannot end before it starts.');
    }
    [
      ['event_type', 'event_type'],
      ['owning_portfolio', 'owning_portfolio'],
      ['status', 'event_status'],
    ].forEach(function (pair) {
      if (text(e[pair[0]]) && ENUMS[pair[1]].indexOf(text(e[pair[0]])) === -1) {
        add(pair[0], 'Pick one of the listed values.');
      }
    });
    return problems;
  }

  /**
   * @param {Object} need
   * @returns {Problem[]}
   */
  function validateNeed(need) {
    const n = need || {};
    const problems = [];
    if (!text(n.event_id)) problems.push({ field: 'event_id', message: 'Pick the event.' });
    if (ENUMS.ask_type.indexOf(text(n.ask_type)) === -1) {
      problems.push({ field: 'ask_type', message: 'Pick what is needed.' });
    }
    if (!text(n.description)) {
      problems.push({ field: 'description', message: 'Say what is needed, in a few words.' });
    }
    const q = text(n.quantity_target);
    if (q !== '' && !(Number(q) >= 1 && Math.floor(Number(q)) === Number(q))) {
      problems.push({ field: 'quantity_target', message: 'How many sponsors: 1 or more.' });
    }
    if (text(n.due_on) && !isIsoDate(text(n.due_on))) {
      problems.push({ field: 'due_on', message: 'Use a date like 2026-10-16.' });
    }
    if (text(n.status) && ENUMS.need_status.indexOf(text(n.status)) === -1) {
      problems.push({ field: 'status', message: 'Status must be open, covered or dropped.' });
    }
    return problems;
  }

  /**
   * @param {Object} task
   * @returns {Problem[]}
   */
  function validateTask(task) {
    const t = task || {};
    const problems = [];
    if (!text(t.title)) problems.push({ field: 'title', message: 'Say what needs doing.' });
    if (text(t.due_on) && !isIsoDate(text(t.due_on))) {
      problems.push({ field: 'due_on', message: 'Use a date like 2026-10-16.' });
    }
    return problems;
  }

  /**
   * @param {Object[]} members in roster order
   * @param {string} [leadVpId] Settings lead_vp_id
   * @returns {Object|null} who requests go to: the lead VP when set and active, else the first
   *   active vp in roster order
   */
  function leadVp(members, leadVpId) {
    const active = members.filter(function (m) {
      return isTrue(m.active) || m.active === undefined;
    });
    const chosen = active.filter(function (m) {
      return m.id === leadVpId && m.role === 'vp';
    })[0];
    return (
      chosen ||
      active.filter(function (m) {
        return m.role === 'vp';
      })[0] ||
      null
    );
  }

  /**
   * @param {*} fullName
   * @returns {string} the first word of a name
   */
  function firstName(fullName) {
    return text(fullName).split(/\s+/)[0] || '';
  }

  /**
   * Everything the status of one event is made of, and the fixed-format text that is shown on the
   * event card and pasted into Slack and the exec doc (PLAN A14). One function, so the screen and
   * the pasted text can never disagree.
   * @param {Object} event
   * @param {{needs: Object[], links: Object[], sponsors: Object[], members: Object[], tasks: Object[], activities?: Object[]}} data
   * @param {string} today
   * @param {Object} [lead] the lead VP's Members row
   * @returns {{health: string, coverage: Object[], attached: Object[], lines: string[], text: string}}
   */
  function eventStatus(event, data, today, lead) {
    const needs = data.needs.filter(function (n) {
      return n.event_id === event.id;
    });
    const links = data.links.filter(function (l) {
      return l.event_id === event.id;
    });
    const coverage = needCoverage(needs, links, data.sponsors);
    const health = eventHealth(event, coverage, today);
    const sponsorsById = indexById(data.sponsors);
    const membersById = indexById(data.members);
    const attached = unique(
      links.map(function (l) {
        return l.sponsor_id;
      })
    )
      .map(function (id) {
        return sponsorsById[id];
      })
      .filter(function (s) {
        return s && !isTrue(s.archived);
      });
    const lines = [];
    lines.push(
      text(event.name) +
        ' · ' +
        (isIsoDate(event.starts_on) ? formatDateLong(event.starts_on) : 'date to be set') +
        (isTrue(event.date_confirmed) ? '' : ' (date TBC)') +
        ' · ' +
        HEALTH_LABEL[health]
    );
    const sinceDue = daysBetween(event.asks_due_on, today);
    if (sinceDue !== null) {
      lines.push(
        sinceDue > 0
          ? 'Asks were due ' +
              shortDate(event.asks_due_on) +
              ' (' +
              sinceDue +
              (sinceDue === 1 ? ' day ago)' : ' days ago)')
          : sinceDue === 0
            ? 'Asks are due today'
            : 'Asks out by ' + shortDate(event.asks_due_on)
      );
    }
    lines.push('Needs: ' + (coverage.length ? coverageLabel(coverage) : 'none logged'));
    const counts = { Prospect: 0, Outreach: 0, Conversation: 0, Won: 0 };
    attached.forEach(function (s) {
      const phase = phaseOf(s.stage);
      if (Object.prototype.hasOwnProperty.call(counts, phase)) counts[phase]++;
    });
    lines.push(
      'Pipeline: ' +
        counts.Won +
        ' won · ' +
        counts.Conversation +
        ' in conversation · ' +
        counts.Outreach +
        ' in outreach · ' +
        counts.Prospect +
        (counts.Prospect === 1 ? ' prospect' : ' prospects')
    );
    const won = attached.filter(function (s) {
      return phaseOf(s.stage) === 'Won';
    });
    lines.push(
      'Secured: ' +
        (won.length
          ? won
              .map(function (s) {
                const value = text(s.potential_value_cad);
                const confirmed = termsConfirmedNote(data.activities || [], s.id);
                const bits = [];
                if (text(s.ask_summary)) bits.push(text(s.ask_summary));
                if (value !== '' && Number(value) > 0) {
                  bits.push('$' + formatNumber(value) + (confirmed ? '' : ' est.'));
                }
                return text(s.name) + (bits.length ? ' (' + bits.join(', ') + ')' : '');
              })
              .join(', ')
          : 'nothing yet')
    );
    const owned = {};
    attached.forEach(function (s) {
      if (phaseOf(s.stage) === 'Parked' || !text(s.owner_id)) return;
      owned[s.owner_id] = (owned[s.owner_id] || 0) + 1;
    });
    const owners = data.members
      .filter(function (m) {
        return owned[m.id];
      })
      .map(function (m) {
        return text(m.full_name) + ' (' + owned[m.id] + ')';
      });
    lines.push(
      'Owners: ' +
        (owners.length
          ? owners.slice(0, 3).join(', ') + (owners.length > 3 ? ' +' + (owners.length - 3) : '')
          : 'nobody assigned' + (lead ? ' · lead VP ' + text(lead.full_name) : ''))
    );
    const openTasks = (data.tasks || [])
      .filter(function (t) {
        return t.event_id === event.id && isOpenTask(t) && isIsoDate(text(t.due_on));
      })
      .sort(function (a, b) {
        return a.due_on < b.due_on ? -1 : a.due_on > b.due_on ? 1 : 0;
      });
    let next = null;
    if (openTasks.length) {
      const t = openTasks[0];
      next = { what: t.title, who: membersById[t.owner_id], due: t.due_on };
    } else {
      const withActions = attached
        .filter(function (s) {
          return requiresNextAction(s.stage) && text(s.next_action) && isIsoDate(s.next_action_due);
        })
        .sort(function (a, b) {
          return a.next_action_due < b.next_action_due
            ? -1
            : a.next_action_due > b.next_action_due
              ? 1
              : 0;
        });
      if (withActions.length) {
        const s = withActions[0];
        next = {
          what: s.name + ': ' + s.next_action,
          who: membersById[s.owner_id],
          due: s.next_action_due,
        };
      }
    }
    lines.push(
      next
        ? 'Next: ' +
            next.what +
            ' · ' +
            (next.who ? firstName(next.who.full_name) : 'nobody') +
            ', ' +
            shortDate(next.due)
        : 'Next: nothing scheduled'
    );
    return {
      health: health,
      coverage: coverage,
      attached: attached,
      lines: lines,
      text: lines.join('\n'),
    };
  }

  /**
   * @param {Object} event
   * @param {Object} data see eventStatus
   * @param {string} today
   * @param {Object} [lead]
   * @returns {string} the paragraph "Copy status" puts on the clipboard

  function eventStatusText(event, data, today, lead) {

  /**

   * @param {string} today

  function statusSummaryLine(healths, won, today) {

    };
    return (
      'Sponsorships status · ' +

      n('red') +

      n('green') +
      ' on track · ' +
      n('open') +
      ' not due yet · Won this term: ' +
      won.count +
      ' ($' +
      formatNumber(won.sum) +
      ')'
    );
  }

   * @param {Array<{owner: string, title: string, due: string}>} [summary.actions]
   * @returns {string} the "Copy for Slack" text

  function meetingSummaryText(summary) {
    const out = ['Sponsorships weekly · ' + dayLabel(summary.date)];

    if (summary.total) {

  /**
   * "Copy brief as text" (PLAN A22): a one-page brief built from the record.
   * @param {Object} src
   * @param {Object} src.sponsor
   * @param {Object} [src.owner]
   * @param {Object[]} [src.events] attached events with `need` (the EventNeeds row) when linked
   * @param {Object[]} [src.activities] the sponsor's activity, any order
   * @param {Object} [src.settings]
   * @param {Object<string, Object>} [src.membersById]
   * @returns {string}
   */
  function briefText(src) {
    const s = src.sponsor || {};
    const settings = src.settings || DEFAULT_SETTINGS;
    const out = [];
    out.push('BRIEF: ' + text(s.name).toUpperCase());
    out.push(
      [
        CATEGORY_LABEL[s.category] || text(s.category),
        'Priority ' + (text(s.priority) || '-'),
        STAGE_LABEL[s.stage] || text(s.stage),
        'Owner ' + (src.owner ? text(src.owner.full_name) : 'unassigned'),
      ].join(' · ')
    );
    out.push('');
    out.push('WHO');
    const contact = [text(s.contact_name), text(s.contact_title)].filter(Boolean).join(', ');
    if (contact) out.push('- Contact: ' + contact);
    if (text(s.contact_email)) out.push('- Email: ' + text(s.contact_email));
    if (text(s.contact_phone)) out.push('- Phone: ' + text(s.contact_phone));
    if (text(s.website)) out.push('- Website: ' + text(s.website));
    if (text(s.address)) out.push('- Address: ' + text(s.address));
    if (text(s.warm_intro)) out.push('- How we know them: ' + text(s.warm_intro));
    if (!hasContact(s)) out.push('- No contact yet.');
    if (isTrue(s.is_past_sponsor) || text(s.past_notes)) {
      out.push('');
      out.push('HISTORY WITH US');
      if (isTrue(s.is_past_sponsor)) out.push('- Past sponsor.');

    }

      out.push('');
      out.push('SUMMARY');
      out.push(text(s.summary));
    }
    out.push('');
    out.push('THE ASK');
    if (text(s.ask_type)) out.push('- Type: ' + text(s.ask_type));
    if (text(s.ask_summary)) out.push('- What: ' + text(s.ask_summary));
    if (text(s.potential_value_cad) !== '')
      out.push('- Value: $' + formatNumber(s.potential_value_cad));

      out.push(

    if (confirmed) out.push('- ' + text(confirmed.summary));

    out.push('GIVING LADDER');
    (settings.giving_ladder || []).forEach(function (step) {
      out.push('- $' + formatNumber(step.amount) + ': ' + text(step.text));
    });

    const recent = (src.activities || [])
      .filter(function (a) {
        return a.sponsor_id === s.id || !s.id;
      })
      .slice()
      .sort(function (a, b) {
        return text(a.happened_on) > text(b.happened_on)
          ? -1
          : text(a.happened_on) < text(b.happened_on)

  function isStubTemplate(template) {

   * @param {Object} sponsor
   * @param {Object[]} attachedEvents the sponsor's events

  function pickTemplate(sponsor, attachedEvents, templates) {
    const byKind = {};
    (templates || []).forEach(function (t) {
      if (!byKind[t.kind]) byKind[t.kind] = t;

    const stage = text(sponsor.stage);
    let kind = 'cold_email';
    if (phaseOf(stage) === 'Won') kind = 'thank_you';
    else if (stage === 'contacted' || stage === 'follow_up') kind = 'follow_up';
    else if (text(sponsor.category) === 'education-consulting') kind = 'education_consulting';

  /**

   * @param {string} expectedUpdatedAt the updated_at the client last saw
   * @param {string} currentUpdatedAt the updated_at the row has now
   * @returns {'ok'|'conflict'|'missing'} missing when the client did not say which version it saw
   */
  function checkVersion(expectedUpdatedAt, currentUpdatedAt) {
    if (!text(expectedUpdatedAt)) return 'missing';

      return h(
        'div',
        { class: 'bar' + (met ? ' met' : ''), role: 'progressbar', 'aria-valuenow': value, 'aria-valuemax': max || value },
        h('span', { style: 'width:' + pct + '%' })
      );
    }

    /**
     * @param {string} title
     * @param {*} [count]
     * @param {...*} actions
     * @returns {HTMLElement}
     */
    function sectionHead(title, count, ...actions) {
      return h(
        'div',
        { class: 'section-head' },
        h('h2', null, title, count !== undefined && count !== null ? h('span', { class: 'count' }, ' · ' + count) : null),
        actions
      );
    }

    /**
     * A label from one of the Rules maps; a value typed in the Sheet that the map does not know
     * shows as it is, never as "undefined" (PLAN A19).
     * @param {Object<string, string>} map e.g. Rules.STAGE_LABEL
     * @param {*} value
     * @returns {string}
     */
    function labelOf(map, value) {
      if (value === undefined || value === null) return '';
      return (map && Object.prototype.hasOwnProperty.call(map, value) && map[value]) || String(value);
    }

    /**
     * A labelled form field.
     * @param {string} label
     * @param {Node} control
     * @param {{problem?: string, hint?: string}} [opts]
     * @returns {HTMLElement}
     */
    function field(label, control, opts) {
      const o = opts || {};
      // A <label> passes a tap on its text to the first control inside it: right for one input,
      // wrong for a row of buttons (tapping "By when" picked "Tomorrow"). Groups get a <div>.
      const single = control && /^(INPUT|TEXTAREA|SELECT)$/.test(control.tagName || '');
      return h(
        single ? 'label' : 'div',
        single ? { class: 'field' } : { class: 'field', role: 'group', 'aria-label': label },
        h('span', { class: 'label' }, label),
        control,
        o.hint ? h('div', { class: 'hint' }, o.hint) : null,
        o.problem ? h('div', { class: 'problem' }, o.problem) : null
      );
    }

    /**
     * A segmented control.
     * @param {Array<{value: string, label: string}>} options
     * @param {string} value
     * @param {function(string): void} onChange
     * @param {string} [label] accessible name
     * @returns {HTMLElement}
     */
    function seg(options, value, onChange, label) {
      return h(
        'div',
        { class: 'seg', role: 'group', 'aria-label': label || null },
        options.map(function (o) {
          return h(
            'button',
            {
              type: 'button',
              'aria-pressed': o.value === value ? 'true' : 'false',
              onClick: function () {
                onChange(o.value);
              },
            },
            o.label
          );
        })
      );
    }

    /**
     * Date chips first, the native picker only behind "Pick a date" (PLAN §9.3).
     * @param {{value: string, onPick: function(string): void, chips?: Array<{label: string, date: string}>, allowClear?: boolean}} opts
     * @returns {HTMLElement}
     */
    function dateChips(opts) {
      const chips = opts.chips || Rules.quickDates(Hub.today(), Hub.settings().follow_up_days);
      const wrap = h('div', { class: 'date-chips' });
      let matched = false;
      chips.forEach(function (c) {
        const on = c.date === opts.value;
        if (on) matched = true;
        add(wrap, 
          h(
            'button',
            {
              type: 'button',
              class: 'date-chip',
              'aria-pressed': on ? 'true' : 'false',
              title: Rules.dayLabel(c.date),
              onClick: function () {
                opts.onPick(c.date);
              },
            },
            c.label,
            c.sub ? h('span', { class: 'sub' }, ' ' + c.sub) : null
          )
        );
      });
      const picker = h('input', {
        type: 'date',
        class: 'input',
        value: Rules.isIsoDate(opts.value) ? opts.value : '',
        'aria-label': 'Pick a date',
        style: 'max-width:180px;min-height:36px;padding:4px 8px',
        onChange: function (e) {
          if (Rules.isIsoDate(e.target.value)) opts.onPick(e.target.value);
        },
      });
      const custom = !matched && Rules.isIsoDate(opts.value);
      const pickBtn = h(
        'button',
        {
          type: 'button',
          class: 'date-chip',
          'aria-pressed': custom ? 'true' : 'false',
          onClick: function () {
            pickBtn.replaceWith(picker);
            try {
              picker.showPicker();
            } catch (err) {
              picker.focus();
            }
          },
        },
        custom ? Rules.dayLabel(opts.value) : 'Pick a date'
      );
      add(wrap, pickBtn);
      return wrap;
    }

    /** @param {number} [n] @returns {HTMLElement} a skeleton list */
    function skeleton(n) {
      const out = h('div', { 'aria-busy': 'true', 'aria-label': 'Loading' });
      for (let i = 0; i < (n || 4); i++) {
        add(out, h('div', { class: 'skel', style: 'height:52px;margin-top:10px' }));
      }
      return out;
    }

    // ---- Overlays ---------------------------------------------------------------------------

    const layers = [];

    /**
     * Opens a bottom sheet (phone) or dialog (desktop). `render(body, api)` fills it and is called
     * again by api.refresh(). Esc and the backdrop close it; the backdrop only when nothing typed.
     * @param {{title: string, render: function(HTMLElement, Object): void, foot?: function(HTMLElement, Object): void,
     *   size?: string, onClose?: Function, isDirty?: function(): boolean, label?: string}} opts
     * @returns {Object} api: close, refresh, setTitle, body, panel
     */
    function openSheet(opts) {
      const titleEl = h('h2', { id: 'sheet-title-' + (layers.length + 1) }, opts.title);
      const body = h('div', { class: 'sheet-body' });
      const foot = h('div', { class: 'sheet-foot' });
      const panel = h(
        'div',
        {
          class: 'sheet ' + (opts.size || ''),
          role: 'dialog',
          'aria-modal': 'true',
          'aria-labelledby': titleEl.id,
        },
        h('div', { class: 'sheet-handle', 'aria-hidden': 'true' }),
        h(
          'div',
          { class: 'sheet-head' },
          opts.back ? h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Back', onClick: function () { opts.back(); } }, icon('back')) : null,
          titleEl,
          h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Close', onClick: function () { api.close(); } }, icon('close'))
        ),
        body,
        foot
      );
      const backdrop = h('div', {
        class: 'layer-backdrop',
        onClick: function () {
          if (!api.isDirty()) api.close();
        },
      });
      const wrap = h('div', { class: 'layer' }, backdrop, panel);
      const previousFocus = document.activeElement;
      let closed = false;
      const api = {
        body: body,
        panel: panel,
        foot: foot,
        isDirty: opts.isDirty || function () {
          return false;
        },
        setTitle: function (t) {
          titleEl.textContent = t;
        },
        refresh: function () {
          const keep = focusKey();
          body.replaceChildren();
          foot.replaceChildren();
          opts.render(body, api);
          if (opts.foot) opts.foot(foot, api);
          foot.style.display = foot.childNodes.length ? '' : 'none';
          restoreFocus(keep, body);
        },
        close: function (reason) {
          if (closed) return;
          closed = true;
          wrap.remove();
          const i = layers.indexOf(api);
          if (i !== -1) layers.splice(i, 1);
          if (!layers.length) document.body.classList.remove('has-layer');
          if (opts.onClose) opts.onClose(reason);
          if (previousFocus && previousFocus.focus && document.contains(previousFocus)) {
            try {
              previousFocus.focus({ preventScroll: true });
            } catch (err) {
              // the element went away
            }
          }
          Hub.flushRender();
        },
        get closed() {
          return closed;
        },
      };
      layers.push(api);
      document.body.classList.add('has-layer');
      Hub.layerRoot().append(wrap);
      // `manual`: the caller draws it with api.refresh() once its own variables exist.
      if (!opts.manual) {
        opts.render(body, api);
        if (opts.foot) opts.foot(foot, api);
      }
      foot.style.display = foot.childNodes.length ? '' : 'none';
      if (!opts.noAutoFocus) {
        const first = panel.querySelector('[data-autofocus]') || panel.querySelector('.sheet-body button, .sheet-body input, .sheet-body textarea');
        if (first && Hub.isDesktop()) first.focus({ preventScroll: true });
      }
      return api;
    }

    /** @returns {{key: string, start: number, end: number}|null} the focused field, to keep it across a refresh */
    function focusKey() {
      const el = document.activeElement;
      if (!el || !el.getAttribute) return null;
      const key = el.getAttribute('data-key');
      if (!key) return null;
      let start = null;
      let end = null;
      try {
        start = el.selectionStart;
        end = el.selectionEnd;
      } catch (err) {
        // not a text field
      }
      return { key: key, start: start, end: end };
    }

    /** @param {Object|null} keep @param {HTMLElement} within */
    function restoreFocus(keep, within) {
      if (!keep) return;
      const el = within.querySelector('[data-key="' + keep.key + '"]');
      if (!el) return;
      el.focus({ preventScroll: true });
      try {
        if (keep.start !== null) el.setSelectionRange(keep.start, keep.end);
      } catch (err) {
        // not a text field
      }
    }

    /** @returns {boolean} true while any overlay is open */
    function layerOpen() {
      return layers.length > 0;
    }

    /** Closes every overlay (used when navigating). */
    function closeAll() {
      layers.slice().reverse().forEach(function (l) {
        l.close('navigate');
      });
    }

    /**
     * A short list to pick from (owner, reschedule, more actions): a small sheet on phones, a
     * small dialog on desktop.
     * @param {{title: string, items: Array<{label: string, meta?: string, icon?: string, checked?: boolean, onSelect: Function, danger?: boolean}>, intro?: Node}} opts
     * @returns {Object} the sheet api
     */
    function openMenu(opts) {
      return openSheet({
        title: opts.title,
        size: 'small',
        render: function (body, api) {
          body.style.padding = '6px 4px 12px';
          if (opts.intro) add(body, opts.intro);
          add(body, 
            h(
              'ul',
              { class: 'menu', role: 'menu' },
              opts.items.map(function (item) {
                return h(
                  'li',
                  { role: 'none' },
                  h(
                    'button',
                    {
                      type: 'button',
                      role: 'menuitemradio',
                      'aria-checked': item.checked ? 'true' : 'false',
                      style: item.danger ? 'color:var(--overdue)' : null,
                      onClick: function () {
                        api.close('select');
                        item.onSelect();
                      },
                    },
                    item.icon ? icon(item.icon) : null,
                    h('span', { class: 'grow truncate' }, item.label),
                    item.meta ? h('span', { class: 'menu-meta' }, item.meta) : null,
                    item.checked ? icon('check') : null
                  )
                );
              })
            )
          );
          if (opts.after) add(body, opts.after(api));
        },
      });
    }

    /**
     * The reschedule menu (PLAN §10.9, "Later"): Tomorrow, +3 d, +7 d, next Monday, or a date.
     * @param {string} title
     * @param {string} current
     * @param {function(string): void} onPick
     */
    function openLater(title, current, onPick) {
      const today = Hub.today();
      const options = [
        { label: 'Tomorrow', date: Rules.addDays(today, 1) },
        { label: '+3 days', date: Rules.addDays(today, 3) },
        { label: '+1 week', date: Rules.addDays(today, 7) },
        { label: 'Next Monday', date: Rules.nextWeekday(today, 0) },
      ];
      const seen = {};
      openMenu({
        title: title,
        items: options
          .filter(function (o) {
            if (seen[o.date]) return false;
            seen[o.date] = true;
            return true;
          })
          .map(function (o) {
            return {
              label: o.label,
              meta: Rules.dayLabel(o.date),
              icon: 'later',
              checked: o.date === current,
              onSelect: function () {
                onPick(o.date);
              },
            };
          }),
        after: function (api) {
          return h(
            'div',
            { style: 'padding:6px 14px 0' },
            field(
              'Or pick a date',
              h('input', {
                type: 'date',
                class: 'input',
                min: today,
                onChange: function (e) {
                  if (Rules.isIsoDate(e.target.value)) {
                    api.close('select');
                    onPick(e.target.value);
                  }
                },
              })
            )
          );
        },
      });
    }

    // ---- Toast ------------------------------------------------------------------------------

    let toastTimer = null;
    let toastHold = false;

    /**
     * One toast at a time, replaced not stacked. A `prompt` adds one question with Yes / Not now.
     * @param {{text: string, action?: {label: string, fn: Function}, prompt?: {label: string, detail?: string, yes: Function, no?: Function, yesLabel?: string}, error?: boolean, ms?: number}} opts
     */
    function toast(opts) {
      const slot = Hub.toastRoot();
      clearTimeout(toastTimer);
      toastHold = false;
      const box = h('div', { class: 'toast' + (opts.error ? ' error' : ''), role: 'status', 'aria-live': 'polite' });
      add(box, 
        h(
          'div',
          { class: 'hstack' },
          opts.error ? null : icon('check', 18),
          h('span', { class: 'grow' }, opts.text),
          opts.action
            ? h(
                'button',
                {
                  type: 'button',
                  onClick: function () {
                    hideToast();
                    opts.action.fn();
                  },
                },
                opts.action.label
              )
            : null
        )
      );
      if (opts.prompt) {
        toastHold = true;
        add(box, 
          h(
            'div',
            { class: 'toast-prompt' },
            h('strong', null, opts.prompt.label),
            opts.prompt.detail ? h('div', { class: 'detail' }, opts.prompt.detail) : null,
            h(
              'div',
              { class: 'hstack' },
              h(
                'button',
                {
                  type: 'button',
                  class: 'yes',
                  onClick: function () {
                    hideToast();
                    opts.prompt.yes();
                  },
                },
                opts.prompt.yesLabel || 'Yes'
              ),
              h(
                'button',
                {
                  type: 'button',
                  onClick: function () {
                    hideToast();
                    if (opts.prompt.no) opts.prompt.no();
                  },
                },
                'Not now'
              )
            )
          )
        );
      }
      slot.replaceChildren(box);
      const ms = opts.ms || (opts.prompt ? 14000 : opts.error ? 8000 : 6000);
      toastTimer = setTimeout(hideToast, ms);
    }

    function hideToast() {
      clearTimeout(toastTimer);
      toastHold = false;
      Hub.toastRoot().replaceChildren();
    }

    // ---- Clipboard --------------------------------------------------------------------------

    /**
     * Copies text. Must run inside the click handler: iOS Safari only allows it there. Tries a
     * selected textarea with execCommand first (works inside Google's iframe), then the async API.
     * @param {string} text
     * @returns {boolean} true when copied
     */
    function copyText(text) {
      const area = h('textarea', { 'aria-hidden': 'true', readonly: true, style: 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px' });
      area.value = text;
      document.body.append(area);
      let ok = false;
      try {
        area.focus({ preventScroll: true });
        area.select();
        area.setSelectionRange(0, text.length);
        ok = document.execCommand('copy');
      } catch (err) {
        ok = false;
      }
      area.remove();
      if (!ok && navigator.clipboard && navigator.clipboard.writeText) {
        try {
          navigator.clipboard.writeText(text);
          ok = true;
        } catch (err) {
          ok = false;
        }
      }
      return ok;
    }

    /**
     * Copies and says so; when the browser refuses, shows the text selected so it can be copied by hand.
     * @param {string} text
     * @param {string} [what] e.g. "Status"
     */
    function copyAndTell(text, what) {
      if (copyText(text)) {
        toast({ text: (what || 'Text') + ' copied', ms: 2500 });
        return true;
      }
      openSheet({
        title: 'Copy this',
        render: function (body) {
          const area = h('textarea', { class: 'textarea', readonly: true, style: 'min-height:220px' });
          area.value = text;
          add(body, h('p', { class: 'muted small' }, 'Your browser blocked copying. The text is selected: press Copy.'), area);
          setTimeout(function () {
            area.focus();
            area.select();
          }, 50);
        },
      });
      return false;
    }

    // ---- Router -----------------------------------------------------------------------------

    /** Views that exist; anything else goes to the role's landing view. */
    const VIEWS = ['home', 'pipeline', 'sponsor', 'events', 'my', 'team', 'meeting', 'templates', 'settings'];

    /** @returns {string} where each role lands (PLAN A16) */
    function landingView() {
      const role = Hub.state.me ? Hub.state.me.role : '';
      if (role === 'coordinator') return 'my';
      if (role === 'vp') return 'home';
      return 'events';
    }

    /**
     * Shows a view. Recorded in google.script.history so the back button and deep links work
     * (PLAN A17: query parameters, never the hash).
     * @param {string} v
     * @param {string} [id]
     * @param {{replace?: boolean, keepLayers?: boolean, keepScroll?: boolean, restoreScroll?: boolean}} [opts]
     *   keepScroll: stay where the page is (desktop side panel); restoreScroll: back where this
     *   screen was left (Back)
     */
    function go(v, id, opts) {
      const o = opts || {};
      const route = { v: VIEWS.indexOf(v) !== -1 ? v : landingView(), id: id || '' };
      const same = Hub.state.route && Hub.state.route.v === route.v && Hub.state.route.id === route.id;
      if (!same && Hub.state.route) {
        Hub.state.prevRoute = Hub.state.route;
        scrollMemo[routeKey(Hub.state.route)] = window.scrollY;
      }
      if (!o.keepLayers) closeAll();
      if (!same && o.restoreScroll) Hub.state.scrollTo = scrollMemo[routeKey(route)] || 0;
      else if (!same && !o.keepScroll) Hub.state.scrollTo = 0;
      Hub.state.route = route;
      try {
        const params = route.id ? { v: route.v, id: route.id } : { v: route.v };
        if (o.replace) google.script.history.replace(route, params, '');
        else if (!same) google.script.history.push(route, params, '');
      } catch (err) {
        // history is not available (tests): navigation still works in the page
      }
      Hub.render(true);
    }

    /** Where each screen was scrolled to when it was left, so Back returns there. */
    const scrollMemo = {};

    /** @returns {string} */
    function routeKey(route) {
      return route.v + ':' + (route.id || '');
    }

    /** Goes back to the previous screen in the app (never leaves it). */
    function goBack() {
      const prev = Hub.state.prevRoute;
      if (prev && prev.v !== 'sponsor') go(prev.v, prev.id, { restoreScroll: true });
      else go(prev && prev.v === 'sponsor' ? 'pipeline' : landingView(), '', { restoreScroll: true });
    }

    /** Reads the first route from the URL (?v=sponsor&id=...) and listens for back/forward. */
    function startRouter(done) {
      function fromParams(p) {
        const params = p || {};
        const v = String(params.v || '');
        return { v: VIEWS.indexOf(v) !== -1 ? v : landingView(), id: String(params.id || '') };
      }
      try {
        google.script.history.setChangeHandler(function (e) {
          const next = e && e.state && e.state.v ? e.state : fromParams(e && e.location && e.location.parameter);
          closeAll();
          if (Hub.state.route) scrollMemo[routeKey(Hub.state.route)] = window.scrollY;
          Hub.state.route = { v: next.v, id: next.id || '' };
          Hub.state.scrollTo = scrollMemo[routeKey(Hub.state.route)] || 0;
          Hub.render(true);
        });
      } catch (err) {
        // no history API here
      }
      try {
        google.script.url.getLocation(function (loc) {
          Hub.state.route = fromParams(loc && loc.parameter);
          try {
            google.script.history.replace(Hub.state.route, Hub.state.route.id ? Hub.state.route : { v: Hub.state.route.v }, '');
          } catch (err) {
            // fine
          }
          done();
        });
      } catch (err) {
        Hub.state.route = fromParams({});
        done();
      }
    }

    // ---- Shell ------------------------------------------------------------------------------

    const NAV = [
      { v: 'home', label: 'Home', icon: 'home' },
      { v: 'pipeline', label: 'Pipeline', icon: 'pipeline' },
      { v: 'events', label: 'Events', icon: 'events' },
      { v: 'my', label: 'My work', icon: 'my' },
      { v: 'team', label: 'Team', icon: 'team' },
      { v: 'templates', label: 'Templates', icon: 'templates' },
      { v: 'settings', label: 'Settings', icon: 'settings' },
    ];

    let shell = null;

    /** Builds the frame once: sidebar, top bar, view, tab bar, layers and toast. */
    function renderShell() {
      const root = document.getElementById('app');
      const sidebar = h('nav', { class: 'sidebar', 'aria-label': 'Main' });
      const topbar = h('header', { class: 'topbar' });
      const view = h('main', { id: 'view', tabindex: '-1' });
      const tabbar = h('nav', { class: 'tabbar', 'aria-label': 'Main' });
      const layer = h('div', { id: 'layer' });
      const toastSlot = h('div', { class: 'toast-slot', 'aria-live': 'polite' });
      root.replaceChildren(sidebar, h('div', { class: 'shell-main' }, topbar, view), tabbar, layer, toastSlot);
      shell = { root: root, sidebar: sidebar, topbar: topbar, view: view, tabbar: tabbar, layer: layer, toast: toastSlot };
      updateShell();
    }

    /** @returns {string} the view a nav item should light up for */
    function navKey() {
      const v = Hub.state.route ? Hub.state.route.v : 'home';
      if (v === 'sponsor') return 'pipeline';
      if (v === 'meeting') return 'team';
      return v;
    }

    /** Redraws the frame's moving parts: nav highlight, title, sync pill. */
    function updateShell() {
      if (!shell) return;
      const me = Hub.state.me;
      const canEdit = Hub.canEdit();
      const current = navKey();
      const overdueMine = me && canEdit ? Hub.myOverdueCount() : 0;

      // Sidebar (desktop)
      fill(shell.sidebar, 
        h(
          'div',
          { class: 'sidebar-brand' },
          h('span', { class: 'brand-mark', 'aria-hidden': 'true' }, 'PH'),
          h('div', null, 'Sponsorship Hub', h('small', null, 'Project Hastings @ UBC'))
        ),
        canEdit
          ? h(
              'button',
              { type: 'button', class: 'btn btn-block', style: 'margin-bottom:12px', onClick: function () { Hub.openLog({}); } },
              icon('plus'),
              'Log a touch'
            )
          : null,
        NAV.filter(function (n) {
          return n.v !== 'settings' || Hub.isVp() || true;
        }).map(function (n) {
          return h(
            'button',
            {
              type: 'button',
              class: 'nav-item',
              'aria-current': current === n.v ? 'page' : null,
              onClick: function () {
                go(n.v);
              },
            },
            icon(n.icon),
            n.label,
            n.v === 'my' && overdueMine ? h('span', { class: 'count', 'aria-label': overdueMine + ' overdue' }, overdueMine) : null
          );
        }),
        h(
          'div',
          { class: 'sidebar-foot' },
          h('button', { type: 'button', class: 'nav-item', onClick: Hub.cycleTheme }, icon('moon'), 'Theme: ' + Hub.themeLabel()),
          Hub.signOut ? h('button', { type: 'button', class: 'nav-item', onClick: Hub.signOut }, icon('close'), 'Sign out') : null,
          me
            ? h(
                'div',
                { class: 'hstack', style: 'padding:8px 6px 0' },
                h('span', { class: 'avatar' }, initials(me.full_name)),
                h('div', { class: 'grow' }, h('div', { class: 'truncate', style: 'font-weight:600' }, me.full_name), h('div', { class: 'muted small' }, Rules.ROLE_LABEL[me.role] || me.role))
              )

    <script>
  /*
   * Data and sync (docs/PLAN.md §6.5, §6.6): boot from the data inlined in the page, look rows up,
   * poll for changes, resync fully every ten minutes, and save optimistically through one serial
   * queue. The only client file that touches the clock's "now" or browser storage.
   */
  (function () {
    'use strict';
    const Hub = window.Hub;
    const h = function () {
      return Hub.h.apply(null, arguments);
    };

    /** Every 30 s while the page is visible, so a colleague's change shows within 30 s (spec §15). */

    const POLL_IDLE_MS = 30000;
    const RESYNC_MS = 10 * 60000;
    const ACTIVE_WINDOW_MS = 5 * 60000;
    const PENDING_KEY = 'hub.pending.v1';

    const state = (Hub.state = {
      me: null,
      today: null,
      version: null,
      sheetId: '',

      serverTime: null,

      return new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args);
      });
    }

    /** @returns {string} a new row id, made here so a retried save is recognised (PLAN A27) */
    function uuid() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      bytes[6] = (bytes[6] & 0x0f) | 0x40;
      bytes[8] = (bytes[8] & 0x3f) | 0x80;
      const hex = Array.prototype.map.call(bytes, function (b) {
        return (b + 256).toString(16).slice(1);

      return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);

    // ---- Local preferences (browser storage: conveniences only) ------------------------------

    /** @param {string} key @param {*} fallback @returns {*} */
    function pref(key, fallback) {

      } catch (err) {

    function activitiesFor(sponsorId) {

        const ka = (a.happened_on || '') + (a.created_at || '');
        const kb = (b.happened_on || '') + (b.created_at || '');

    /** @param {string} sponsorId @returns {Object[]} */

      return groupBy('SponsorEvents', 'sponsor_id')[sponsorId] || [];
    }

    /** @param {string} eventId @returns {Object[]} */
    function linksForEvent(eventId) {
      return groupBy('SponsorEvents', 'event_id')[eventId] || [];
    }

    /** @param {string} eventId @returns {Object[]} */

      return groupBy('EventNeeds', 'event_id')[eventId] || [];

    /** @param {string} sponsorId @returns {Object[]} the sponsor's events, soonest first */

        .map(function (l) {

        .filter(function (e) {

          seen[e.id] = true;

      // Keep rows still waiting to be saved.
      if (state.data) {
        Object.keys(state.data).forEach(function (tab) {
          Object.values(state.data[tab]).forEach(function (row) {
            if (row._local) (data[tab] = data[tab] || {})[row[keyOf(tab)]] = row;
          });
        });
      }
      state.data = data;
      if (late) {
        mergeRows(late.rows);
        removeRows(late.removed);
      }
      Object.keys(overlays).forEach(function (key) {
        const tab = key.slice(0, key.indexOf(':'));
        const id = key.slice(key.indexOf(':') + 1);
        const row = data[tab] && data[tab][id];
        if (row) {
          serverRows[key] = row;
          data[tab][id] = withOverlay(tab, row);
        }
      });
      state.serverTime = snap.serverTime;
      state.syncedAt = Date.now();
      state.syncError = null;
      bump();
      applyTheme();
    }

    // ---- Polling --------------------------------------------------------------------------

    let lastPoll = 0;
    let lastResync = 0;
    let lastActivity = Date.now();

    /** Fetches what changed since the last sync. */
    function poll() {
      if (!state.data || state.syncBusy || !state.serverTime) return Promise.resolve();
      if (document.visibilityState === 'hidden') return Promise.resolve();
      if (Date.now() - lastResync > RESYNC_MS && !queue.length && !inFlight && !failed.length) return resync();
      state.syncBusy = true;
      lastPoll = Date.now();
      return call('getChanges', state.serverTime)
        .then(
          function (res) {
            const changed = Object.keys(res.changes || {}).some(function (t) {
              return res.changes[t].length;
            });
            mergeRows(res.changes);
            state.serverTime = res.serverTime;
            state.syncedAt = Date.now();
            state.syncError = null;
            if (changed) {
              bump();
              Hub.render();
            }
          },
          function (err) {
            state.syncError = messageOf(err);
          }
        )
        .then(function () {
          state.syncBusy = false;
          Hub.refreshPill();
        });
    }

    /** Rows that saves returned while a full resync was on its way (see applySnapshot). */
    let duringResync = null;

    /** Reloads everything: picks up rows deleted in the Sheet (DECISIONS 36, PLAN A24). */
    function resync() {
      if (!state.data || state.syncBusy) return Promise.resolve();
      state.syncBusy = true;
      lastPoll = lastResync = Date.now();
      duringResync = { rows: {}, removed: {} };
      Hub.refreshPill();
      return call('getSnapshot')
        .then(
          function (snap) {
            const late = duringResync;
            duringResync = null;
            state.me = snap.me;
            state.sheetId = snap.sheetId || state.sheetId;
            applySnapshot(snap, late);
            Hub.render();
          },
          function (err) {
            duringResync = null;
            state.syncError = messageOf(err);
          }
        )
        .then(function () {
          state.syncBusy = false;
          Hub.refreshPill();
        });
    }

    /** The pill was tapped: retry what failed, or sync now (only what changed while saving). */
    function syncNow() {
      if (failed.length) return retryFailed();
      if (queue.length || inFlight) return poll();
      return resync();
    }

    function startTimers() {
      lastPoll = lastResync = Date.now();
      ['pointerdown', 'keydown'].forEach(function (type) {
        document.addEventListener(
          type,
          function () {
            lastActivity = Date.now();
          },
          { passive: true }
        );
      });
      setInterval(function () {
        if (document.visibilityState === 'hidden') return;
        const active = Date.now() - lastActivity < ACTIVE_WINDOW_MS;
        if (Date.now() - lastPoll >= (active ? POLL_ACTIVE_MS : POLL_IDLE_MS)) poll();
        if (state.today !== today()) Hub.render();
        Hub.refreshPill();
      }, 5000);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          retryFailed();
          poll();
        }
      });
      window.addEventListener('focus', function () {
        retryFailed();
        if (Date.now() - lastPoll > 3000) poll();
      });
      window.addEventListener('online', retryFailed);
      window.addEventListener('beforeunload', function (e) {
        if (queue.length || inFlight || failed.length) {
          e.preventDefault();
          e.returnValue = '';
        }
      });
      if (window.matchMedia) {
        try {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
        } catch (err) {
          // older Safari
        }
      }
    }

    // ---- Versions: whose change came first (spec §5) ----------------------------------------

    /** Per row, the versions this browser's own saves replaced: old updated_at -> new. */
    const ownSaves = {};

    /** @returns {string} the server's updated_at for a row as this browser knows it ('' if none) */
    function versionOf(tab, id) {
