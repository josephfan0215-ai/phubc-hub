      const row = serverRows[tab + ':' + id] || byId(tab, id);
      return row ? String(row.updated_at || '') : '';
    }

    /**
     * The version to send with a save that started when the person saw `seen` (read it when the
     * editor opens). Their own saves since then are followed, because they changed it, not someone
     * else; a colleague's change that arrived by poll is not, so the server answers with a
     * conflict instead of the save silently overwriting it.
     * @param {string} tab
     * @param {string} id
     * @param {string} [seen] left out: the version known now
     * @returns {string}
     */
    function sendVersion(tab, id, seen) {
      const key = tab + ':' + id;
      // '' : the row was still being added by this browser when the edit began.
      let v = seen === undefined || seen === null || seen === '' ? versionOf(tab, id) : String(seen);
      const chain = ownSaves[key] || {};
      for (let i = 0; i < 100 && chain[v]; i++) v = chain[v];
      return v;
    }

    /**
     * After a save: the server says which version each changed row had just before this save
     * wrote it (result.replaced), so this browser can follow its own changes and only its own.
     */
    function noteOwnSave(result) {
      if (!result.replaced || !result.rows) return;
      Object.keys(result.rows).forEach(function (tab) {
        (result.rows[tab] || []).forEach(function (row) {
          const key = tab + ':' + row[keyOf(tab)];
          if (!Object.prototype.hasOwnProperty.call(result.replaced, key)) return;
          const before = String(result.replaced[key] || '');
          if (before && row.updated_at && before !== String(row.updated_at)) {
            (ownSaves[key] = ownSaves[key] || {})[before] = String(row.updated_at);
          }
        });
      });
    }

    // ---- Saving: optimistic, one call at a time (PLAN §6.6) --------------------------------

    let opSeq = 0;
    const queue = [];
    let inFlight = null;
    const failed = [];
    let savedAt = 0;

    /**
     * Saves something. The change shows at once; the server call waits its turn.
     * @param {Object} spec
     * @param {Function} spec.send () => Promise; read versions (updated_at) here, at send time
     * @param {Array<{tab: string, id: string, patch: Object}>} [spec.changes] shown at once
     * @param {Array<{tab: string, row: Object}>} [spec.inserts] rows shown at once
     * @param {Array<{tab: string, id: string}>} [spec.removes] rows hidden at once
     * @param {number} [spec.hold] ms to wait before sending (the Undo window)
     * @param {Function} [spec.done] (result) after the server agreed
     * @param {Function} [spec.failed] (message) after the server refused (the change is undone)
     * @param {Function} [spec.onConflict] (row) someone saved first; default: say so
     * @param {string} [spec.what] what is being saved, for messages ("Loafe Cafe")
     * @param {{fn: string, args: Array}} [spec.persist] keep in this browser until saved (touches)
     * @returns {{op: Object, cancel: function(): boolean, release: Function, promise: Promise}}
     */
    function save(spec) {
      const op = Object.assign({ id: ++opSeq, retries: 0, state: 'queued', removed: [] }, spec);
      op.promise = new Promise(function (resolve, reject) {
        op.resolve = resolve;
        op.reject = reject;
      });
      op.promise.catch(function () {});
      applyLocal(op);
      if (op.hold) {
        op.releaseAt = Date.now() + op.hold;
        op.holdTimer = setTimeout(pump, op.hold + 20);
      }
      queue.push(op);
      // After the push, so the new save is in what is kept (closing the app during Undo keeps it).
      if (op.persist) persistPending();
      bump();
      Hub.render();
      pump();
      Hub.refreshPill();
      return {
        op: op,
        cancel: function () {
          return cancel(op);
        },
        release: function () {
          op.releaseAt = 0;
          clearTimeout(op.holdTimer);
          pump();
        },
        promise: op.promise,
      };
    }

    function applyLocal(op) {
      (op.changes || []).forEach(function (c) {
        const key = c.tab + ':' + c.id;
        const row = byId(c.tab, c.id);
        if (!row) return;
        if (!serverRows[key]) serverRows[key] = row;
        (overlays[key] = overlays[key] || []).push({ op: op.id, patch: c.patch });
        state.data[c.tab][c.id] = withOverlay(c.tab, serverRows[key]);
      });
      (op.inserts || []).forEach(function (ins) {
        const map = state.data[ins.tab] || (state.data[ins.tab] = {});
        map[ins.row[keyOf(ins.tab)]] = Object.assign({ _local: true }, ins.row);
      });
      (op.removes || []).forEach(function (r) {
        const row = byId(r.tab, r.id);
        if (row) {
          op.removed.push({ tab: r.tab, row: row });
          delete state.data[r.tab][r.id];
        }
      });
    }

    /** Takes an op's pending change off its rows, leaving the server's version and any other pending change. */
    function dropOverlay(op) {
      (op.changes || []).forEach(function (c) {
        const key = c.tab + ':' + c.id;
        const list = overlays[key];
        if (!list) return;
        overlays[key] = list.filter(function (o) {
          return o.op !== op.id;
        });
        const base = serverRows[key] || byId(c.tab, c.id);
        if (!overlays[key].length) {
          delete overlays[key];
          delete serverRows[key];
        }
        if (base && state.data[c.tab]) state.data[c.tab][c.id] = withOverlay(c.tab, base);
      });
    }

    function cancel(op) {
      const i = queue.indexOf(op);
      if (i === -1 || op.state !== 'queued') return false;
      queue.splice(i, 1);
      clearTimeout(op.holdTimer);
      op.state = 'cancelled';
      revertRows(op);
      if (op.persist) persistPending();
      bump();
      Hub.render();
      Hub.refreshPill();
      op.reject(new Error('cancelled'));
      return true;
    }

    /** Undoes an op whose server call never happened or was refused. */
    function revertRows(op) {
      dropOverlay(op);
      (op.inserts || []).forEach(function (ins) {
        const id = ins.row[keyOf(ins.tab)];
        const row = byId(ins.tab, id);
        if (row && row._local) delete state.data[ins.tab][id];
      });
      op.removed.forEach(function (r) {
        state.data[r.tab][r.row[keyOf(r.tab)]] = r.row;
      });
    }

    function pump() {
      if (inFlight) return;
      const op = queue[0];
      if (!op) {
        Hub.refreshPill();
        return;
      }
      if (op.releaseAt && Date.now() < op.releaseAt) return;
      queue.shift();
      inFlight = op;
      op.state = 'sending';
      Hub.refreshPill();
      let p;
      try {
        p = op.send();
      } catch (err) {
        p = Promise.reject(err);
      }
      Promise.resolve(p)
        .then(
          function (res) {
            onSaved(op, res);
          },
          function (err) {
            onFailed(op, err);
          }
        )
        .then(function () {
          inFlight = null;
          Hub.refreshPill();
          pump();
        });
    }

    function onSaved(op, res) {
      op.state = 'done';
      dropOverlay(op);
      const result = res || {};
      noteOwnSave(result);
      if (result.rows) mergeRows(result.rows, true);
      if (result.removed) removeRows(result.removed);
      if (duringResync) {
        [['rows', result.rows], ['removed', result.removed]].forEach(function (pair) {
          Object.keys(pair[1] || {}).forEach(function (tab) {
            const list = duringResync[pair[0]][tab] || (duringResync[pair[0]][tab] = []);
            list.push.apply(list, pair[1][tab] || []);
          });
        });
      }
      (op.inserts || []).forEach(function (ins) {
        const row = byId(ins.tab, ins.row[keyOf(ins.tab)]);
        if (row && row._local) {
          const copy = Object.assign({}, row);
          delete copy._local;
          state.data[ins.tab][ins.row[keyOf(ins.tab)]] = copy;
        }
      });
      if (result.conflict && result.row) {
        const tab = op.conflictTab || (op.changes && op.changes[0] && op.changes[0].tab) || 'Sponsors';
        mergeRows({ [tab]: [result.row] }, true);
        if (op.onConflict) op.onConflict(result.row);
        else {
          Hub.toast({
            error: true,
            text: 'Someone updated ' + (op.what || 'this') + ' just before you. Your change was not saved; the latest is showing.',
            action: op.reapply ? { label: 'Reapply', fn: op.reapply } : null,
            ms: 10000,
          });
        }
      }
      savedAt = Date.now();
      if (op.persist) persistPending();
      bump();
      if (op.done) {
        try {
          op.done(result);
        } catch (err) {
          console.error(err);
        }
      }
      op.resolve(result);
      Hub.render();
    }

    function onFailed(op, err) {
      const msg = messageOf(err);
      if (/^Already saved/.test(msg)) {
        onSaved(op, {});
        return;
      }
      const refused = /^(Not saved|Not authorised|Not found)/.test(msg) || op.retry === false;
      if (refused) {
        // Not 'failed': a refused save is never kept or tried again.
        op.state = 'refused';
        revertRows(op);
        if (op.persist) persistPending();
        bump();
        Hub.toast({ error: true, text: msg.replace(/^Not saved\. /, 'Not saved: '), ms: 9000 });
        if (op.failed) op.failed(msg);
        op.reject(err);
        Hub.render();
        return;
      }
      op.retries++;
      op.lastError = msg;
      if (op.retries <= 2) {
        op.releaseAt = Date.now() + 2000 * op.retries;
        op.state = 'queued';
        queue.unshift(op);
        setTimeout(pump, 2000 * op.retries + 20);
        return;
      }
      op.state = 'failed';
      failed.push(op);
      if (op.persist) persistPending();
      Hub.refreshPill();
    }

    /** Tries again everything that could not be saved (pill tap, focus, back online). */
    function retryFailed() {
      if (!failed.length) return Promise.resolve();
      const again = failed.splice(0, failed.length);
      again.forEach(function (op) {
        op.retries = 0;
        op.releaseAt = 0;
        op.state = 'queued';
      });
      queue.unshift.apply(queue, again);
      pump();
      Hub.refreshPill();
      return Promise.resolve();
    }

    /** Touches waiting to be saved survive closing the tab (PLAN §6.6 step 6). */
    function persistPending() {
      // The op being sent counts only while it is being sent: once it fails it is in `failed`,
      // and once it is refused it is dropped.
      const waiting = queue
        .concat(inFlight && inFlight.state === 'sending' ? [inFlight] : [])
        .concat(failed)
        .filter(function (op) {
          return op.persist && (op.state === 'queued' || op.state === 'sending' || op.state === 'failed');
        })
        .map(function (op) {
          return { fn: op.persist.fn, args: op.persist.args, what: op.what || '', inserts: op.persist.inserts || op.inserts || [] };
        });
      setPref(PENDING_KEY.replace(/^hub\./, ''), waiting.length ? waiting : null);
    }

    /** Sends the touches a previous visit could not save. The ids make a repeat harmless. */
    function restorePending() {
      const waiting = pref(PENDING_KEY.replace(/^hub\./, ''), null);
      if (!Array.isArray(waiting) || !waiting.length) return;
      waiting.forEach(function (p) {
        save({
          what: p.what,
          inserts: (p.inserts || []).filter(function (ins) {
            return !byId(ins.tab, ins.row.id);
          }),
          persist: { fn: p.fn, args: p.args },
          send: function () {
            return call.apply(null, [p.fn].concat(p.args));
          },
        });
      });
    }

    /** @returns {{state: string, text: string}} for the pill in the top bar */
    function syncStatus() {
      if (failed.length) {
        return { state: 'error', text: (failed.length === 1 ? '1 change' : failed.length + ' changes') + ' not saved · Retry' };
      }
      if (queue.length || inFlight) return { state: 'saving', text: 'Saving…' };
      if (Date.now() - savedAt < 1500) return { state: 'ok', text: 'Saved' };
      if (state.syncError && !state.syncedAt) return { state: 'error', text: "Couldn't sync · Retry" };
      if (state.syncError) return { state: 'error', text: 'Offline · Retry' };
      if (!state.syncedAt) return { state: 'saving', text: 'Loading…' };
      const s = Math.max(0, Math.round((Date.now() - state.syncedAt) / 1000));
      return { state: 'ok', text: 'Synced ' + (s < 5 ? 'just now' : s < 90 ? s + ' s ago' : Math.round(s / 60) + ' min ago') };
    }

    // ---- Boot ---------------------------------------------------------------------------------

    function bootError(message) {
      const root = document.getElementById('app');
      Hub.fill(root, 
        h(
          'main',
          { class: 'page' },
          h(
            'div',
            { class: 'banner error', role: 'alert' },
            h('div', { class: 'grow' }, h('strong', null, "Couldn't load the Hub. "), message),
            h(
              'button',
              {
                type: 'button',
                class: 'btn btn-sm',
                onClick: function () {
                  start();
                },
              },
              'Try again'
            )
          )
        )
      );
    }

    function ready() {
      applyTheme();
      Hub.renderShell();
      Hub.startRouter(function () {
        Hub.render(true);
        restorePending();
      });
      startTimers();
    }

    /** Starts the app from the data in the page, or fetches it when the page came without. */
    function start() {
      applyTheme();
      let boot = null;
      const el = document.getElementById('boot');
      try {
        boot = el && el.textContent.trim() ? JSON.parse(el.textContent) : null;
      } catch (err) {
        boot = null;
      }
      if (boot && boot.me && boot.data) {
        applyBoot(boot);
        ready();
        return;
      }
      call('getSnapshot').then(
        function (snap) {
          applyBoot(snap);
          ready();
        },
        function (err) {
          bootError(messageOf(err));
        }
      );
    }

    Object.assign(Hub, {
      call: call,
      messageOf: messageOf,
      uuid: uuid,
      pref: pref,
      setPref: setPref,
      sessionFlag: sessionFlag,
      setSessionFlag: setSessionFlag,
      applyTheme: applyTheme,
      cycleTheme: cycleTheme,
      themeLabel: themeLabel,
      rows: rows,
      byId: byId,
      settings: settings,
      activeMembers: activeMembers,
      memberName: memberName,
      activitiesFor: activitiesFor,
      linksFor: linksFor,
      linksForEvent: linksForEvent,
      needsFor: needsFor,
      eventsFor: eventsFor,
      warmIds: warmIds,
      statusData: statusData,
      leadVp: leadVp,
      canEdit: canEdit,
      isVp: isVp,
      myOverdueCount: myOverdueCount,
      today: today,
      sheetUrl: sheetUrl,
      memoize: memoize,
      bump: bump,
      mergeRows: mergeRows,
      versionOf: versionOf,
      sendVersion: sendVersion,
      save: save,
      retryFailed: retryFailed,
      syncStatus: syncStatus,
      syncNow: syncNow,
      poll: poll,
      resync: resync,
      start: start,
      now: function () {
        return Date.now();
      },
      nowIso: function () {
        return new Date().toISOString();
      },
      /** @returns {string} when the data was last synced, e.g. "9:02" (device time) */
      syncedAtLabel: function () {
        if (!state.syncedAt) return '';
        return new Date(state.syncedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      },
      /** Copies a link that opens a view directly (PLAN A17). */
      copyDeepLink: function (v, id) {
        if (!state.appUrl) {
          Hub.toast({ error: true, text: 'The link is not available here.' });
          return;
        }
        Hub.copyAndTell(state.appUrl + '?v=' + encodeURIComponent(v) + (id ? '&id=' + encodeURIComponent(id) : ''), 'Link');
      },
    });
  })();
</script>

    <script>
  /*
   * Rows shared by Home, My work, Pipeline and meeting mode (docs/PLAN.md §9.4: one component per
   * concept, so the lists never disagree or drift).
   */
  (function () {
    'use strict';
    const Hub = window.Hub;
    const h = Hub.h;

    /**
     * One work item (a sponsor's next action or a task) with Done and Later.
     * @param {Object} item a Rules WorkItem
     * @param {{showOwner?: boolean, compact?: boolean}} [opts]
     * @returns {HTMLElement} an <li>
     */
    function workRow(item, opts) {
      const o = opts || {};
      const canEdit = Hub.canEdit();
      const isTask = item.type === 'task';
      const broken = !isTask && Rules.lacksNextAction(item.row);
      const done = isTask && item.row.status === 'done';
      const actions = [];
      if (canEdit && !done && !isTask && !broken && /email|follow|send|reply|re-contact/i.test(item.row.next_action || '')) {
        actions.push(
          h(
            'button',
            {
              type: 'button',
              class: 'icon-btn',
              title: 'Copy email',
              'aria-label': 'Copy an email to ' + item.title,
              onClick: function (e) {
                e.stopPropagation();
                Hub.openCopyEmail(item.id);
              },
            },
            Hub.icon('email')
          )
        );
      }
      if (canEdit && !done) {
        if (broken) {
          actions.push(btn('Set next', function () { Hub.editNext(item.id); }, 'Set the next action for ' + item.title));
        } else {
          actions.push(
            btn('Done', function () {
              if (isTask) Hub.completeTask(item.id);
              else Hub.openLog({ sponsorId: item.id, kind: Rules.guessKind(item.row.next_action), fromDone: true });
            }, (isTask ? 'Mark done: ' : 'Log what you did for ') + item.title)
          );
          actions.push(
            btn('Later', function () {
              if (isTask) Hub.laterTask(item.id);
              else Hub.laterSponsor(item.id);
            }, 'Reschedule ' + item.title, true)
          );
        }
      }
      const nudge =
        canEdit && !isTask && Rules.needsNurtureNudge(item.row, Hub.activitiesFor(item.id)) && !Hub.sessionFlag('prompt:' + item.id + ':nurture');
      const fromMeeting = isTask && item.row.source === 'meeting' && Rules.daysBetween(String(item.row.created_at).slice(0, 10), Hub.today()) <= 7;
      return h(
        'li',
        {
          class: 'row clickable' + (done ? ' done' : ''),
          onClick: function () {
            if (isTask) openTask(item.id);
            else Hub.openSponsor(item.id);
          },
        },
        o.showOwner ? Hub.avatar(item.owner_id) : null,
        h(
          'div',
          { class: 'row-main' },
          h('div', { class: 'row-title' }, isTask ? h('span', { class: 'muted', style: 'font-weight:500' }, 'Task · ') : null, item.title),
          h(
            'div',
            { class: 'row-meta' },
            item.due || broken ? Hub.dueText(item.due, { empty: 'No next action' }) : h('span', { class: 'due' }, 'No date'),
            fromMeeting ? h('span', { class: 'chip outline' }, 'From the meeting') : null,
            h('span', { class: 'row-sub' }, broken ? '' : item.detail)
          ),
          nudge
            ? h(
                'div',
                { class: 'note-inline', style: 'margin-top:6px' },
                h('span', { class: 'grow' }, 'No reply after 3 touches.'),
                h(
                  'button',
                  {
                    type: 'button',
                    class: 'btn btn-secondary btn-xs',
                    onClick: function (e) {
                      e.stopPropagation();
                      Hub.changeStage(item.id, 'nurture', { nurture_until: Rules.addDays(Hub.today(), 90) });
                    },
                  },
                  'Move to Nurture'
                ),
                h(
                  'button',
                  {
                    type: 'button',
                    class: 'btn btn-ghost btn-xs',
                    onClick: function (e) {
                      e.stopPropagation();
                      Hub.setSessionFlag('prompt:' + item.id + ':nurture');
                      Hub.render();
                    },
                  },
                  'Keep trying'
                )
              )
            : null
        ),
        actions.length ? h('div', { class: 'row-actions' }, actions) : null
      );
    }

    /** @returns {HTMLElement} a small row button that does not open the row */
    function btn(label, fn, aria, secondary) {
      return h(
        'button',
        {
          type: 'button',
          class: 'btn btn-sm ' + (secondary ? 'btn-ghost' : 'btn-secondary'),
          'aria-label': aria || label,
          onClick: function (e) {
            e.stopPropagation();
            fn();
          },
        },
        label
      );
    }

    /**
     * A sponsor as a two-line row (phone lists, Hot leads, Revisit).
     * @param {Object} s
     * @param {{right?: Node, sub?: string, actions?: Node[]}} [opts]
     * @returns {HTMLElement}
     */
    function sponsorRow(s, opts) {
      const o = opts || {};
      return h(
        'li',
        {
          class: 'row clickable',
          onClick: function () {
            Hub.openSponsor(s.id);
          },
        },
        h(
          'div',
          { class: 'row-main' },
          h('div', { class: 'hstack' }, h('span', { class: 'row-title' }, s.name), Rules.isWarm(s) ? h('span', { class: 'chip warm' }, 'warm') : null),
          h(
            'div',
            { class: 'row-meta' },
            Hub.stageChip(s.stage, Hub.canEdit() ? function () { Hub.openStage(s.id); } : null),
            h('span', { class: 'row-sub' }, o.sub !== undefined ? o.sub : s.next_action || '')
          )
        ),
        o.right || h('div', { class: 'hstack', style: 'flex:none' }, Rules.requiresNextAction(s.stage) ? Hub.dueText(s.next_action_due) : null, Hub.avatar(s.owner_id)),
        o.actions ? h('div', { class: 'row-actions' }, o.actions) : null
      );
    }

    /** A task in a small sheet: what, when, who, and Done / Later. */
    function openTask(id) {
      const t = Hub.byId('Tasks', id);
      if (!t) return;
      const sponsor = t.sponsor_id ? Hub.byId('Sponsors', t.sponsor_id) : null;
      const event = t.event_id ? Hub.byId('Events', t.event_id) : null;
      Hub.openSheet({
        title: 'Task',
        size: 'small',
        render: function (body) {
          Hub.add(body, 
            h('p', { style: 'font-size:17px;font-weight:600' }, t.title),
            h(
              'dl',
              { class: 'kv' },
              h('dt', null, 'Due'),
              h('dd', null, t.due_on ? Hub.dueText(t.due_on, { long: true }) : 'No date'),
              h('dt', null, 'Owner'),
              h('dd', null, Hub.memberName(t.owner_id) || 'Unassigned'),
              h('dt', null, 'From'),
              h('dd', null, { meeting: 'The weekly meeting', exec: 'The exec team', manual: 'Added by hand', system: 'The Hub' }[t.source] || t.source),
              sponsor ? [h('dt', null, 'Sponsor'), h('dd', null, sponsor.name)] : null,
              event ? [h('dt', null, 'Event'), h('dd', null, event.name)] : null,
              h('dt', null, 'Status'),
              h('dd', null, t.status === 'done' ? 'Done' : 'Open')
            )
          );
        },
        foot: function (f, api) {
          if (!Hub.canEdit()) return;
          if (sponsor) {
            Hub.add(f, h('button', { type: 'button', class: 'btn btn-secondary', onClick: function () { api.close(); Hub.openSponsor(sponsor.id); } }, 'Open sponsor'));
          }
          if (t.status === 'done') {
            Hub.add(f, h('button', { type: 'button', class: 'btn btn-primary-wide', onClick: function () { api.close(); Hub.completeTask(id, false); } }, 'Reopen'));
          } else {
            Hub.add(f, 
              h('button', { type: 'button', class: 'btn btn-secondary', onClick: function () { api.close(); Hub.laterTask(id); } }, 'Later'),
              h('button', { type: 'button', class: 'btn btn-primary-wide', onClick: function () { api.close(); Hub.completeTask(id); } }, 'Done')
            );
          }
        },
      });
    }

    /** @param {Object} s @returns {HTMLElement[]} chips for a sponsor's events (two, then "+n") */
    function eventChips(s) {
      const events = Hub.eventsFor(s.id);
      const out = events.slice(0, 2).map(function (e) {
        return h('span', { class: 'chip event', title: e.name }, shortEventName(e.name));
      });
      if (events.length > 2) out.push(h('span', { class: 'chip outline' }, '+' + (events.length - 2)));
      return out;
    }

    /** @param {string} name @returns {string} the event name without the bracketed detail */
    function shortEventName(name) {
      return String(name || '').replace(/\s*\(.*\)\s*$/, '');
    }

    /**
     * A list with a heading, or an empty state.
     * @param {string} title
     * @param {HTMLElement[]} items <li> rows
     * @param {{empty?: string, count?: *, actions?: Node[], id?: string}} [opts]
     * @returns {HTMLElement}
     */
    function listSection(title, items, opts) {
      const o = opts || {};
      return h(
        'section',
        { class: 'section', id: o.id || null },
        Hub.sectionHead(title, o.count !== undefined ? o.count : null, o.actions || []),
        items.length ? h('ul', { class: 'list' }, items) : h('div', { class: 'card' }, Hub.emptyState(o.empty || 'Nothing here.', o.emptyButton, o.emptyAction))
      );
    }

    /** "Show all N" for a capped list. */
    function showAll(key, total, cap) {
      if (total <= cap || Hub.state.ui[key]) return null;
      return h(
        'button',
        {
          type: 'button',
          class: 'btn btn-ghost btn-sm',
          style: 'margin-top:6px',
          onClick: function () {
            Hub.state.ui[key] = true;
            Hub.render();
          },
        },
        'Show all ' + total
      );
    }

    Object.assign(Hub, {
      workRow: workRow,
      rowButton: btn,
      sponsorRow: sponsorRow,
      openTask: openTask,
      eventChips: eventChips,
      shortEventName: shortEventName,
      listSection: listSection,
      showAll: showAll,
    });
  })();
</script>

    <script>
  /*
   * Log a touch (docs/PLAN.md §10.2, §10.3) and Add sponsor (§10.5). The touch is the behaviour
   * everything else depends on: three taps and one sentence, the next step set in the same sheet,
   * saved optimistically with Undo, then at most one question about the stage.
   */
  (function () {
    'use strict';
    const Hub = window.Hub;
    const h = Hub.h;

    const KINDS = ['email', 'call', 'walk_in', 'follow_up', 'reply', 'meeting'];
    const MORE_KINDS = ['commitment', 'note'];
    const PLACEHOLDER = {
      email: 'What did you offer or ask?',
      call: "Who did you speak to, and what's next?",
      walk_in: 'Who did you talk to, what did you leave, what is next?',
      follow_up: 'What new thing did you add?',
      reply: 'What did they say?',
      meeting: 'What did you agree?',
      commitment: 'What did they commit to?',
      note: 'What should the team know?',
    };

    /** Remembers a sponsor as the last one viewed or logged, for the Log sheet's chips. */
    function rememberSponsor(id) {
      if (!id) return;
      Hub.setPref('lastSponsorId', id);
      const recent = (Hub.pref('recentSponsorIds', []) || []).filter(function (x) {
        return x !== id;
      });
      recent.unshift(id);
      Hub.setPref('recentSponsorIds', recent.slice(0, 8));
    }

    /** @param {Object} s a sponsor @param {Function} onPick @returns {HTMLElement} one search result */
    function sponsorResult(s, onPick) {
      return h(
        'li',
        null,
        h(
          'button',
          { type: 'button', onClick: function () { onPick(s.id); } },
          Hub.avatar(s.owner_id),
          h('span', { class: 'grow' }, h('span', { class: 'row-title', style: 'display:block' }, s.name), h('span', { class: 'row-sub', style: 'display:block' }, s.next_action || Rules.CATEGORY_LABEL[s.category] || '')),
          Hub.stageChip(s.stage)
        )
      );
    }

    /** Sponsors for the chips above the search: last viewed, mine due soon, recently logged. */
    function suggestions() {
      const me = Hub.state.me;
      const out = [];
      const seen = {};
      function add(s, why) {
        if (!s || seen[s.id] || s.archived === true) return;
        seen[s.id] = true;
        out.push({ sponsor: s, why: why });
      }
      add(Hub.byId('Sponsors', Hub.pref('lastSponsorId', '')), 'Last viewed');
      Rules.myQueue(me.id, { sponsors: Hub.rows('Sponsors'), tasks: [] }, Hub.today())
        .filter(function (i) {
          return i.group !== 'later';
        })
        .slice(0, 5)
        .forEach(function (i) {
          add(i.row, 'Due ' + (Rules.dueLabel(i.due, Hub.today()) || 'now'));
        });
      const mine = Hub.rows('Activity')
        .filter(function (a) {
          return a.member_id === me.id && a.kind !== 'stage_change';
        })
        .sort(function (a, b) {
          return String(b.created_at || '') < String(a.created_at || '') ? -1 : 1;
        });
      (Hub.pref('recentSponsorIds', []) || []).forEach(function (id) {
        add(Hub.byId('Sponsors', id), 'Recent');
      });
      mine.forEach(function (a) {
        if (out.length < 10) add(Hub.byId('Sponsors', a.sponsor_id), 'Recent');
      });
      return out.slice(0, 9);
    }

    /**
     * Opens the Log sheet.
     * @param {{sponsorId?: string, kind?: string, summary?: string, fromDone?: boolean, backdate?: boolean, onLogged?: Function}} [opts]
     */
    function openLog(opts) {
      const o = opts || {};
      if (!Hub.canEdit()) return;
      const me = Hub.state.me;
      const today = Hub.today();
      const st = {
        sponsorId: o.sponsorId && Hub.byId('Sponsors', o.sponsorId) ? o.sponsorId : null,
        query: '',
        kind: o.kind || null,
        error: o.error || '',
        summary: o.summary || '',
        happenedOn: today,
        moreKinds: MORE_KINDS.indexOf(o.kind) !== -1,
        nextOpen: !!o.fromDone,
        nextTouched: false,
        nextText: '',
        nextDue: '',
        memberId: me.id,
        problem: '',
        seen: undefined,
      };
      /** Follow-up for a sponsor already contacted; otherwise the kind used last time. */
      function defaultKind() {
        if (o.kind) return;
        const s = st.sponsorId ? Hub.byId('Sponsors', st.sponsorId) : null;
        if (s && (s.stage === 'contacted' || s.stage === 'follow_up')) st.kind = 'follow_up';
        else if (!st.kind) st.kind = Hub.pref('lastKind', null);
        // A remembered "note" or "commitment" lives under More: open it so the choice shows.
        if (MORE_KINDS.indexOf(st.kind) !== -1) st.moreKinds = true;
      }
      defaultKind();

      function sponsor() {
        return st.sponsorId ? Hub.byId('Sponsors', st.sponsorId) : null;
      }

      /** Works out the Next block's proposal for the chosen sponsor and kind. */
      function proposeNext() {
        const s = sponsor();
        if (!s || st.nextTouched) return;
        // The proposal is based on this version: a change by someone after it is a conflict.
        st.seen = Hub.versionOf('Sponsors', s.id);
        const acts = Hub.activitiesFor(s.id).concat(st.kind ? [{ kind: st.kind, happened_on: st.happenedOn }] : []);
        const suggestion = st.kind ? Rules.nextActionAfterTouch(s, st.kind, acts, today, Hub.settings().follow_up_days) : null;
        st.nextText = suggestion ? suggestion.next_action : s.next_action || '';
        st.nextDue = suggestion ? suggestion.next_action_due : s.next_action_due || '';
        const overdue = !Rules.isIsoDate(s.next_action_due) || s.next_action_due < today || !s.next_action;
        if (overdue || o.fromDone) st.nextOpen = true;
        if (st.nextOpen && (!Rules.isIsoDate(st.nextDue) || st.nextDue <= today) && suggestion === null) {
          st.nextDue = Rules.addDays(today, Hub.settings().follow_up_days);
          if (!st.nextText || st.nextText === s.next_action) st.nextText = '';
        }
      }

      function needsNext() {
        const s = sponsor();
        return !!s && Rules.requiresNextAction(s.stage);
      }

      /** @returns {string} why Save is disabled, or '' */
      function problem() {
        if (!sponsor()) return 'Pick a sponsor.';
        if (!st.kind) return 'Pick what kind of touch it was.';
        if (!st.summary.trim()) return 'Write one sentence.';
        if (needsNext()) {
          if (!st.nextText.trim()) return 'Say what happens next.';
          if (!Rules.isIsoDate(st.nextDue)) return 'Pick when the next step is due.';
        }
        return '';
      }

      const api = Hub.openSheet({
        manual: true,
        title: 'Log a touch',
        size: 'tall',
        isDirty: function () {
          return !!st.summary.trim();
        },
        render: render,
        foot: foot,
      });

      function render(body) {
        const s = sponsor();
        if (!s) {
          renderPicker(body);
          return;
        }
        api.setTitle('Log a touch');
        if (st.error) {
          Hub.add(body, h('div', { class: 'banner error', style: 'margin-bottom:12px' }, h('div', { class: 'grow' }, st.error.replace(/^Not saved\. /, 'Not saved: '))));
        }
        Hub.add(body, 
          h(
            'div',
            { class: 'picked' },
            Hub.avatar(s.owner_id),
            h('div', { class: 'grow' }, h('div', { class: 'row-title' }, s.name), h('div', { class: 'row-meta' }, Hub.stageChip(s.stage), s.next_action ? h('span', { class: 'row-sub' }, s.next_action) : null)),
            h(
              'button',
              {
                type: 'button',
                class: 'btn btn-ghost btn-sm',
                onClick: function () {
                  st.sponsorId = null;
                  st.nextTouched = false;
                  api.refresh();
                },
              },
              'Change'
            )
          )
        );
        // Kind
        Hub.add(body, h('div', { class: 'block-label' }, 'What happened'));
        const kinds = KINDS.concat(st.moreKinds ? MORE_KINDS : []);
        Hub.add(body, 
          h(
            'div',
            { class: 'kind-grid', role: 'group', 'aria-label': 'Kind of touch' },
            kinds.map(function (k) {
              return h(
                'button',
                {
                  type: 'button',
                  class: 'kind-btn',
                  'aria-pressed': st.kind === k ? 'true' : 'false',
                  onClick: function () {
                    st.kind = k;
                    st.nextTouched = false;
                    proposeNext();
                    api.refresh();
                    const area = api.body.querySelector('[data-key="log-summary"]');
                    if (area && !st.summary) area.focus();
                  },
                },
                Hub.icon(k),
                Rules.KIND_LABEL[k]
              );
            })
          ),
          st.moreKinds
            ? null
            : h(
                'button',
                {
                  type: 'button',
                  class: 'btn btn-ghost btn-xs',
                  style: 'margin-top:6px',
                  onClick: function () {
                    st.moreKinds = true;
                    api.refresh();
                  },
                },
                'More: Commitment, Note'
              )
        );
        // Summary
        Hub.add(body, h('div', { class: 'block-label' }, 'In one sentence'));
        const area = h('textarea', {
          class: 'textarea one-line',
          'data-key': 'log-summary',
          rows: 2,
          maxlength: 2000,
          'aria-label': 'What happened, in one sentence',
          placeholder: PLACEHOLDER[st.kind] || 'What happened, in one sentence',
          value: st.summary,
          onInput: function (e) {
            st.summary = e.target.value;
            updateFoot();
          },
        });
        Hub.add(body, area);
        // Date
        const dateChips = o.backdate ? weekChips() : [
          { label: 'Today', date: today },
          { label: 'Yesterday', date: Rules.addDays(today, -1) },
        ];
        Hub.add(body, 
          h('div', { style: 'margin-top:10px' }, Hub.dateChips({
            value: st.happenedOn,
            chips: dateChips,
            onPick: function (d) {
              if (d > today) {
                Hub.toast({ error: true, text: 'Pick today or an earlier day.' });
                return;
              }
              st.happenedOn = d;
              api.refresh();
            },
          }))
        );
        // Who did it (vp logging for a coordinator)
        if (Hub.isVp()) {
          const people = Hub.activeMembers().filter(function (m) {
            return Rules.roleAtLeast(m.role, 'coordinator');
          });
          Hub.add(body, 
            h('div', { class: 'block-label' }, 'Who did this'),
            h(
              'div',
              { class: 'suggest-chips' },
              people.map(function (m) {
                return h(
                  'button',
                  {
                    type: 'button',
                    'aria-pressed': st.memberId === m.id ? 'true' : 'false',
                    style: st.memberId === m.id ? 'background:var(--text);color:var(--surface);border-color:var(--text)' : null,
                    onClick: function () {
                      st.memberId = m.id;
                      api.refresh();
                    },
                  },
                  m.id === me.id ? 'Me' : Rules.firstName(m.full_name)
                );
              })
            )
          );
        }
        // Next
        if (needsNext() && st.kind) {
          Hub.add(body, h('div', { class: 'block-label' }, 'Next step'));
          if (!st.nextOpen) {
            Hub.add(body, 
              h(
                'div',
                { class: 'next-line' },
                Hub.icon('next', 18),
                h('span', { class: 'grow' }, h('strong', null, st.nextText || 'No next action'), st.nextDue ? ' · ' + Rules.dayLabel(st.nextDue) : ''),
                h(
                  'button',
                  {
                    type: 'button',
                    class: 'btn btn-ghost btn-xs',
                    onClick: function () {
                      st.nextOpen = true;
                      api.refresh();
                    },
                  },
                  'Change'
                )
              )
            );
          } else {
            Hub.add(body, 
              h('input', {
                class: 'input',
                'data-key': 'log-next',
                'aria-label': 'Next action',
                placeholder: 'e.g. Follow-up 1 (add something new)',
                value: st.nextText,
                maxlength: 300,
                onInput: function (e) {
                  st.nextText = e.target.value;
                  st.nextTouched = true;
                  updateFoot();
                },
              }),
              h('div', { style: 'margin-top:8px' }, Hub.dateChips({
                value: st.nextDue,
                onPick: function (d) {
                  st.nextDue = d;
                  st.nextTouched = true;
                  api.refresh();
                },
              }))
            );
          }
        }
      }

      function weekChips() {
        // This week so far; on a Monday, the weekend too (touches logged before the meeting).
        const monday = Rules.reportWeekDate(today, null) !== today;
        const start = monday ? Rules.addDays(today, -3) : Rules.weekRange(today).start;
        const out = [];
        for (let d = start; d <= today; d = Rules.addDays(d, 1)) {
          out.push({ label: d === today ? 'Today' : Rules.dayLabel(d).slice(0, 3), date: d });
        }
        return out;
      }

      function renderPicker(body) {
        api.setTitle('Log a touch: who?');
        const results = h('div');
        const input = h('input', {
          class: 'input',
          type: 'search',
          'data-key': 'log-search',
          'data-autofocus': 'true',
          autocomplete: 'off',
          'aria-label': 'Search sponsors',
          placeholder: 'Type a sponsor or contact name',
          value: st.query,
          onInput: function (e) {
            st.query = e.target.value;
            fill();
          },
        });
        Hub.add(body, h('div', { class: 'search' }, Hub.icon('search'), input), results);
        function pick(id) {
          st.sponsorId = id;
          st.query = '';
          defaultKind();
          proposeNext();
          api.refresh();
        }
        function fill() {
          results.replaceChildren();
          const q = st.query.trim();
          if (q.length >= 1) {
            const found = Rules.searchSponsors(q, Hub.rows('Sponsors'), 8);
            if (found.length) Hub.add(results, h('ul', { class: 'result-list' }, found.map(function (s) { return sponsorResult(s, pick); })));
            const exact = Rules.findSimilarSponsors(q, Hub.rows('Sponsors')).exact;
            if (!exact && q.length >= 2) {
              Hub.add(results, 
                h(
                  'button',
                  {
                    type: 'button',
                    class: 'btn btn-soft btn-block',
                    style: 'margin-top:10px;justify-content:flex-start',
                    onClick: function () {
                      Hub.openAddSponsor({
                        name: q,
                        fromLog: true,
                        onSaved: function (id) {
                          pick(id);
                        },
                      });
                    },
                  },
                  Hub.icon('plus'),
                  'Add “' + q + '” as a new sponsor'
                )
              );
            }
            if (!found.length && q.length < 2) Hub.add(results, h('p', { class: 'muted small', style: 'margin-top:10px' }, 'Keep typing…'));
            return;
          }
          const chips = suggestions();
          if (chips.length) {
            Hub.add(results, h('div', { class: 'block-label', style: 'margin-top:14px' }, 'Suggestions'));
            Hub.add(results, 
              h(
                'ul',
                { class: 'result-list' },
                chips.map(function (c) {
                  return h(
                    'li',
                    null,
                    h(
                      'button',
                      { type: 'button', onClick: function () { pick(c.sponsor.id); } },
                      Hub.avatar(c.sponsor.owner_id),
                      h('span', { class: 'grow' }, h('span', { class: 'row-title', style: 'display:block' }, c.sponsor.name), h('span', { class: 'row-sub', style: 'display:block' }, c.why + (c.sponsor.next_action ? ' · ' + c.sponsor.next_action : ''))),
                      Hub.stageChip(c.sponsor.stage)
                    )
                  );
                })
              )
            );
          } else {
            Hub.add(results, h('p', { class: 'muted small', style: 'margin-top:12px' }, 'Type to find a sponsor, or add a new one.'));
          }
        }
        fill();
        // Focus now, inside the tap that opened the sheet: iOS only shows the keyboard then.
        try {
          input.focus({ preventScroll: true });
        } catch (err) {
          // not focusable
        }
      }

      let saveBtn = null;
      let reason = null;
      function foot(f) {
        if (!sponsor()) return;
        reason = h('div', { class: 'problem', style: 'margin:0;align-self:center', role: 'status' });
        saveBtn = h('button', { type: 'button', class: 'btn btn-primary-wide', onClick: save }, 'Save');
        Hub.add(f, h('div', { class: 'grow', style: 'display:flex;flex-direction:column;gap:6px' }, saveBtn, reason));
        updateFoot();
      }

      function updateFoot() {
        if (!saveBtn) return;
        const p = problem();
        saveBtn.disabled = !!p;
        reason.textContent = p && (st.kind || st.summary) ? p : '';
      }

      function save() {
        if (problem()) return;
        const s = sponsor();
        api.close('saved');
        saveTouch({
          sponsorId: s.id,
          kind: st.kind,
          summary: st.summary.trim(),
          happenedOn: st.happenedOn,
          memberId: st.memberId,
          seen: st.seen,
          nextText: needsNext() ? st.nextText.trim() : undefined,
          nextDue: needsNext() ? st.nextDue : undefined,
          onLogged: o.onLogged,
          onRefused: function (message) {
            openLog({
              sponsorId: s.id,
              kind: st.kind,
              summary: st.summary,
              error: message,
            });
          },
        });
      }

      proposeNext();
      api.refresh();
      return api;
    }

    /**
     * Saves a touch the way every screen does it (PLAN §10.2, §10.3): shown at once, sent after a
     * five-second Undo window, kept on the phone until it is saved, then at most one question.
     * @param {{sponsorId: string, kind: string, summary: string, happenedOn?: string, memberId?: string,
     *   nextText?: string, nextDue?: string, seen?: string, onLogged?: Function,
     *   onRefused?: function(string): void}} t  seen: the sponsor's updated_at the next action was
     *   proposed from (left out: now)
     * @returns {Object|null} the save handle
     */
    function saveTouch(t) {
      const me = Hub.state.me;
      const today = Hub.today();
      const s = Hub.byId('Sponsors', t.sponsorId);
      if (!s) return null;
      const happenedOn = t.happenedOn || today;
      const memberId = t.memberId || me.id;
      const seen = t.seen !== undefined ? t.seen : Hub.versionOf('Sponsors', s.id);
      const id = Hub.uuid();
      const input = { id: id, sponsor_id: s.id, kind: t.kind, summary: t.summary, happened_on: happenedOn };
      if (memberId !== me.id) input.member_id = memberId;
      const sendNext =
        Rules.requiresNextAction(s.stage) &&
        t.nextText !== undefined &&
        (t.nextText !== (s.next_action || '') || t.nextDue !== (s.next_action_due || ''));
      if (sendNext) {
        input.next_action = t.nextText;
        input.next_action_due = t.nextDue;
      }
      const patch = {};
      if (t.kind !== 'note' && (!Rules.isIsoDate(s.last_contact_at) || happenedOn > s.last_contact_at)) patch.last_contact_at = happenedOn;
      if (sendNext) {
        patch.next_action = input.next_action;
        patch.next_action_due = input.next_action_due;
      }
      const row = {
        id: id,
        sponsor_id: s.id,
        member_id: memberId,
        happened_on: happenedOn,
        kind: t.kind,
        summary: t.summary,
        from_stage: '',
        to_stage: '',
        created_at: Hub.nowIso(),
        updated_at: '',
        updated_by: me.id,
      };
      // What is kept on the phone carries the version the person saw, so a touch replayed after a
      // reload saves its next action only if nobody changed the sponsor in between.
      const kept = Object.assign({}, input, sendNext ? { expectedUpdatedAt: seen } : {});
      Hub.setPref('lastKind', t.kind);
      rememberSponsor(s.id);
      const handle = Hub.save({
        what: s.name,
        inserts: [{ tab: 'Activity', row: row }],
        changes: Object.keys(patch).length ? [{ tab: 'Sponsors', id: s.id, patch: patch }] : [],
        hold: 5000,
        persist: { fn: 'logTouch', args: [kept] },
        send: function () {
          const args = Object.assign({}, input);
          if (sendNext) args.expectedUpdatedAt = Hub.sendVersion('Sponsors', s.id, seen);
          return Hub.call('logTouch', args);
        },
        onConflict: function () {
          Hub.toast({ error: true, text: 'Touch saved. Someone changed ' + s.name + ' just before, so the next action was not; the latest is showing.', ms: 10000 });
        },
        failed: t.onRefused,
        done: function () {
          if (t.onLogged) t.onLogged();
        },
      });
      // At most one question (PLAN §10.3), never twice in a session for the same sponsor.
      const after = Object.assign({}, s, patch);
      const step = Rules.nextStepFor(after, t.kind, Hub.activitiesFor(s.id), today, Hub.settings().follow_up_days);
      const flag = step ? 'prompt:' + s.id + ':' + step.key : '';
      const prompt =
        step && !Hub.sessionFlag(flag)
          ? {
              label: step.label,
              detail: step.detail,
              yes: function () {
                // Opens the stage dialog filled in; one more tap saves it (PLAN §10.3).
                handle.release();
                Hub.openStage(s.id, { preselect: step.toStage, input: step.input });
              },
              no: function () {
                Hub.setSessionFlag(flag);
              },
            }
          : null;
      Hub.toast({
        text: 'Saved · ' + s.name + ' · ' + Rules.KIND_LABEL[t.kind],
        action: {
          label: 'Undo',
          fn: function () {
            if (handle.cancel()) Hub.toast({ text: 'Touch removed.', ms: 2500 });
            else Hub.toast({ text: 'Already saved. A VP can delete it in the Sheet.', ms: 5000 });
          },
        },
        prompt: prompt,
      });
      return handle;
    }

    /**
     * Logs a touch in one tap, with the next step the rules propose ("I sent it", PLAN §10.8).
     * @param {string} sponsorId
     * @param {string} kind
     * @param {string} summary
     */
    function quickTouch(sponsorId, kind, summary) {
      const s = Hub.byId('Sponsors', sponsorId);
      if (!s) return null;
      const today = Hub.today();
      const acts = Hub.activitiesFor(s.id).concat([{ kind: kind, happened_on: today }]);
      const next = Rules.nextActionAfterTouch(s, kind, acts, today, Hub.settings().follow_up_days);
      const keepCurrent = Rules.isIsoDate(s.next_action_due) && s.next_action_due > today && s.next_action;
      return saveTouch({
        sponsorId: s.id,
        kind: kind,
        summary: summary,
        nextText: next ? next.next_action : keepCurrent ? s.next_action : undefined,
        nextDue: next ? next.next_action_due : keepCurrent ? s.next_action_due : undefined,
        onRefused: function (message) {
          openLog({ sponsorId: s.id, kind: kind, summary: summary, error: message });
        },
      });
    }

    // ---- Add sponsor (one form, two ways in) -------------------------------------------------

    /**
     * @param {{name?: string, fromLog?: boolean, onSaved?: function(string): void, eventId?: string, needId?: string}} [opts]
     */
    function openAddSponsor(opts) {
      const o = opts || {};
      const me = Hub.state.me;
      const today = Hub.today();
      const set = Hub.settings();
      const f = {
        name: o.name || '',
        category: o.fromLog ? 'cafe-bakery' : '',
        warm_intro: '',
        owner_id: me.id,
        stage: 'target',
        priority: 'B',
        next_action: o.fromLog ? 'Follow up after first touch' : 'Research and find a contact',
        next_action_due: o.fromLog ? Rules.addDays(today, set.follow_up_days) : Rules.addDays(today, 7),
        contact_name: '',
        contact_title: '',
        contact_email: '',
        contact_phone: '',
        website: '',
        address: '',
        neighbourhood: Hub.pref('lastNeighbourhood', ''),
        is_past_sponsor: false,
        past_notes: '',
        ask_type: '',
        ask_summary: '',
        potential_value_cad: '',
        supports_dtes: false,
      };
      Rules.FIT_FIELDS.forEach(function (k) {
        f[k] = '';
      });
      const st = { eventId: o.eventId || '', needId: o.needId || '', showContact: false, showMore: false };

      function problems() {
        const fields = Object.assign({}, f);
        const out = Rules.validateSponsor(fields, { requireOwner: !Hub.isVp() });
        const similar = Rules.findSimilarSponsors(f.name, Hub.rows('Sponsors'));
        if (similar.exact) out.unshift({ field: 'name', message: 'Already here: ' + similar.exact.name + '.' });
        return out;
      }

      const api = Hub.openSheet({
        manual: true,
        title: 'Add a sponsor',
        size: 'tall',
        isDirty: function () {
          return !!f.name.trim();
        },
        render: render,
        foot: foot,
      });

      function text(key, label, attrs) {
        return Hub.field(
          label,
          h(
            'input',
            Object.assign(
              {
                class: 'input',
                'data-key': 'add-' + key,
                value: f[key],
                onInput: function (e) {
                  f[key] = e.target.value;
                  if (key === 'name') updateSimilar();
                  updateFoot();
                },
              },
              attrs || {}
            )
          )
        );
      }

      let similarBox = null;
      function updateSimilar() {
        if (!similarBox) return;
        similarBox.replaceChildren();
        const sim = Rules.findSimilarSponsors(f.name, Hub.rows('Sponsors'));
        const list = (sim.exact ? [sim.exact] : []).concat(sim.similar);
        if (!list.length) return;
        Hub.add(similarBox, 
          h(
            'div',
            { class: 'banner ' + (sim.exact ? 'error' : 'info') },
            h(
              'div',
              { class: 'grow' },
              h('p', null, sim.exact ? 'Already in the Hub:' : 'Similar names already in the Hub:'),
              list.map(function (s) {
                return h(
                  'div',
                  { class: 'hstack', style: 'margin-top:6px' },
                  h('strong', { class: 'grow truncate' }, s.name),
                  h(
                    'button',
                    {
                      type: 'button',
                      class: 'btn btn-secondary btn-xs',
                      onClick: function () {
                        api.close('open');
                        if (o.fromLog && o.onSaved) o.onSaved(s.id);
                        else Hub.go('sponsor', s.id);
                      },
                    },
                    o.fromLog ? 'Use this one' : 'Open'
                  )
                );
              })
            )
          )
        );
      }

      function render(body) {
        Hub.add(body, text('name', 'Name', { placeholder: 'e.g. Nemesis Coffee', 'data-autofocus': 'true', maxlength: 200 }));
        similarBox = h('div', { style: 'margin:-6px 0 12px' });
        Hub.add(body, similarBox);
        updateSimilar();
        Hub.add(body, 
          h('div', { class: 'field' },
            h('span', { class: 'label' }, 'Category'),
            h(
              'div',
              { class: 'suggest-chips' },
              Rules.ENUMS.category.map(function (c) {
                return h(
                  'button',
                  {
                    type: 'button',
                    'aria-pressed': f.category === c ? 'true' : 'false',
                    style: f.category === c ? 'background:var(--text);color:var(--surface);border-color:var(--text)' : null,
                    onClick: function () {
                      f.category = c;
                      api.refresh();
                    },
                  },
                  Rules.CATEGORY_LABEL[c]
                );
              })
            )
          ),
          text('warm_intro', 'How do we know them? (optional)', { placeholder: 'Past sponsor, a friend of Ricardo, walked in…', maxlength: 300 })
        );
        // Owner
        const owners = Hub.activeMembers().filter(function (m) {
          return Rules.roleAtLeast(m.role, 'coordinator');
        });
        Hub.add(body, 
          Hub.field(
            'Owner',
            h(
              'select',
              {
                class: 'select',
                onChange: function (e) {
                  f.owner_id = e.target.value;
                  updateFoot();
                },
              },
              Hub.isVp() ? h('option', { value: '' }, 'Unassigned (assign later)') : null,
              owners.map(function (m) {
                const opt = h('option', { value: m.id }, m.id === me.id ? m.full_name + ' (me)' : m.full_name);
                if (m.id === f.owner_id) opt.selected = true;
                return opt;
              })
            )
          )
        );
        // Stage and priority
        const prospectAndOutreach = Rules.stagesIn('Prospect').concat(Rules.stagesIn('Outreach'));
        const sug = Rules.suggestPriority(f);
        const anyFit = Rules.FIT_FIELDS.some(function (k) {
          return f[k] !== '';
        });
        Hub.add(
          body,
          h(
            'div',
            { class: 'fill-grid' },
            Hub.field(
              'Stage',
              h(
                'select',
                {
                  class: 'select',
                  onChange: function (e) {
                    f.stage = e.target.value;
                    updateFoot();
                  },
                },
                prospectAndOutreach.map(function (st0) {
                  const opt = h('option', { value: st0 }, Rules.STAGE_LABEL[st0]);
                  if (st0 === f.stage) opt.selected = true;
                  return opt;
                })
              ),
              { hint: 'Further along? Add it, then use the stage dialog.' }
            ),
            Hub.field(
              'Priority',
              h(
                'div',
                { class: 'hstack wrap' },
                Hub.seg(
                  Rules.ENUMS.priority.map(function (p) {
                    return { value: p, label: p };
                  }),
                  f.priority,
                  function (v) {
                    f.priority = v;
                    api.refresh();
                  },
                  'Priority'
                ),
                anyFit ? h('span', { class: 'muted small' }, 'Suggested: ' + sug.priority + ' (fit ' + sug.score + '/30)') : null
              )
            )
          )
        );
        // Next action
        Hub.add(body, 
          Hub.field(
            'Next action',
            h('div', null,
              h('input', {
                class: 'input',
                'data-key': 'add-next',
                value: f.next_action,
                maxlength: 300,
                onInput: function (e) {
                  f.next_action = e.target.value;
                  updateFoot();
                },
              }),
              h('div', { style: 'margin-top:8px' }, Hub.dateChips({
                value: f.next_action_due,
                onPick: function (d) {
                  f.next_action_due = d;
                  api.refresh();
                },
              }))
            )
          )
        );
        // Event (promoted: it drives event health)
        const upcoming = Hub.rows('Events')
          .filter(function (e) {
            return e.status !== 'done' && e.status !== 'cancelled' && (!Rules.isIsoDate(e.starts_on) || e.starts_on >= today) && Rules.daysBetween(today, e.starts_on) <= 120;
          })
          .sort(function (a, b) {
            return String(a.starts_on) < String(b.starts_on) ? -1 : 1;
          });
        if (upcoming.length) {
          Hub.add(body, 
            h('div', { class: 'field' },
              h('span', { class: 'label' }, 'For an event? (optional)'),
              h(
                'div',
                { class: 'suggest-chips' },
                upcoming.map(function (e) {
                  const on = st.eventId === e.id;
                  return h(
                    'button',
                    {
                      type: 'button',
                      'aria-pressed': on ? 'true' : 'false',
                      style: on ? 'background:var(--text);color:var(--surface);border-color:var(--text)' : null,
                      onClick: function () {
                        st.eventId = on ? '' : e.id;
                        st.needId = '';
                        api.refresh();
                      },
                    },
                    e.name
                  );
                })
              ),
              st.eventId ? needChips() : null
            )
          );
        }
        // Contact
        Hub.add(body, 
          disclosure('Got a contact?', st.showContact, function () {
            st.showContact = !st.showContact;
            api.refresh();
          }),
          st.showContact
            ? h('div', null,
                text('contact_name', 'Contact name', { autocomplete: 'off' }),
                text('contact_email', 'Email', { type: 'email', autocomplete: 'off' }),
                text('contact_phone', 'Phone', { type: 'tel', autocomplete: 'off' }))
            : null,
          disclosure('More fields', st.showMore, function () {
            st.showMore = !st.showMore;
            api.refresh();
          }),
          st.showMore ? moreFields() : null
        );
      }

      function needChips() {
        const needs = Hub.needsFor(st.eventId).filter(function (n) {
          return n.status === 'open';
        });
        if (!needs.length) return null;
        const coverage = Rules.needCoverage(needs, Hub.linksForEvent(st.eventId), Hub.rows('Sponsors'));
        return h(
          'div',
          { style: 'margin-top:8px' },
          h('div', { class: 'hint', style: 'margin:0 0 6px' }, 'Which need? (counts toward coverage once in Conversation)'),
          h(
            'div',
            { class: 'suggest-chips' },
            coverage.map(function (c) {
              const on = st.needId === c.need.id;
              return h(
                'button',
                {
                  type: 'button',
                  'aria-pressed': on ? 'true' : 'false',
                  style: on ? 'background:var(--accent);color:#fff;border-color:var(--accent)' : null,
                  onClick: function () {
                    st.needId = on ? '' : c.need.id;
                    if (!on && !f.ask_type) f.ask_type = c.need.ask_type;
                    api.refresh();
                  },
                },
                c.need.ask_type + ' ' + c.count + '/' + c.target
              );
            })
          )
        );
      }

      function moreFields() {
        return h(
          'div',
          null,
          text('contact_title', 'Contact title'),
          text('website', 'Website', { type: 'url', placeholder: 'https://' }),
          text('address', 'Address'),
          text('neighbourhood', 'Neighbourhood', { placeholder: 'e.g. Main St, UBC campus' }),
          Hub.field(
            'Ask type',
            h(
              'select',
              {
                class: 'select',
                onChange: function (e) {
                  f.ask_type = e.target.value;
                },
              },
              h('option', { value: '' }, 'Not decided'),
              Rules.ENUMS.ask_type.map(function (a) {
                const opt = h('option', { value: a }, a);
                if (a === f.ask_type) opt.selected = true;
                return opt;
              })
            )
          ),
          text('ask_summary', 'What we are asking for'),
          text('potential_value_cad', 'Potential value ($)', { type: 'number', min: 0, inputmode: 'numeric' }),
          h('label', { class: 'hstack', style: 'min-height:44px' },
            h('input', {
              type: 'checkbox',
              checked: f.is_past_sponsor,
              onChange: function (e) {
                f.is_past_sponsor = e.target.checked;
              },
            }),
            'Past sponsor'),
          text('past_notes', 'Past notes'),
          h('div', { class: 'block-label' }, 'Fit (0–5 each)'),
          Rules.FIT_FIELDS.map(function (k) {
            return fitStepper(k);
          }),
          h('label', { class: 'hstack', style: 'min-height:44px' },
            h('input', {
              type: 'checkbox',
              checked: f.supports_dtes,
              onChange: function (e) {
                f.supports_dtes = e.target.checked;
              },
            }),
            'Already supports the DTES or food security')
        );
      }

      function fitStepper(key) {
        return h(
          'div',
          { class: 'hstack', style: 'justify-content:space-between;margin-bottom:6px' },
          h('span', { class: 'small' }, FIT_LABEL[key]),
          h(
            'div',
            { class: 'stepper', role: 'group', 'aria-label': FIT_LABEL[key] },
            [0, 1, 2, 3, 4, 5].map(function (n) {
              return h(
                'button',
                {
                  type: 'button',
                  'aria-pressed': String(f[key]) === String(n) ? 'true' : 'false',
                  onClick: function () {
                    f[key] = String(f[key]) === String(n) ? '' : n;
                    api.refresh();
                  },
                },
                String(n)
              );
            })
          )
        );
      }

      let saveBtn = null;
      let reason = null;
      function foot(fEl) {
        reason = h('div', { class: 'problem', style: 'margin:0' });
        saveBtn = h('button', { type: 'button', class: 'btn btn-primary-wide', onClick: function () { save(false); } }, o.fromLog ? 'Save and log the touch' : 'Save');
        const second = o.fromLog ? null : h('button', { type: 'button', class: 'btn btn-secondary', onClick: function () { save(true); } }, 'Save and log');
        Hub.add(fEl, h('div', { class: 'grow', style: 'display:flex;flex-direction:column;gap:6px' }, h('div', { class: 'hstack' }, second, saveBtn), reason));
        updateFoot();
      }

      function updateFoot() {
        if (!saveBtn) return;
        const p = problems();
        saveBtn.disabled = !!p.length;
        saveBtn.parentNode.querySelectorAll('button').forEach(function (b) {
          b.disabled = !!p.length;
        });
        reason.textContent = p.length && f.name.trim() ? p[0].message : '';
      }

      function save(thenLog) {
        if (problems().length) return;
        const id = Hub.uuid();
        const fields = {};
        Object.keys(f).forEach(function (k) {
          if (f[k] !== '' && f[k] !== false) fields[k] = typeof f[k] === 'string' ? f[k].trim() : f[k];
        });
        fields.owner_id = f.owner_id;
        fields.stage = f.stage || 'target';
        if (fields.potential_value_cad !== undefined) fields.potential_value_cad = Number(fields.potential_value_cad);
        const links = st.eventId ? [{ event_id: st.eventId, event_need_id: st.needId || '' }] : [];
        if (f.neighbourhood) Hub.setPref('lastNeighbourhood', f.neighbourhood.trim());
        const row = Object.assign(
          {
            id: id,
            archived: false,
            last_contact_at: '',
            nurture_until: '',
            lost_reason: '',
            summary: '',
            deliverables_json: '',
            brief_json: '',
            created_at: Hub.nowIso(),
            updated_at: '',
            updated_by: me.id,
          },
          fields
        );
        const linkRows = links.map(function (l) {
          return { tab: 'SponsorEvents', row: { id: Hub.uuid(), sponsor_id: id, event_id: l.event_id, event_need_id: l.event_need_id } };
        });
        Hub.save({
          what: fields.name,
          inserts: [{ tab: 'Sponsors', row: row }].concat(linkRows),
          // Kept in this browser until saved, so a touch logged on it offline can follow it.
          persist: { fn: 'addSponsor', args: [Object.assign({ id: id }, fields), links], inserts: [{ tab: 'Sponsors', row: row }] },
          send: function () {
            return Hub.call('addSponsor', Object.assign({ id: id }, fields), links);
          },
          done: function (res) {
            // The server made its own link ids: drop the placeholders.
            linkRows.forEach(function (l) {
              if (Hub.state.data.SponsorEvents) delete Hub.state.data.SponsorEvents[l.row.id];
            });
            if (res && res.rows) Hub.mergeRows(res.rows, true);
            Hub.bump();
          },
        });
        rememberSponsor(id);
        api.close('saved');
        if (o.onSaved) {
          o.onSaved(id);
        } else {
          Hub.toast({ text: 'Added ' + fields.name, ms: 3000 });
          Hub.go('sponsor', id);
          if (thenLog) Hub.openLog({ sponsorId: id });
        }
      }

      api.refresh();
      return api;
    }

    const FIT_LABEL = {
      fit_strategic: 'Fits our mission',
      fit_likelihood: 'Likely to say yes',
      fit_value: 'Value to us',
      fit_access: 'We can reach them',
      fit_connection: 'Personal connection',
      fit_timing: 'Good timing',
    };

    /** A show/hide row for optional groups. */
    function disclosure(label, open, toggle) {
      return h(
        'button',
        {
          type: 'button',
          class: 'btn btn-ghost btn-sm',
          'aria-expanded': open ? 'true' : 'false',
          style: 'padding-left:0;margin:4px 0 8px',
          onClick: toggle,
        },
        Hub.icon(open ? 'close' : 'plus', 16),
        label
      );
    }

    Object.assign(Hub, {
      openLog: openLog,
      saveTouch: saveTouch,
      quickTouch: quickTouch,
      openAddSponsor: openAddSponsor,
      rememberSponsor: rememberSponsor,
      FIT_LABEL: FIT_LABEL,
      disclosure: disclosure,
    });
  })();
</script>

    <script>
  /*
   * Actions shared by every screen (docs/PLAN.md §10.4, §10.6, §10.7): the stage dialog, the
   * owner picker, rescheduling, tasks, attaching sponsors to events, and confirming terms.
   * Each saves optimistically through Hub.save and calls exactly one server function.
   */
  (function () {
    'use strict';
    const Hub = window.Hub;
    const h = Hub.h;

    // ---- Sponsor edits ---------------------------------------------------------------------

    /**
     * Saves some sponsor fields. A new owner also gets the derived next action (PLAN §10.6).
     * @param {string} id
     * @param {Object} patch
     * @param {{reapply?: Function, done?: Function, quiet?: boolean, seen?: string}} [opts]
     *   seen: the sponsor's updated_at when the editor opened (Hub.versionOf); left out, now
     */
    function updateSponsor(id, patch, opts) {
      const o = opts || {};
      const s = Hub.byId('Sponsors', id);
      if (!s) return null;
      const seen = o.seen !== undefined ? o.seen : Hub.versionOf('Sponsors', id);
      let local = Object.assign({}, patch);
      if (patch.owner_id !== undefined && patch.owner_id !== s.owner_id) {
        local = Object.assign(local, Rules.ownerAssignedPatch(s, patch.owner_id, Hub.today()));
      }
      return Hub.save({
        what: s.name,
        changes: [{ tab: 'Sponsors', id: id, patch: local }],
        send: function () {
          return Hub.call('updateSponsor', id, patch, Hub.sendVersion('Sponsors', id, seen));
        },
        reapply: o.reapply,
        done: o.done,
      });
    }

    /**
     * Moves a sponsor to a stage; the server re-runs the rule and creates any follow-through tasks.
     * @param {string} id
     * @param {string} toStage
     * @param {Object} input
     * @param {string} [seen] the sponsor's updated_at when the dialog opened; left out, now
     */
    function changeStage(id, toStage, input, seen) {
      const s = Hub.byId('Sponsors', id);
      if (!s) return null;
      const from = seen !== undefined ? seen : Hub.versionOf('Sponsors', id);
      const dry = dryRun(s, toStage, input || {});
      if (!dry.ok) {
        openStage(id, { preselect: toStage, input: input });
        return null;
      }
      Hub.rememberSponsor(id);
      return Hub.save({
        what: s.name,
        changes: [{ tab: 'Sponsors', id: id, patch: dry.patch }],
        send: function () {
          return Hub.call('changeStage', id, toStage, input || {}, Hub.sendVersion('Sponsors', id, from));
        },
        reapply: function () {
          openStage(id, { preselect: toStage, input: input });
        },
        done: function (res) {
          if (!res || !res.rows) return;
          const tasks = res.rows.Tasks || [];
          const label = 'Moved ' + s.name + ' to ' + Rules.STAGE_LABEL[toStage];
          Hub.toast({ text: tasks.length ? label + ' · ' + Hub.plural(tasks.length, 'task') + ' added' : label, ms: 4000 });
        },
      });
    }

    /** The same rule the server runs, so the Save button never lies. */
    function dryRun(s, toStage, input) {
      return Rules.applyStageChange(s, toStage, input, {
        today: Hub.today(),
        attachedEventCount: Hub.linksFor(s.id).length,
        activities: Hub.activitiesFor(s.id),
        followUpDays: Hub.settings().follow_up_days,
      });
    }

    /**
     * The stage dialog (PLAN §10.4): sixteen stages under five phases; picking one shows only the
     * fields that move needs, pre-filled; Save stays off until the rule is satisfied.
     * @param {string} id
     * @param {{preselect?: string, input?: Object}} [opts]
     */
    function openStage(id, opts) {
      const o = opts || {};
      const s0 = Hub.byId('Sponsors', id);
      if (!s0 || !Hub.canEdit()) return null;
      const today = Hub.today();
      const seen = Hub.versionOf('Sponsors', id);
      const given = Object.assign({}, o.input || {});
      const confirmedBy = given.terms_confirmed_by;
      delete given.terms_confirmed_by;
      const st = {
        to: o.preselect || '',
        input: given,
        // Values handed in (Reapply after a conflict, or a prompt's suggestion) are the person's:
        // prefill() must not replace them.
        touched: {},
        terms: !!confirmedBy,
        termsBy: '',
      };
      Object.keys(given).forEach(function (k) {
        st.touched[k] = true;
      });
      const vps = Hub.activeMembers().filter(function (m) {
        return m.role === 'vp';
      });
      st.termsBy = confirmedBy || (Hub.isVp() ? Hub.state.me.id : (Hub.leadVp() || vps[0] || {}).id || '');

      function sponsor() {
        return Hub.byId('Sponsors', id) || s0;
      }

      /** Fills the fields the chosen stage needs with sensible values. */
      function prefill() {
        const s = sponsor();
        const to = st.to;
        if (!to) return;
        const dry = dryRun(s, to, {});
        if (Rules.requiresNextAction(to)) {
          if (!st.touched.next_action) st.input.next_action = dry.suggestion ? dry.suggestion.next_action : s.next_action || '';
          if (!st.touched.next_action_due) {
            st.input.next_action_due = dry.suggestion
              ? dry.suggestion.next_action_due
              : Rules.isIsoDate(s.next_action_due) && s.next_action_due >= today
                ? s.next_action_due
                : Rules.addDays(today, Hub.settings().follow_up_days);
          }
        } else {
          delete st.input.next_action;
          delete st.input.next_action_due;
        }
        if (to === 'nurture' && !st.touched.nurture_until) st.input.nurture_until = Rules.addDays(today, 90);
        if (to !== 'nurture') delete st.input.nurture_until;
        if (to !== 'lost') delete st.input.lost_reason;
        if (Rules.TERMS_STAGES.indexOf(to) !== -1) {
          if (!st.touched.ask_summary && st.input.ask_summary === undefined) st.input.ask_summary = s.ask_summary || '';
        } else {
          delete st.input.ask_summary;
        }
        if (Rules.VALUE_STAGES.indexOf(to) !== -1) {
          if (!st.touched.potential_value_cad && st.input.potential_value_cad === undefined) {
            st.input.potential_value_cad = s.potential_value_cad === null || s.potential_value_cad === undefined ? '' : s.potential_value_cad;
          }
        } else {
          delete st.input.potential_value_cad;
        }
      }

      function input() {
        const out = {};
        Object.keys(st.input).forEach(function (k) {
          let v = st.input[k];
          if (k === 'potential_value_cad') v = v === '' || v === null || v === undefined ? '' : Number(v);
          out[k] = typeof v === 'string' ? v.trim() : v;
        });
        if (Rules.VALUE_STAGES.indexOf(st.to) !== -1 && st.terms && st.termsBy) out.terms_confirmed_by = st.termsBy;
        return out;
      }

      function problemText() {
        if (!st.to) return 'Pick a stage.';
        if (st.to === sponsor().stage && st.to !== 'nurture') return 'That is the stage it is in now.';
        const dry = dryRun(sponsor(), st.to, input());
        return dry.ok ? '' : dry.problems[0].message;
      }

      const api = Hub.openSheet({
        manual: true,
        title: 'Move ' + s0.name,
        size: 'tall wide',
        isDirty: function () {
          return Object.keys(st.touched).length > 0;
        },
        render: render,
        foot: foot,
      });

      function render(body) {
        const s = sponsor();
        Rules.PHASES.forEach(function (phase) {
          Hub.add(body, 
            h(
              'div',
              { class: 'stage-group' },
              h('h3', null, h('span', { class: 'chip ' + Hub.phaseClass(phase) }, phase)),
              h(
                'div',
                { class: 'stage-options' },
                Rules.stagesIn(phase).map(function (stage) {
                  return h(
                    'button',
                    {
                      type: 'button',
                      class: 'stage-opt' + (stage === s.stage ? ' current' : ''),
                      'aria-pressed': st.to === stage ? 'true' : 'false',
                      onClick: function () {
                        st.to = stage;
                        prefill();
                        api.refresh();
                        const first = api.body.querySelector('[data-stage-fields]');
                        if (first) first.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                      },
                    },
                    Rules.STAGE_LABEL[stage]
                  );
                })
              )
            )
          );
        });
        if (!st.to) return;
        const box = h('div', { 'data-stage-fields': 'true', style: 'margin-top:18px;padding-top:14px;border-top:1px solid var(--line)' });
        Hub.add(body, box);
        if (Rules.requiresNextAction(st.to)) {
          Hub.add(box, 
            Hub.field(
              'Next action',
              h('div', null,
                textInput('next_action', { placeholder: 'What happens next?', maxlength: 300 }),
                h('div', { style: 'margin-top:8px' }, Hub.dateChips({
                  value: st.input.next_action_due,
                  onPick: function (d) {
                    st.input.next_action_due = d;
                    st.touched.next_action_due = true;
                    api.refresh();
                  },
                }))
              )
            )
          );
        }
        if (st.to === 'lost') {
